<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporal Reflection Memory Scope</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05070d;color:#edf5ff;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:590px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#83e9ff}.title{margin:7px 0;font-size:clamp(23px,3.8vw,45px);line-height:1.02}.meta{color:#bfd2df}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #356a7d;border-radius:999px;color:#d1f4ff}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#c5d8e8}</style>
<canvas></canvas><div class="hud"><div class="ey">TRAA HISTORY × VELOCITY × SSR — 31 OCT 2026</div><div class="title">Reflection is not copied.<br>It remembers where you moved.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: camera / reflection drift</span><span class="tag">click / space: memory cut</span><span class="tag">1–4: isolate passes</span></div></div><div class="keys">1 velocity &nbsp; 2 history &nbsp; 3 reflection &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),gl=c.getContext('webgl');let px=.5,py=.5,mode=4,pulse=0,last=0;
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 r,m;uniform float t,cut,view;float h(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5);}float sdBox(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;vec2 q=uv;float time=t*.001;vec2 cam=(m-.5)*vec2(1.35,.76);q-=cam*.32;float floor=sin(q.x*9.+time*.7)+sin(q.y*12.-time*.45);float velocity=sin((q.x+q.y)*20.-time*3.)*.5+.5;float slab=sdBox(q-vec2(0.,-.04),vec2(.37,.20));float object=smoothstep(.025,-.012,slab);float trail=exp(-8.*length(q+cam*.22-vec2(sin(time*.7)*.16,cos(time*.51)*.08)));float hist=exp(-20.*abs(fract(q.x*3.+q.y*2.-time*.18)-.5))*smoothstep(.65,.05,length(q));float refl=pow(max(0.,1.-abs(q.y+.17+sin(q.x*5.+time)*.065)*9.),2.)*(.28+.72*object);vec3 v=mix(vec3(.02,.04,.09),vec3(.08,.33,.48),velocity);if(view<1.5)v=mix(vec3(.01,.02,.05),vec3(.1,.9,1.),velocity)*(.2+trail);else if(view<2.5)v=vec3(.06,.22,.35)*hist+vec3(.5,.16,.72)*trail;else if(view<3.5)v=vec3(.03,.10,.16)+vec3(.14,.82,1.)*refl+vec3(.55,.12,.73)*hist*.25;else v+=vec3(.10,.86,1.)*(refl+trail*.6)+vec3(.72,.16,.92)*hist*.36;v+=cut*vec3(.25,.7,1.)*exp(-5.*length(q));v+=h(floor(q*110.))*0.045;gl_FragColor=vec4(v,1.);}`;
function sh(type,s){let z=gl.createShader(type);gl.shaderSource(z,s);gl.compileShader(z);return z}let p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let U=k=>gl.getUniformLocation(p,k);let ur=U('r'),um=U('m'),ut=U('t'),uc=U('cut'),uv=U('view');
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=1-e.clientY/innerHeight});function fire(){pulse=1}addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.key===' ')fire();if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000||0);last=now;pulse*=Math.exp(-dt*1.2);gl.uniform2f(ur,c.width,c.height);gl.uniform2f(um,px,py);gl.uniform1f(ut,now);gl.uniform1f(uc,pulse);gl.uniform1f(uv,mode);gl.drawArrays(gl.TRIANGLES,0,3);document.querySelector('#meta').textContent=`view offset ${Math.round((px-.5)*100)} · velocity coherence ${Math.round((1-Math.abs(py-.5)*1.6)*100)}% · history ${mode===2||mode===4?'swapped':'held'} · cut ${Math.round(pulse*100)}%`}requestAnimationFrame(loop);
</script></html>
