<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Splat Afterglow</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0a070d;color:#fff4e7;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:560px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#ffb56d}.title{margin:7px 0;font-size:clamp(23px,3.8vw,45px);line-height:1.02}.meta{color:#ead4be}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #85533c;border-radius:999px;color:#ffe5bd}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#f0d8c6}</style>
<canvas></canvas><div class="hud"><div class="ey">GPU TIMESTAMP × SPLAT DEPTH SORT — 31 OCT 2026</div><div class="title">Let costly frames<br>leave a warmer constellation.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: focus / sort centre</span><span class="tag">click / space: timestamp stamp</span><span class="tag">1–4: isolate passes</span></div></div><div class="keys">1 time &nbsp; 2 depth sort &nbsp; 3 afterglow &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,last=0,stamps=[];function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();function stamp(){stamps.push({x,y,t:performance.now(),ms:8+Math.random()*20});stamps=stamps.slice(-24)}addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',stamp);addEventListener('keydown',e=>{if(e.key===' ')stamp();if(+e.key>0&&+e.key<5)mode=+e.key});function loop(t){requestAnimationFrame(loop);let w=innerWidth,h=innerHeight,T=t*.001,show=n=>mode===4||mode===n;g.fillStyle='#0a070d';g.fillRect(0,0,w,h);let fx=x*w,fy=y*h,frame=10+Math.abs(Math.sin(T*.9))*10+stamps.length*.34;if(show(1)){for(let i=0;i<46;i++){let q=i/45,ms=6+Math.max(0,1-Math.abs(q-y)*5)*18+Math.sin(T*4+i)*2;g.fillStyle=`hsla(${35+q*40},95%,${45+ms}%,.55)`;g.fillRect(w*.12,h*(.22+q*.54),ms*w*.018,3)}}if(show(2)){let pts=[];for(let i=0;i<340;i++){let a=i*2.399+T*.12,r=Math.sqrt((i*37%331)/331)*Math.min(w,h)*.42,px=w*.5+Math.cos(a)*r,py=h*.56+Math.sin(a)*r*.58,d=Math.hypot(px-fx,py-fy);pts.push([d,px,py])}pts.sort((a,b)=>b[0]-a[0]);pts.forEach((v,i)=>{let k=1-i/340;g.fillStyle=`hsla(${190+k*70},90%,${40+k*38}%,${.08+k*.55})`;g.beginPath();g.arc(v[1],v[2],1+k*4,0,7);g.fill()})}if(show(3))stamps.forEach((s,i)=>{let age=Math.min(1,(t-s.t)/3400),sx=s.x*w,sy=s.y*h;g.strokeStyle=`hsla(${18+i*9},100%,70%,${(1-age)*.55})`;g.lineWidth=2+(1-age)*4;g.beginPath();g.arc(sx,sy,22+age*180+s.ms*2,0,7);g.stroke()});if(show(4)){let z=g.createRadialGradient(fx,fy,2,fx,fy,Math.min(w,h)*.5);z.addColorStop(0,'rgba(255,180,92,.20)');z.addColorStop(.38,'rgba(255,65,134,.06)');z.addColorStop(1,'rgba(10,7,13,0)');g.fillStyle=z;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`estimated GPU frame ${frame.toFixed(1)}ms · depth sort ${mode===2||mode===4?'active':'paused'} · stamps ${stamps.length} · focus ${Math.round(x*100)},${Math.round(y*100)}`};requestAnimationFrame(loop);
</script></html>
