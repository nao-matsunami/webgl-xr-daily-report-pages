<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edge-Aware Fog Goo Scope</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06070a;
      color: #e8edf2;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 18px;
      top: 16px;
      max-width: min(520px, calc(100vw - 36px));
      color: rgba(235, 241, 247, 0.88);
      font-size: 12px;
      line-height: 1.55;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }
    .hud strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .meter {
      position: fixed;
      right: 18px;
      bottom: 16px;
      width: min(320px, calc(100vw - 36px));
      color: rgba(235, 241, 247, 0.78);
      font-size: 11px;
      line-height: 1.5;
      pointer-events: none;
      text-align: right;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.72);
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <strong>Edge-Aware Fog Goo Scope</strong>
    drag: fog light / goo attractor, click or space: impulse, keys 1-4: beauty / low-res fog / edge-aware resolve / sampler audit
  </div>
  <div class="meter" id="meter">mode 1 beauty resolve</div>
  <script>
    const canvas = document.getElementById("gl");
    const meter = document.getElementById("meter");
    const gl = canvas.getContext("webgl", { antialias: false, alpha: false });

    if (!gl) {
      document.body.textContent = "WebGL is not available.";
      throw new Error("WebGL unavailable");
    }

    const vertexSource = `
      attribute vec2 position;
      varying vec2 vUv;
      void main() {
        vUv = position * 0.5 + 0.5;
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;

      uniform vec2 resolution;
      uniform vec2 pointer;
      uniform float time;
      uniform float impulse;
      uniform int mode;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p = mat2(1.62, -1.16, 1.16, 1.62) * p + 0.37;
          a *= 0.52;
        }
        return v;
      }

      float sceneDepth(vec2 uv) {
        vec2 p = uv * 2.0 - 1.0;
        float ridge = sin(p.x * 5.2 + time * 0.18) * 0.09 + sin(p.y * 7.0 - time * 0.13) * 0.06;
        float goo = 0.0;
        for (int i = 0; i < 5; i++) {
          float fi = float(i);
          vec2 c = 0.46 * vec2(
            sin(time * (0.29 + fi * 0.04) + fi * 2.1),
            cos(time * (0.23 + fi * 0.05) + fi * 1.7)
          );
          c += (pointer * 2.0 - 1.0) * (0.08 + 0.025 * fi);
          float d = length(p - c);
          goo += (0.13 + impulse * 0.025) / (d * d + 0.055 + fi * 0.012);
        }
        float terrain = fbm(uv * vec2(4.0, 2.7) + vec2(time * 0.05, -time * 0.03));
        return clamp(0.18 + ridge + goo * 0.055 + terrain * 0.34, 0.0, 1.0);
      }

      vec3 normalFromDepth(vec2 uv) {
        vec2 px = 1.0 / resolution;
        float c = sceneDepth(uv);
        float dx = sceneDepth(uv + vec2(px.x * 2.0, 0.0)) - c;
        float dy = sceneDepth(uv + vec2(0.0, px.y * 2.0)) - c;
        return normalize(vec3(-dx * 8.5, -dy * 8.5, 1.0));
      }

      float lowResFog(vec2 uv) {
        vec2 cells = vec2(52.0, 30.0);
        vec2 q = (floor(uv * cells) + 0.5) / cells;
        float d = sceneDepth(q);
        float band = fbm(q * 9.0 + vec2(time * 0.1, time * 0.04));
        return smoothstep(0.26, 0.94, d + band * 0.36);
      }

      float edgeAwareFog(vec2 uv) {
        vec2 px = 1.0 / resolution;
        float centerDepth = sceneDepth(uv);
        float total = 0.0;
        float weightSum = 0.0;
        for (int y = -2; y <= 2; y++) {
          for (int x = -2; x <= 2; x++) {
            vec2 offset = vec2(float(x), float(y)) * px * 3.2;
            float sampleDepth = sceneDepth(uv + offset);
            float depthWeight = exp(-abs(sampleDepth - centerDepth) * 18.0);
            float spatialWeight = 1.0 / (1.0 + dot(offset * resolution / 3.2, offset * resolution / 3.2));
            float w = depthWeight * spatialWeight;
            total += lowResFog(uv + offset) * w;
            weightSum += w;
          }
        }
        return total / max(weightSum, 0.0001);
      }

      vec3 palette(float t) {
        vec3 a = vec3(0.08, 0.10, 0.15);
        vec3 b = vec3(0.25, 0.62, 0.72);
        vec3 c = vec3(0.98, 0.46, 0.28);
        vec3 d = vec3(0.92, 0.90, 0.66);
        return mix(mix(a, b, smoothstep(0.05, 0.64, t)), mix(c, d, t), smoothstep(0.62, 1.0, t));
      }

      void main() {
        vec2 uv = vUv;
        vec2 p = (uv * 2.0 - 1.0) * vec2(resolution.x / resolution.y, 1.0);
        float depth = sceneDepth(uv);
        vec3 n = normalFromDepth(uv);
        vec3 lightPos = vec3((pointer * 2.0 - 1.0) * vec2(resolution.x / resolution.y, 1.0), 0.82 + impulse * 0.25);
        vec3 pos = vec3(p, depth * 0.55);
        vec3 l = normalize(lightPos - pos);
        float lambert = clamp(dot(n, l), 0.0, 1.0);
        float rim = pow(1.0 - clamp(dot(n, vec3(0.0, 0.0, 1.0)), 0.0, 1.0), 2.2);
        float fogRaw = lowResFog(uv);
        float fogJbu = edgeAwareFog(uv);
        vec2 px = 1.0 / resolution;
        float edgeDelta = abs(sceneDepth(uv + vec2(px.x * 2.0, 0.0)) - depth) +
          abs(sceneDepth(uv + vec2(0.0, px.y * 2.0)) - depth);
        float edge = smoothstep(0.018, 0.075, edgeDelta * 18.0);
        float gooPulse = 0.5 + 0.5 * sin(time * 2.8 + depth * 18.0 + fbm(uv * 12.0) * 3.0);
        vec3 base = palette(depth + gooPulse * 0.08);
        vec3 lit = base * (0.26 + lambert * 1.24) + rim * vec3(0.35, 0.72, 1.0);
        vec3 fogColor = mix(vec3(0.14, 0.16, 0.22), vec3(0.72, 0.84, 0.92), uv.y);
        vec3 beauty = mix(lit, fogColor, fogJbu * 0.62);
        beauty += edge * vec3(0.9, 0.55, 0.25) * 0.22;
        beauty += impulse * exp(-length(p - lightPos.xy) * 4.0) * vec3(0.8, 0.3, 0.18);

        vec3 color = beauty;
        if (mode == 2) {
          vec2 cells = vec2(52.0, 30.0);
          vec2 grid = abs(fract(uv * cells) - 0.5);
          float line = smoothstep(0.47, 0.5, max(grid.x, grid.y));
          color = mix(vec3(fogRaw), vec3(0.1, 0.9, 0.7), line * 0.85);
        } else if (mode == 3) {
          color = mix(vec3(fogRaw, fogRaw * 0.55, 0.16), vec3(0.18, 0.66, 0.96), fogJbu);
          color += edge * vec3(1.0, 0.35, 0.1);
        } else if (mode == 4) {
          float phantom = step(0.87, fract((floor(uv.x * 10.0) + floor(uv.y * 6.0)) * 0.618 + time * 0.12));
          float audit = mix(fogJbu, fogRaw, phantom * 0.55);
          vec3 warn = mix(vec3(0.18, 0.2, 0.26), vec3(1.0, 0.35, 0.16), phantom);
          color = mix(warn, vec3(0.25, 0.86, 0.68), audit);
          color += edge * vec3(0.9);
        }

        color = pow(color, vec3(0.92));
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      time: gl.getUniformLocation(program, "time"),
      impulse: gl.getUniformLocation(program, "impulse"),
      mode: gl.getUniformLocation(program, "mode")
    };

    const state = {
      pointer: [0.62, 0.48],
      impulse: 0,
      mode: 1,
      started: performance.now()
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
      }
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      state.pointer[0] = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      state.pointer[1] = 1 - Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
    }

    window.addEventListener("pointermove", setPointer);
    window.addEventListener("pointerdown", (event) => {
      setPointer(event);
      state.impulse = 1;
    });
    window.addEventListener("keydown", (event) => {
      if (event.key >= "1" && event.key <= "4") state.mode = Number(event.key);
      if (event.code === "Space") state.impulse = 1;
    });

    const labels = {
      1: "mode 1 beauty resolve: edge-aware fog over procedural goo",
      2: "mode 2 low-res fog: visible RTT budget grid",
      3: "mode 3 edge-aware resolve: depth-guided upsample bands",
      4: "mode 4 sampler audit: phantom binding / stale pass warning map"
    };

    function frame(now) {
      resize();
      const t = (now - state.started) * 0.001;
      state.impulse *= 0.93;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, state.pointer[0], state.pointer[1]);
      gl.uniform1f(uniforms.time, t);
      gl.uniform1f(uniforms.impulse, state.impulse);
      gl.uniform1i(uniforms.mode, state.mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      meter.textContent = labels[state.mode];
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
<!-- mobile-preset-controls:v1 -->
<style>
  .mobile-preset-controls {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 2147483647;
    display: flex;
    justify-content: center;
    gap: 7px;
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .mobile-preset-controls button {
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    background: rgba(8, 10, 14, 0.68);
    color: rgba(255, 255, 255, 0.92);
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    touch-action: manipulation;
  }
  .mobile-preset-controls button:active,
  .mobile-preset-controls button.is-active {
    background: rgba(255, 221, 128, 0.86);
    color: #101014;
    border-color: rgba(255, 255, 255, 0.72);
  }
  @media (hover: hover) and (pointer: fine) {
    .mobile-preset-controls { opacity: 0.42; transition: opacity 160ms ease; }
    .mobile-preset-controls:hover { opacity: 1; }
  }
  @media (max-width: 520px) {
    .mobile-preset-controls { gap: 6px; }
    .mobile-preset-controls button { min-width: 34px; height: 36px; padding: 0 10px; font-size: 12px; }
  }
</style>
<div class="mobile-preset-controls" aria-label="Preset controls">
  <button type="button" data-mobile-key="1" aria-label="Preset 1">1</button>
  <button type="button" data-mobile-key="2" aria-label="Preset 2">2</button>
  <button type="button" data-mobile-key="3" aria-label="Preset 3">3</button>
  <button type="button" data-mobile-key="4" aria-label="Preset 4">4</button>
  <button type="button" data-mobile-key="5" aria-label="Preset 5">5</button>
  <button type="button" data-mobile-key="Space" aria-label="Pulse">Pulse</button>
</div>
<script>
(() => {
  const dock = document.currentScript.previousElementSibling;
  if (!dock || dock.dataset.ready === 'true') return;
  dock.dataset.ready = 'true';
  const sendKey = (keyName) => {
    const isSpace = keyName === 'Space';
    const key = isSpace ? ' ' : keyName;
    const code = isSpace ? 'Space' : 'Digit' + keyName;
    const eventInit = { key, code, bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    if (isSpace) {
      window.setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
      }, 140);
    }
  };
  dock.querySelectorAll('button').forEach((button) => {
    const keyName = button.dataset.mobileKey;
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      dock.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      sendKey(keyName);
    });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
  });
})();
</script>
</body>
</html>
