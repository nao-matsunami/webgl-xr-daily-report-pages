<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMREM Morph Light Score</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05050b;color:#eef5ff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:18px;left:18px;line-height:1.7;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #789;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>PMREM / MORPH LIGHT SCORE</b><br>pointer: light direction　<kbd>1</kbd> source <kbd>2</kbd> prefilter <kbd>3</kbd> morph <kbd>4</kbd> composite<br>click / space: launch a light cache beat<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s');let W,H,D,mode=4,p={x:.5,y:.5},beat=0,last=0;function rs(){W=innerWidth;H=innerHeight;D=devicePixelRatio;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')beat=1});
function orb(x,y,r,a,col){g.strokeStyle=col;g.lineWidth=1;g.beginPath();g.ellipse(x,y,r,r*.36,a,0,7);g.stroke()}function loop(t){let dt=Math.min(.05,(t-last)/1e3||0);last=t;beat=Math.max(0,beat-dt*.28);let q=t/1000,b=Math.min(W,H),cx=W*.5,cy=H*.54,ang=(p.x-.5)*1.7,lum=.35+.65*p.y;g.fillStyle='rgba(3,3,10,.2)';g.fillRect(0,0,W,H);if(mode!==3){for(let j=0;j<15;j++){let r=b*(.08+j*.026),a=ang+j*.12+q*.04;orb(cx,cy,r,a,`hsla(${195+j*5},75%,65%,${.09+j*.006})`)}}if(mode!==2){let lx=cx+Math.cos(ang)*b*.27,ly=cy+Math.sin(ang)*b*.12;let grad=g.createRadialGradient(lx,ly,0,lx,ly,b*.34);grad.addColorStop(0,`hsla(${28+110*(1-lum)},100%,${65+20*beat}%,.9)`);grad.addColorStop(.2,'rgba(90,185,255,.3)');grad.addColorStop(1,'rgba(10,30,70,0)');g.fillStyle=grad;g.fillRect(0,0,W,H);g.fillStyle='rgba(255,246,210,.9)';g.beginPath();g.arc(lx,ly,4+beat*8,0,7);g.fill()}if(mode!==1){for(let i=0;i<6;i++){let rr=b*(.07+i*.045+beat*.02),a=ang+i*.18;g.strokeStyle=`hsla(${35+i*34},95%,70%,${.22+i*.05})`;g.lineWidth=1+i*.5;g.beginPath();g.arc(cx,cy,rr,a,a+4.6);g.stroke()}}if(mode!==1&&mode!==2){for(let i=0;i<42;i++){let a=i*.51+q*.11,r=b*(.1+(i%7)*.045),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.4;let m=(Math.sin(q*1.4+i)*.5+.5)*beat;g.fillStyle=`hsla(${175+i*3},90%,${54+m*33}%,${.2+.5*m})`;g.beginPath();g.arc(x,y,1.5+m*4,0,7);g.fill()}g.strokeStyle='rgba(255,220,145,.7)';g.setLineDash([5,6]);g.beginPath();g.moveTo(cx-b*.37,cy+b*.28);g.lineTo(cx+b*.37,cy+b*.28);g.stroke();g.setLineDash([])}s.textContent=`mode ${mode} · PMREM mips 6 · morph ${Math.round(lum*100)}% · cache beat ${Math.round(beat*100)}%`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
