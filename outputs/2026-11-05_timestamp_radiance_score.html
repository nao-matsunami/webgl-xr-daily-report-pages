<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp Radiance Score</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050610;color:#d8edff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#hud{position:fixed;left:18px;top:16px;line-height:1.65;letter-spacing:.07em;pointer-events:none}b{color:#b7f6df}small{opacity:.62}</style><canvas></canvas><div id="hud"><b>TIMESTAMP RADIANCE / score</b><br><span id="readout">move = inspection light · click / space = pass marker</span><br><small>1 direct · 2 bounce · 3 composite · WebGL / GLSL</small></div><script>
const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:false}),o=document.querySelector('#readout');if(!g)document.body.innerHTML='WebGL が必要です';

const F=`precision highp float;uniform vec2 r,m;uniform float t,mark,mode;float h(vec2 p){return fract(sin(dot(p,vec2(41.31,289.19)))*43758.5453);}float ring(float x,float w){return smoothstep(w,0.,abs(x));}void main(){vec2 u=(gl_FragCoord.xy-.5*r)/r.y,q=m-.5*r/r.y;float d=length(u-q);float beat=fract(t*.62+mark*.22);float pulse=exp(-pow(fract(d*1.8-t*.18-mark*.4)-.13,2.)*110.);float grid=ring(fract(u.y*8.-t*.16)-.5,.025)+ring(fract(u.x*10.+t*.07)-.5,.018);float rays=max(0.,1.-abs(sin(atan(u.y,u.x)*8.+t*.4)))*.16/(.12+d);float stamp=exp(-d*5.)*(.25+pulse);float bounce=0.;for(int i=0;i<18;i++){float a=float(i)*.349+t*.17;vec2 p=vec2(cos(a),sin(a))*(.17+float(i)*.025);float z=length(u-p);bounce+=exp(-z*65.)*(.25+.75*h(p))*pulse;}vec3 direct=vec3(.04,.42,.73)*(grid+rays+stamp);vec3 indirect=vec3(1.,.25,.08)*(bounce+pulse*.22);vec3 col=mix(direct,indirect,mode*.5)+vec3(.015,.02,.06);if(mode<.25)col=direct+vec3(.01);else if(mode<.75)col=indirect+direct*.22+vec3(.01);float vig=1.-smoothstep(.3,1.12,length(u));gl_FragColor=vec4(col*vig,1.);}`;
function S(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw g.getShaderInfoLog(x);return x}let P=g.createProgram();g.attachShader(P,S(g.VERTEX_SHADER,V));g.attachShader(P,S(g.FRAGMENT_SHADER,F));g.linkProgram(P);g.useProgram(P);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U=Object.fromEntries(['r','m','t','mark','mode'].map(x=>[x,g.getUniformLocation(P,x)])),x=.5,y=.5,k=0,mo=2;function rz(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}addEventListener('resize',rz);rz();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=1-e.clientY/innerHeight});function hit(){k=1}addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space')hit();if(+e.key>0&&+e.key<4)mo=+e.key-1});function draw(ms){k*=.972;g.uniform2f(U.r,c.width,c.height);g.uniform2f(U.m,x*c.width,y*c.height);g.uniform1f(U.t,ms*.001);g.uniform1f(U.mark,k);g.uniform1f(U.mode,mo/2);g.drawArrays(g.TRIANGLES,0,3);o.textContent=`pass marker ${(k*100).toFixed(0)}% · ${['direct','bounce','composite'][mo]} · inspection ${x.toFixed(2)}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
