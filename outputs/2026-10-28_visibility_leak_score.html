<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visibility Leak Score</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07090d;color:#eaf7ff;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:550px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#8feee2}.title{margin:7px 0;font-size:clamp(23px,3.8vw,45px);line-height:1.02}.meta{color:#b7ccd2}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #356b68;border-radius:999px;color:#cef8ef}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#bfdbdc}</style>
<canvas></canvas><div class="hud"><div class="ey">DDGI VISIBILITY × GPU-DRIVEN DRAWER — 28 OCT 2026</div><div class="title">Let light arrive<br>only where it can stay.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: light / occluder</span><span class="tag">click / space: reveal beat</span><span class="tag">1–4: isolate passes</span></div></div><div class="keys">1 probe field &nbsp; 2 visibility &nbsp; 3 drawn matter &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,beat=0,last=0;function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(e.key===' ')beat=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1e3||0);last=t;beat*=Math.exp(-dt*1.12);let w=innerWidth,h=innerHeight,T=t/1000,lx=w*x,ly=h*y,show=n=>mode===4||mode===n;g.fillStyle='#07090d';g.fillRect(0,0,w,h);let ox=w*(.5+Math.sin(T*.27)*.10),oy=h*(.57+Math.cos(T*.23)*.06),R=Math.min(w,h)*.15;
if(show(1)){for(let j=0;j<11;j++)for(let i=0;i<17;i++){let px=w*(.12+i/16*.76),py=h*(.22+j/10*.60),d=Math.hypot(px-ox,py-oy),a=Math.max(0,1-d/(R*2.4));g.strokeStyle=`hsla(${170+a*55},80%,65%,${.08+a*.20})`;g.beginPath();g.arc(px,py,5+a*9,0,7);g.stroke()}}
if(show(2)){g.save();g.beginPath();g.arc(ox,oy,R,0,7);g.clip();for(let i=0;i<42;i++){let a=i*2.4+T*.16,rr=R*(.15+(i%9)/10),px=ox+Math.cos(a)*rr,py=oy+Math.sin(a)*rr*.62;g.strokeStyle=`rgba(255,113,93,${.12+(i%4)*.05})`;g.lineWidth=2;g.beginPath();g.moveTo(lx,ly);g.lineTo(px,py);g.stroke()}g.restore();g.strokeStyle='rgba(255,143,106,.75)';g.lineWidth=2;g.beginPath();g.arc(ox,oy,R,0,7);g.stroke()}
if(show(3)){for(let i=0;i<270;i++){let s=i*17.13,px=(s*47%w),py=h*.18+(s*71%(h*.68)),visible=Math.hypot(px-ox,py-oy)>R*.92;let light=Math.max(0,1-Math.hypot(px-lx,py-ly)/(w*.55));let alive=visible?(.18+light*.82):beat*.45;if(alive>.04){g.fillStyle=`hsla(${155+light*75},90%,${45+light*34}%,${alive*.72})`;g.beginPath();g.arc(px,py,(1+light*3)*(1+beat*1.5),0,7);g.fill()}}}
if(show(4)){let z=g.createRadialGradient(lx,ly,2,lx,ly,Math.min(w,h)*.46);z.addColorStop(0,`rgba(187,255,221,${.12+beat*.28})`);z.addColorStop(.55,'rgba(62,222,211,.045)');z.addColorStop(1,'rgba(7,9,13,0)');g.fillStyle=z;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`probe influence ${Math.round(R)}px · occlusion ${Math.round((1-beat*.35)*100)}% · visible draw set ${mode===4?'mixed':mode} · reveal beat ${Math.round(beat*100)}%`};requestAnimationFrame(loop);
</script></html>
