<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splat Horizon Weave</title>
<style>html,body{margin:0;background:#071019;color:#d9eaff;font-family:ui-monospace,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;font-size:12px;line-height:1.55}.key{color:#9cf5cf}.m{color:#ffcf91}</style><canvas></canvas><div class="hud"><b>SPLAT HORIZON / WEAVE</b><br>pointer: attention horizon · click / Space: deliver a fine packet<br><span class="key">1</span> coarse <span class="key">2</span> filter <span class="key">3</span> weave <span class="key">4</span> composite<br><span class="m" id="r"></span></div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p=.5,mode=4,burst=0;const dots=Array.from({length:520},(_,i)=>({x:(i*47%997)/997,y:(i*173%991)/991,z:(i*97%509)/509}));function size(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';g.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',size);size();addEventListener('pointermove',e=>p=e.clientX/W);function fire(){burst=1}addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}if(+e.key>0&&+e.key<5)mode=+e.key});
function tick(t){requestAnimationFrame(tick);t*=.001;burst*=.976;g.fillStyle='#071019';g.fillRect(0,0,W,H);let hy=H*.48;let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#102f48');bg.addColorStop(.48,'#25485b');bg.addColorStop(.49,'#071019');bg.addColorStop(1,'#0a1824');g.fillStyle=bg;g.fillRect(0,0,W,H);let focus=p*W;
for(const d of dots){let dx=d.x*W-focus,near=Math.exp(-dx*dx/(W*W*.035));let lod=.18+.82*near, aa=.25+.75*(1-d.z);let y=hy+(d.y-.5)*H*.54+d.z*H*.08;let x=d.x*W+Math.sin(t*1.3+d.y*14)*4;let s=(mode===1?2.5:1.2+lod*5)*(mode===2?aa:1);let a=(.10+lod*.55)*(mode===3?.42+.58*Math.sin(t*2+d.x*20)**2:1);g.fillStyle=`hsla(${190+d.z*95},75%,${52+lod*28}%,${a})`;g.beginPath();g.ellipse(x,y,s,s*(.38+.62*aa),0,0,7);g.fill()}
if(mode===3||mode===4){g.globalCompositeOperation='screen';for(let i=0;i<14;i++){let yy=hy+i*H*.03;g.strokeStyle=`rgba(255,183,114,${.035+burst*.08})`;g.beginPath();g.moveTo(0,yy);g.quadraticCurveTo(focus,yy-24*Math.sin(t+i),W,yy+10);g.stroke()}g.globalCompositeOperation='source-over'}
if(burst>.01){g.strokeStyle=`rgba(255,238,182,${burst*.8})`;g.lineWidth=2;g.beginPath();g.arc(focus,hy,120*(1-burst)+18,0,7);g.stroke()}document.querySelector('#r').textContent=['','01 / coarse horizon — readable first','02 / anti-alias filter — each splat earns its edge','03 / weave — LOD arrival is a moving textile','04 / composite — attention resolves the horizon'][mode]}
requestAnimationFrame(tick);
</script></html>
