<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOM Reflection Trail</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#100b13;color:#fff3e2;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:520px;pointer-events:none}.ey{font-size:10px;letter-spacing:.16em;color:#ffb7d5}.title{margin:7px 0;font-size:clamp(23px,3.7vw,44px);line-height:1.02}.meta{color:#e2bfce}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #75435b;border-radius:999px;color:#ffe1ec}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#eed1dc}</style>
<canvas></canvas><div class="hud"><div class="ey">DOM / WEBGL SYNCHRONY / MOTION TRAIL — 27 OCT 2026</div><div class="title">A page transition<br>leaves a lighting trace.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: transition path</span><span class="tag">click / space: change scene</span><span class="tag">1–4: isolate layers</span></div></div><div class="keys">1 DOM anchor &nbsp; 2 trail &nbsp; 3 reflection &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,pulse=0,last=0,pts=[];function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight;pts.push([e.clientX,e.clientY,1])});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(e.key===' ')pulse=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1e3||0);last=t;pulse*=Math.exp(-dt*1.45);let w=innerWidth,h=innerHeight,show=n=>mode===4||mode===n;g.fillStyle='#100b13';g.fillRect(0,0,w,h);pts=pts.slice(-90);for(let p of pts)p[2]*=.965;if(show(2)){for(let i=1;i<pts.length;i++){let a=pts[i-1],b=pts[i];g.strokeStyle=`hsla(${330+i%35},90%,70%,${b[2]*.48})`;g.lineWidth=1+b[2]*9;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}}let ax=w*(.2+.6*x),ay=h*(.25+.5*y);if(show(1)){g.strokeStyle='rgba(255,239,215,.72)';g.strokeRect(ax-85,ay-36,170,72);g.fillStyle='rgba(255,238,210,.88)';g.font='700 18px ui-monospace';g.fillText('SCENE / '+Math.round(x*9+1),ax-64,ay+7)}if(show(3)){for(let i=0;i<22;i++){let a=i/22*7+t/1600,r=70+i*11;g.strokeStyle=`hsla(${20+i*7},95%,72%,${.05+pulse*.16})`;g.beginPath();g.ellipse(ax+Math.cos(a)*r,ay+Math.sin(a)*r*.42,r*.75,r*.25,a,0,7);g.stroke()}}if(show(4)){let q=g.createRadialGradient(ax,ay,3,ax,ay,260);q.addColorStop(0,`rgba(255,232,166,${.18+pulse*.3})`);q.addColorStop(.45,'rgba(255,89,171,.08)');q.addColorStop(1,'rgba(16,11,19,0)');g.fillStyle=q;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`DOM anchor ${Math.round(x*100)} · trail samples ${pts.length} · reflection cue ${mode===4?'mixed':mode} · transition ${Math.round(pulse*100)}%`};requestAnimationFrame(loop);
</script></html>
