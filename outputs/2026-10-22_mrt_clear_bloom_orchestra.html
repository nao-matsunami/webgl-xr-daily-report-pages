<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRT Clear Bloom Orchestra</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#eef7ff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:18px;left:18px;line-height:1.7;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #789;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>MRT CLEAR / BLOOM ORCHESTRA</b><br>pointer: attachment focus　<kbd>1</kbd> clear <kbd>2</kbd> buffers <kbd>3</kbd> bloom <kbd>4</kbd> composite<br>click / space: re-score the attachments<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s');let W,H,D,mode=4,p={x:.5,y:.5},hit=0,last=0;function rs(){W=innerWidth;H=innerHeight;D=devicePixelRatio;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>hit=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')hit=1});function loop(t){let dt=Math.min(.05,(t-last)/1e3||0);last=t;hit=Math.max(0,hit-dt*.32);let q=t/1000,b=Math.min(W,H),n=4,focus=Math.min(3,Math.floor(p.x*n));g.fillStyle='rgba(3,6,11,.22)';g.fillRect(0,0,W,H);for(let i=0;i<n;i++){let x=W*(.12+i*.205),y=H*.52,active=i===focus,col=[190,285,42,330][i];if(mode!==2){g.fillStyle=`hsla(${col},65%,${active?13:8}%,.72)`;g.fillRect(x-b*.075,y-b*.24,b*.15,b*.48);g.strokeStyle=`hsla(${col},90%,${active?73:48}%,${.45+.45*active})`;g.strokeRect(x-b*.075,y-b*.24,b*.15,b*.48)}if(mode!==1){for(let k=0;k<22;k++){let a=k*.7+q*(.3+i*.03),r=b*(.017+(k%5)*.012+hit*.04),xx=x+Math.cos(a)*r*2.5,yy=y+Math.sin(a)*r*5;g.fillStyle=`hsla(${col+k*2},95%,${55+30*hit}%,${.15+.5*(active||hit)})`;g.beginPath();g.arc(xx,yy,1.4+hit*3,0,7);g.fill()}}if(mode!==3){let h=b*(.09+hit*.17)*(active?1.2:.7);let v=g.createRadialGradient(x,y,0,x,y,h);v.addColorStop(0,`hsla(${col},100%,75%,${.26+.5*active})`);v.addColorStop(1,`hsla(${col},100%,55%,0)`);g.fillStyle=v;g.fillRect(x-h,y-h,h*2,h*2)}}if(mode!==1&&mode!==2){g.strokeStyle='rgba(210,230,255,.22)';for(let k=0;k<5;k++){g.beginPath();g.moveTo(W*.11,H*.16+k*H*.15);g.bezierCurveTo(W*.35,H*.08+k*H*.19,W*.65,H*.78-k*H*.13,W*.89,H*.22+k*H*.12);g.stroke()}}s.textContent=`mode ${mode} · attachment ${focus+1}/4 · bloom threshold ${(0.32+p.y*.48).toFixed(2)} · re-score ${Math.round(hit*100)}%`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
