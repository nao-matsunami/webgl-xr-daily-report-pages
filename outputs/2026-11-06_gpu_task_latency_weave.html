<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Task Latency Weave</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07050d;color:#f3e7ff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#h{position:fixed;top:16px;left:18px;line-height:1.65;letter-spacing:.06em;pointer-events:none}b{color:#f2b8ff}small{opacity:.62}</style><canvas></canvas><div id="h"><b>GPU TASK LATENCY / weave</b><br><span id="r">move = task focus · click / space = query readback</span><br><small>1 queue · 2 pending · 3 available · 4 composite · WebGL / GLSL</small></div><script>
const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:false}),o=document.querySelector('#r');if(!g)document.body.innerHTML='WebGL が必要です';const V=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;const F=`precision highp float;uniform vec2 r,m;uniform float t,k,mode;float l(float x,float w){return smoothstep(w,0.,abs(fract(x)-.5));}void main(){vec2 u=(gl_FragCoord.xy-.5*r)/r.y,q=m-.5*r/r.y;float lane=floor((u.y+.52)*8.);float phase=fract(t*(.09+lane*.011)+lane*.173);float focus=exp(-abs(u.y-q.y)*18.);float queue=l(u.x*5.-t*(.18+lane*.035),.035)*(1.-phase*.45);float pending=smoothstep(.22,.02,abs(fract(u.x*2.7-phase)-.5))*step(.18,phase)*step(phase,.69);float available=exp(-pow(fract(u.x*3.2-phase*1.8)-.13,2.)*180.)*smoothstep(.58,.92,phase);float read=exp(-length(u-q)*(5.+k*4.))*(.25+.75*exp(-k));vec3 a=vec3(.1,.22,.8)*(queue+.15*focus);vec3 b=vec3(.75,.16,.95)*(pending*.75+focus*.18);vec3 d=vec3(1.,.65,.18)*(available+read*.6);vec3 col=a+b+d;if(mode<.17)col=a;else if(mode<.5)col=b+a*.12;else if(mode<.83)col=d+b*.08;float scan=l(u.y*8.,.012);col+=scan*vec3(.04,.015,.07);gl_FragColor=vec4(col*(1.-smoothstep(.35,1.1,length(u))),1.);}`;function sh(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw g.getShaderInfoLog(x);return x}let P=g.createProgram();g.attachShader(P,sh(g.VERTEX_SHADER,V));g.attachShader(P,sh(g.FRAGMENT_SHADER,F));g.linkProgram(P);g.useProgram(P);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U=Object.fromEntries(['r','m','t','k','mode'].map(x=>[x,g.getUniformLocation(P,x)])),x=.5,y=.5,k=4,mo=3;function rz(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}addEventListener('resize',rz);rz();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=1-e.clientY/innerHeight});function hit(){k=0}addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space')hit();if(+e.key>0&&+e.key<5)mo=+e.key-1});function draw(ms){k+=.016;g.uniform2f(U.r,c.width,c.height);g.uniform2f(U.m,x*c.width,y*c.height);g.uniform1f(U.t,ms*.001);g.uniform1f(U.k,k);g.uniform1f(U.mode,mo/3);g.drawArrays(g.TRIANGLES,0,3);o.textContent=`query ${k<1?'available':'pending'} · ${['queue','pending','available','composite'][mo]} · task lane ${Math.min(7,Math.floor(y*8))}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
