<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resolve Prism Splat Scope - 2026-08-02</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #d7f4ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      inset: 18px 18px auto 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(217, 247, 255, 0.78);
      text-shadow: 0 0 18px rgba(58, 202, 255, 0.45);
    }
    .hud strong {
      display: block;
      font-size: 12px;
      color: #fff7d6;
      font-weight: 700;
    }
    .hud span {
      display: block;
      max-width: 360px;
    }
    @media (max-width: 680px) {
      .hud {
        inset: 12px;
        font-size: 10px;
        flex-direction: column;
      }
      .hud span {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <span><strong>Resolve Prism Splat Scope</strong>Pointer = inspection vector / Hold or Space = compatibility pressure</span>
    <span>1 blend / 2 XR MSAA / 3 slice readback / 4 gsplat sort / Drag to bend the wake</span>
  </div>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false });
    if (!gl) {
      document.body.innerHTML = "WebGL is not available.";
      throw new Error("WebGL unavailable");
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;
      uniform vec2 resolution;
      uniform vec2 pointer;
      uniform vec2 velocity;
      uniform float time;
      uniform float pressure;
      uniform float mode;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float ring(vec2 p, float r, float w) {
        return 1.0 - smoothstep(0.0, w, abs(length(p) - r));
      }

      float capsule(vec2 p, vec2 a, vec2 b, float r) {
        vec2 pa = p - a;
        vec2 ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
      }

      float lane(vec2 uv, float x, float active) {
        float d = abs(uv.x - x);
        float stripe = 1.0 - smoothstep(0.018, 0.065, d);
        float y = fract((uv.y + time * (0.05 + x * 0.04)) * 18.0);
        float ticks = smoothstep(0.92, 1.0, y);
        return stripe * (0.28 + 0.72 * ticks) * active;
      }

      vec3 palette(float t) {
        vec3 a = vec3(0.04, 0.08, 0.10);
        vec3 b = vec3(0.12, 0.70, 0.94);
        vec3 c = vec3(1.00, 0.26, 0.62);
        vec3 d = vec3(1.00, 0.78, 0.25);
        return mix(mix(a, b, smoothstep(0.0, 0.55, t)), mix(c, d, t), smoothstep(0.45, 1.0, t));
      }

      float splat(vec2 p, vec2 c, float sx, float sy, float rot) {
        float co = cos(rot);
        float si = sin(rot);
        mat2 m = mat2(co, -si, si, co);
        vec2 q = m * (p - c);
        return exp(-dot(q / vec2(sx, sy), q / vec2(sx, sy)));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        vec2 m = (pointer * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        vec2 dir = normalize(velocity + vec2(0.35, 0.18));
        vec2 right = vec2(-dir.y, dir.x);

        float n = noise(uv * 4.0 + time * 0.08);
        float grain = noise(uv * 80.0 + time);
        vec3 col = vec3(0.015, 0.022, 0.030) + vec3(0.015, 0.045, 0.065) * n;

        float prism = 0.0;
        float sortHeat = 0.0;
        for (int i = 0; i < 34; i++) {
          float fi = float(i);
          vec2 seed = vec2(hash(vec2(fi, 2.1)), hash(vec2(9.7, fi)));
          vec2 c = (seed * 2.0 - 1.0) * vec2(1.45, 0.78);
          c += 0.10 * vec2(sin(time * 0.19 + fi), cos(time * 0.13 + fi * 1.7));
          float depth = hash(seed * 13.7);
          float s = splat(uv, c, 0.030 + depth * 0.040, 0.010 + depth * 0.022, fi + time * 0.04);
          float order = smoothstep(-0.30, 0.75, dot(c, dir) + 0.18 * sin(time + fi));
          prism += s * (0.35 + depth) * (0.55 + 0.45 * order);
          sortHeat += s * abs(order - depth);
        }

        vec2 local = uv - m;
        float cone = smoothstep(0.74, 0.08, length(local)) * smoothstep(-0.28, 0.70, dot(normalize(local + 0.0001), dir));
        float lens = smoothstep(0.58, 0.05, length(local));
        float wake = exp(-abs(dot(local, right)) * 7.0) * smoothstep(0.70, -0.28, dot(local, -dir));
        float gate = smoothstep(0.16, 0.0, abs(length(local) - (0.25 + pressure * 0.18 + 0.025 * sin(time * 3.0))));

        float active1 = mode < 1.5 ? 1.0 : 0.32;
        float active2 = abs(mode - 2.0) < 0.5 ? 1.0 : 0.35;
        float active3 = abs(mode - 3.0) < 0.5 ? 1.0 : 0.35;
        float active4 = mode > 3.5 ? 1.0 : 0.35;
        float lanes = lane(uv, -0.78, active1) + lane(uv, -0.26, active2) + lane(uv, 0.26, active3) + lane(uv, 0.78, active4);

        float msaaResolve = ring(uv - vec2(-0.26, 0.0), 0.34 + 0.025 * sin(time * 2.0), 0.018);
        float sliceRead = abs(sin((uv.y + uv.x * 0.55 + time * 0.18) * 24.0));
        sliceRead *= smoothstep(0.18, 0.0, abs(uv.x - 0.26));
        float blendEquation = smoothstep(0.03, 0.0, abs(capsule(uv, vec2(-1.0, -0.48), vec2(-0.55, 0.50), 0.018)));
        float gsplatSort = sortHeat * smoothstep(0.22, 0.0, abs(uv.x - 0.78));

        col += palette(prism) * prism * (0.62 + 0.72 * cone);
        col += vec3(0.06, 0.80, 1.00) * lanes * 0.70;
        col += vec3(1.00, 0.27, 0.48) * blendEquation * (0.8 + pressure);
        col += vec3(0.28, 0.78, 1.00) * msaaResolve * (0.75 + pressure);
        col += vec3(1.00, 0.82, 0.20) * pow(sliceRead, 8.0) * active3;
        col += vec3(0.75, 0.35, 1.00) * gsplatSort * (0.50 + active4);
        col += vec3(0.2, 0.95, 1.0) * cone * 0.25;
        col += vec3(1.0, 0.72, 0.24) * gate * (0.55 + pressure);
        col += vec3(0.42, 0.90, 1.00) * wake * (0.18 + pressure * 0.30);

        float scan = 0.035 * sin(gl_FragCoord.y * 0.75 + time * 7.0);
        float vignette = smoothstep(1.65, 0.25, length(uv));
        col *= vignette;
        col += grain * 0.035 + scan;
        col = col / (1.0 + col);
        col = pow(col, vec3(0.82));
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      velocity: gl.getUniformLocation(program, "velocity"),
      time: gl.getUniformLocation(program, "time"),
      pressure: gl.getUniformLocation(program, "pressure"),
      mode: gl.getUniformLocation(program, "mode")
    };

    const state = {
      pointer: [innerWidth * 0.58, innerHeight * 0.45],
      last: [innerWidth * 0.58, innerHeight * 0.45],
      velocity: [0.35, 0.12],
      pressure: 0,
      targetPressure: 0,
      mode: 1
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * canvas.width / rect.width;
      const y = canvas.height - (event.clientY - rect.top) * canvas.height / rect.height;
      state.velocity[0] = state.velocity[0] * 0.72 + (x - state.last[0]) / Math.max(canvas.width, 1) * 5.0;
      state.velocity[1] = state.velocity[1] * 0.72 + (y - state.last[1]) / Math.max(canvas.height, 1) * 5.0;
      state.pointer = [x, y];
      state.last = [x, y];
    }

    addEventListener("resize", resize);
    addEventListener("pointermove", setPointer);
    addEventListener("pointerdown", (event) => { setPointer(event); state.targetPressure = 1; });
    addEventListener("pointerup", () => { state.targetPressure = 0; });
    addEventListener("keydown", (event) => {
      if (event.code === "Space") state.targetPressure = 1;
      if (["Digit1", "Digit2", "Digit3", "Digit4"].includes(event.code)) state.mode = Number(event.code.slice(-1));
    });
    addEventListener("keyup", (event) => {
      if (event.code === "Space") state.targetPressure = 0;
    });

    resize();
    const started = performance.now();
    function frame(now) {
      state.pressure += (state.targetPressure - state.pressure) * 0.08;
      state.velocity[0] *= 0.985;
      state.velocity[1] *= 0.985;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, state.pointer[0], state.pointer[1]);
      gl.uniform2f(uniforms.velocity, state.velocity[0], state.velocity[1]);
      gl.uniform1f(uniforms.time, (now - started) / 1000);
      gl.uniform1f(uniforms.pressure, state.pressure);
      gl.uniform1f(uniforms.mode, state.mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>

<style>

</style>
<div class="mobile-preset-controls" aria-label="Preset controls">
  <button type="button" data-mobile-key="1" aria-label="Preset 1">1</button>
  <button type="button" data-mobile-key="2" aria-label="Preset 2">2</button>
  <button type="button" data-mobile-key="3" aria-label="Preset 3">3</button>
  <button type="button" data-mobile-key="4" aria-label="Preset 4">4</button>
  <button type="button" data-mobile-key="5" aria-label="Preset 5">5</button>
  <button type="button" data-mobile-key="Space" aria-label="Pulse">Pulse</button>
</div>
<script>
(() => {
  const dock = document.currentScript.previousElementSibling;
  if (!dock || dock.dataset.ready === 'true') return;
  dock.dataset.ready = 'true';
  const sendKey = (keyName) => {
    const isSpace = keyName === 'Space';
    const key = isSpace ? ' ' : keyName;
    const code = isSpace ? 'Space' : 'Digit' + keyName;
    const eventInit = { key, code, bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    if (isSpace) {
      window.setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
      }, 140);
    }
  };
  dock.querySelectorAll('button').forEach((button) => {
    const keyName = button.dataset.mobileKey;
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      dock.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      sendKey(keyName);
    });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
  });
})();
</script>
</body>
