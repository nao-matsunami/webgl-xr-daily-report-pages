<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coarse First Arrival Field</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050711;color:#d9ecff;font:12px ui-monospace,SFMono-Regular,monospace}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:18px auto auto 18px;line-height:1.65;letter-spacing:.075em;pointer-events:none}b{color:#a9f6df}small{opacity:.62}</style>
<canvas></canvas><div id="hud"><b>COARSE FIRST / arrival field</b><br><span id="readout">move = priority · click / space = stream burst</span><br><small>1 sparse · 2 balanced · 3 dense · WebGL / GLSL</small></div>
<script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{antialias:false}),out=document.querySelector('#readout');
if(!gl)document.body.innerHTML='WebGL が必要です';
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 r,m;uniform float t,burst,quality;float h(vec2 p){p=fract(p*vec2(127.1,311.7));return fract(sin(dot(p,vec2(19.19,83.37)))*43758.5453);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+1.),f.x),f.y);}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;vec2 q=m-.5*r/r.y;float d=length(uv-q);float wave=fract(d*1.25-t*.13-burst*.18);float arrive=smoothstep(.20,0.,abs(wave-.11));float cells=mix(9.,38.,quality);vec2 g=uv*cells;vec2 id=floor(g),f=fract(g)-.5;float seed=h(id);float local=length(f+(.5-seed)*.14);float gate=smoothstep(.46,.12,local);float priority=exp(-d*3.4);float resolution=smoothstep(.05,.78,priority+arrive*.72+burst*.25);float grain=n(g*mix(1.,5.,resolution)+t*.05);float splat=gate*smoothstep(.14,.78,grain+resolution*.42);float halo=exp(-d*(7.-4.*arrive))*(.15+arrive);vec3 dark=vec3(.012,.02,.06);vec3 coarse=vec3(.08,.33,.46);vec3 fine=vec3(.35,1.,.74);vec3 col=mix(coarse,fine,resolution)*splat;col+=vec3(.95,.32,.08)*arrive*(.45+gate*.55);col+=fine*halo;col+=dark;float vign=1.-smoothstep(.42,1.05,length(uv));gl_FragColor=vec4(col*vign,1.);}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let p=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);let U=Object.fromEntries(['r','m','t','burst','quality'].map(k=>[k,gl.getUniformLocation(pr,k)]));let mx=.5,my=.5,hit=0,q=.5;
function resize(){let d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight});function fire(){hit=1}addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.code==='Space')fire();if(+e.key>=1&&+e.key<=3)q=(+e.key-1)/2});
function draw(ms){hit*=.976;gl.uniform2f(U.r,canvas.width,canvas.height);gl.uniform2f(U.m,mx*canvas.width,my*canvas.height);gl.uniform1f(U.t,ms*.001);gl.uniform1f(U.burst,hit);gl.uniform1f(U.quality,q);gl.drawArrays(gl.TRIANGLES,0,3);out.textContent=`priority ${mx.toFixed(2)}, ${(1-my).toFixed(2)} · arrival ${(hit*100).toFixed(0)}% · ${['sparse','balanced','dense'][q*2]||'balanced'}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
