<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispersive Water Memory Score</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#02070f;color:#dff4ff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#hud{position:fixed;inset:18px auto auto 18px;line-height:1.6;letter-spacing:.04em;text-shadow:0 1px 12px #000}b{color:#9cecff}span{color:#ffd27d}</style>
<canvas id="c"></canvas><div id="hud"><b>DISPERSIVE WATER / MEMORY SCORE</b><br>move: view elevation &amp; current · click / Space: strike a crest<br><span>1 spectrum · 2 reflection · 3 crest scatter · 4 composite</span></div>
<script>
const c=document.querySelector('#c'),g=c.getContext('webgl');let W,H,px=.5,py=.5,mode=4,hit=-9;
function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.viewport(0,0,W,H)}addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight});addEventListener('pointerdown',()=>hit=performance.now()/1000);addEventListener('keydown',e=>{if(e.code==='Space')hit=performance.now()/1000;if(+e.key>0&&+e.key<5)mode=+e.key});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`,fs=`precision highp float;uniform vec2 r,m;uniform float t,hit,mode;float h(vec2 p){float q=0.;q+=sin(dot(p,vec2(.81,.59))*31.+t*2.1);q+=.58*sin(dot(p,vec2(-.36,.93))*15.-t*1.35);q+=.35*sin(dot(p,vec2(.95,-.31))*7.+t*.72);q+=.18*sin(dot(p,vec2(.22,.98))*3.-t*.39);return q;}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;float water=h(uv*1.7);vec2 e=vec2(.006,0);vec3 n=normalize(vec3(h(uv*1.7+e.xy)-water,.32,h(uv*1.7+e.yx)-water));float elev=m.y*.72+.15;vec3 v=normalize(vec3(uv.x, elev, 1.));float fres=pow(1.-max(0.,dot(n,v)),3.);float crest=smoothstep(.58,1.5,water)*(.35+.65*max(0.,n.y));float glint=pow(max(0.,dot(reflect(-v,n),normalize(vec3(.2,.78,.6)))),90.)*(.35+.65*elev);float ring=exp(-10.*length(uv-(m-.5)*vec2(1.78,1.)))*exp(-max(0.,t-hit)*2.2);vec3 spectrum=vec3(.02,.1,.2)+.15*vec3(.08,.45,.68)*(water+.9);vec3 reflect=vec3(.08,.46,.78)*fres+vec3(1.,.62,.2)*glint;vec3 scatter=vec3(.05,.55,.4)*crest+vec3(1.,.34,.12)*ring;vec3 col=mode<1.5?spectrum:mode<2.5?reflect:mode<3.5?scatter:spectrum+reflect+scatter;col+=.04*sin(uv.y*220.+t)*vec3(.1,.4,.7);gl_FragColor=vec4(col,1.);}`;
function sh(type,src){let s=g.createShader(type);g.shaderSource(s,src);g.compileShader(s);return s}let p=g.createProgram();g.attachShader(p,sh(g.VERTEX_SHADER,vs));g.attachShader(p,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(p);g.useProgram(p);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(p,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U={};['r','m','t','hit','mode'].forEach(k=>U[k]=g.getUniformLocation(p,k));function draw(ms){g.uniform2f(U.r,W,H);g.uniform2f(U.m,px,py);g.uniform1f(U.t,ms/1000);g.uniform1f(U.hit,hit);g.uniform1f(U.mode,mode);g.drawArrays(g.TRIANGLES,0,3);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
