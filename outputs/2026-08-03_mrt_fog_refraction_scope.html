<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MRT Fog Refraction Scope - 2026-08-03</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030609;
      color: #dff8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      inset: 18px 18px auto 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(226, 248, 255, 0.76);
      text-shadow: 0 0 18px rgba(70, 220, 255, 0.38);
    }
    .hud strong {
      display: block;
      color: #fff1bb;
      font-size: 12px;
      font-weight: 700;
    }
    .hud span {
      display: block;
      max-width: 390px;
    }
    @media (max-width: 700px) {
      .hud {
        inset: 12px;
        flex-direction: column;
        font-size: 10px;
      }
      .hud span {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <span><strong>MRT Fog Refraction Scope</strong>Pointer = clear-color lens / Hold or Space = attachment pressure</span>
    <span>1 color / 2 id / 3 fog / 4 sort padding / Drag to shear the refraction field</span>
  </div>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false });
    if (!gl) {
      document.body.textContent = "WebGL is not available.";
      throw new Error("WebGL unavailable");
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;
      uniform vec2 resolution;
      uniform vec2 pointer;
      uniform vec2 velocity;
      uniform float time;
      uniform float pressure;
      uniform float mode;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(41.7, 289.3))) * 45123.1257);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += noise(p) * a;
          p = mat2(1.62, -1.12, 1.12, 1.62) * p + 7.3;
          a *= 0.52;
        }
        return v;
      }

      float ring(vec2 p, float r, float w) {
        return 1.0 - smoothstep(0.0, w, abs(length(p) - r));
      }

      float box(vec2 p, vec2 b) {
        vec2 d = abs(p) - b;
        return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
      }

      float splat(vec2 p, vec2 c, float sx, float sy, float rot) {
        float co = cos(rot);
        float si = sin(rot);
        mat2 m = mat2(co, -si, si, co);
        vec2 q = m * (p - c);
        return exp(-dot(q / vec2(sx, sy), q / vec2(sx, sy)));
      }

      vec3 grade(float v) {
        vec3 deep = vec3(0.018, 0.033, 0.045);
        vec3 cyan = vec3(0.05, 0.82, 0.95);
        vec3 rose = vec3(1.00, 0.28, 0.54);
        vec3 gold = vec3(1.00, 0.78, 0.27);
        return mix(mix(deep, cyan, smoothstep(0.05, 0.55, v)), mix(rose, gold, v), smoothstep(0.45, 1.0, v));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        vec2 m = (pointer * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        vec2 dir = normalize(velocity + vec2(0.28, -0.16));
        vec2 side = vec2(-dir.y, dir.x);
        float aspectX = resolution.x / min(resolution.x, resolution.y);

        float flow = fbm(uv * 2.4 + vec2(time * 0.07, -time * 0.04));
        vec2 refractUv = uv + 0.08 * vec2(
          sin(uv.y * 6.0 + flow * 5.0 + time),
          cos(uv.x * 5.0 - flow * 4.0 - time * 0.7)
        ) + side * pressure * 0.035;

        float colorAttachment = 0.0;
        float idAttachment = 0.0;
        float fogAttachment = 0.0;
        float sortPadding = 0.0;

        for (int i = 0; i < 44; i++) {
          float fi = float(i);
          vec2 seed = vec2(hash(vec2(fi, 5.2)), hash(vec2(8.1, fi)));
          vec2 c = (seed * 2.0 - 1.0) * vec2(1.65, 0.86);
          c += 0.08 * vec2(sin(time * 0.18 + fi * 1.9), cos(time * 0.12 + fi));
          float depth = hash(seed * 19.0 + 3.0);
          float s = splat(refractUv, c, 0.030 + depth * 0.050, 0.012 + depth * 0.030, fi * 0.41 + time * 0.035);
          float order = smoothstep(-0.60, 0.82, dot(c, dir) + sin(fi * 1.7 + time) * 0.10);
          float padded = step(0.88, hash(seed * 31.0 + floor(time * 0.8)));
          colorAttachment += s * (0.45 + depth);
          idAttachment += s * (0.2 + 0.8 * hash(seed * 11.0));
          fogAttachment += s * smoothstep(-0.85, 0.65, c.y + 0.25 * flow);
          sortPadding += s * abs(order - depth) + s * padded * (0.7 + pressure);
        }

        vec2 lensP = uv - m;
        float lens = smoothstep(0.62, 0.08, length(lensP));
        float clearRing = ring(lensP, 0.24 + pressure * 0.17, 0.018);
        float wake = exp(-abs(dot(lensP, side)) * 8.0) * smoothstep(0.76, -0.20, dot(lensP, -dir));
        float fogCurtain = smoothstep(-0.95, 0.68, uv.y + 0.18 * sin(uv.x * 5.0 + time)) * (0.35 + 0.65 * flow);

        float lane1 = smoothstep(0.22, 0.0, abs(uv.x + aspectX * 0.43));
        float lane2 = smoothstep(0.22, 0.0, abs(uv.x + aspectX * 0.14));
        float lane3 = smoothstep(0.22, 0.0, abs(uv.x - aspectX * 0.14));
        float lane4 = smoothstep(0.22, 0.0, abs(uv.x - aspectX * 0.43));
        float a1 = mode < 1.5 ? 1.0 : 0.28;
        float a2 = abs(mode - 2.0) < 0.5 ? 1.0 : 0.28;
        float a3 = abs(mode - 3.0) < 0.5 ? 1.0 : 0.28;
        float a4 = mode > 3.5 ? 1.0 : 0.28;

        float glyph = 0.0;
        glyph += ring(uv - vec2(-0.70, 0.22), 0.18, 0.012) * a1;
        glyph += (1.0 - smoothstep(0.0, 0.012, abs(box(uv - vec2(-0.24, -0.12), vec2(0.13, 0.20))))) * a2;
        glyph += ring(uv - vec2(0.25, 0.08), 0.22 + 0.03 * sin(time * 2.0), 0.016) * a3;
        glyph += smoothstep(0.96, 1.0, noise(uv * 34.0 + time)) * lane4 * a4;

        vec3 col = vec3(0.012, 0.020, 0.029);
        col += grade(colorAttachment) * colorAttachment * (0.45 + 0.55 * a1);
        col += vec3(0.22, 0.88, 1.0) * pow(idAttachment, 1.6) * lane2 * (0.35 + a2);
        col += vec3(0.80, 0.86, 1.0) * fogAttachment * fogCurtain * (0.22 + a3 * 0.55);
        col += vec3(1.0, 0.42, 0.72) * sortPadding * lane4 * (0.32 + a4);
        col += vec3(0.08, 0.74, 1.0) * (lane1 * a1 + lane2 * a2 + lane3 * a3 + lane4 * a4) * 0.13;
        col += vec3(1.0, 0.79, 0.30) * clearRing * (0.6 + pressure);
        col += vec3(0.22, 0.95, 1.0) * lens * 0.18;
        col += vec3(0.6, 0.95, 1.0) * wake * (0.18 + pressure * 0.35);
        col += vec3(0.78, 0.33, 1.0) * glyph * (0.40 + 0.45 * pressure);

        float grid = smoothstep(0.985, 1.0, sin((uv.x + time * 0.03) * 42.0) * sin((uv.y - time * 0.02) * 28.0));
        float grain = noise(gl_FragCoord.xy * 0.75 + time * 20.0);
        float vignette = smoothstep(1.70, 0.25, length(uv));
        col += vec3(0.06, 0.22, 0.28) * grid * (0.25 + pressure * 0.5);
        col *= vignette;
        col += grain * 0.025;
        col = col / (1.0 + col);
        col = pow(col, vec3(0.82));
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      velocity: gl.getUniformLocation(program, "velocity"),
      time: gl.getUniformLocation(program, "time"),
      pressure: gl.getUniformLocation(program, "pressure"),
      mode: gl.getUniformLocation(program, "mode")
    };

    let pointer = [innerWidth * 0.52, innerHeight * 0.52];
    let lastPointer = pointer.slice();
    let velocity = [0.30, -0.12];
    let targetPressure = 0;
    let pressure = 0;
    let mode = 1;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(innerWidth * dpr));
      canvas.height = Math.max(1, Math.floor(innerHeight * dpr));
      gl.viewport(0, 0, canvas.width, canvas.height);
      pointer[0] = Math.min(pointer[0], canvas.width);
      pointer[1] = Math.min(pointer[1], canvas.height);
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const dpr = canvas.width / rect.width;
      lastPointer = pointer.slice();
      pointer = [
        (event.clientX - rect.left) * dpr,
        canvas.height - (event.clientY - rect.top) * dpr
      ];
      velocity = [
        (pointer[0] - lastPointer[0]) / Math.max(canvas.width, 1),
        (pointer[1] - lastPointer[1]) / Math.max(canvas.height, 1)
      ];
    }

    addEventListener("resize", resize);
    addEventListener("pointermove", setPointer);
    addEventListener("pointerdown", (event) => {
      setPointer(event);
      targetPressure = 1;
    });
    addEventListener("pointerup", () => {
      targetPressure = 0;
    });
    addEventListener("keydown", (event) => {
      if (event.code === "Space") targetPressure = 1;
      if (event.key >= "1" && event.key <= "4") mode = Number(event.key);
    });
    addEventListener("keyup", (event) => {
      if (event.code === "Space") targetPressure = 0;
    });

    resize();

    function frame(now) {
      pressure += (targetPressure - pressure) * 0.08;
      velocity[0] *= 0.94;
      velocity[1] *= 0.94;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer[0], pointer[1]);
      gl.uniform2f(uniforms.velocity, velocity[0] * 16.0, velocity[1] * 16.0);
      gl.uniform1f(uniforms.time, now * 0.001);
      gl.uniform1f(uniforms.pressure, pressure);
      gl.uniform1f(uniforms.mode, mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
