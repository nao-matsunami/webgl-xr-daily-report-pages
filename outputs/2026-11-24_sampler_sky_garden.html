<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sampler Sky Garden</title>
<style>html,body{margin:0;overflow:hidden;background:#050818;color:#e9f1ff;font:12px ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;left:18px;top:16px;line-height:1.6;pointer-events:none;text-shadow:0 2px 10px #000}h1{font:600 16px system-ui;margin:0 0 4px;letter-spacing:.06em}b{color:#a5efff}#state{position:fixed;right:18px;bottom:15px;text-align:right;color:#bad0f5}</style>
<canvas></canvas><div id="ui"><h1>SAMPLER SKY / GARDEN</h1><b>pointer</b> = move the sky current &nbsp; <b>click</b> = plant a sampled star<br>One bound input becomes a field, a horizon, and a shared score.</div><div id="state">0 SAMPLED STARS</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:false});if(!g)document.body.textContent='WebGL is required.';
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 r,m;uniform float t;uniform vec3 stars[10];uniform int n;float h(vec2 p){return fract(sin(dot(p,vec2(37.7,91.1)))*43758.5);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}void main(){vec2 p=(2.*gl_FragCoord.xy-r)/min(r.x,r.y);float sky=smoothstep(-.9,.8,p.y);vec3 col=mix(vec3(.008,.012,.06),vec3(.06,.25,.48),sky);float cloud=noise(p*3.+vec2(t*.035,0.))+noise(p*7.-vec2(t*.06,0.));col+=vec3(.08,.16,.23)*smoothstep(1.14,1.58,cloud)*(1.-sky*.5);float horizon=exp(-abs(p.y+.18+sin(p.x*2.+t*.2)*.035)*32.);col+=vec3(.18,.54,.8)*horizon;vec2 q=p-m;col+=vec3(.15,.8,1.)*exp(-dot(q,q)*2.5)*.23;for(int i=0;i<10;i++){if(i>=n)break;float age=t-stars[i].z;vec2 d=p-stars[i].xy;float core=exp(-dot(d,d)*190.)*exp(-age*.045);float ring=exp(-pow(length(d)-fract(age*.12)*.52,2.)/.0015)*exp(-age*.11);col+=mix(vec3(.25,.95,1.),vec3(1.,.28,.62),float(i)/10.)*(core+ring*.45);}float grain=h(floor(p*vec2(230.,130.)))-.5;col+=grain*.025;gl_FragColor=vec4(1.-exp(-col*1.5),1.);}`;
function shader(k,s){let x=g.createShader(k);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(x));return x}let P=g.createProgram();g.attachShader(P,shader(g.VERTEX_SHADER,vs));g.attachShader(P,shader(g.FRAGMENT_SHADER,fs));g.linkProgram(P);g.useProgram(P);let B=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,B);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let u=x=>g.getUniformLocation(P,x),mouse=[0,0],stars=[],start=performance.now();
function size(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}addEventListener('resize',size);size();function pos(e){mouse=[(e.clientX-innerWidth/2)/(Math.min(innerWidth,innerHeight)/2),(innerHeight/2-e.clientY)/(Math.min(innerWidth,innerHeight)/2)]}addEventListener('pointermove',pos);addEventListener('click',e=>{pos(e);stars.push([...mouse,(performance.now()-start)/1000]);if(stars.length>10)stars.shift();document.querySelector('#state').textContent=stars.length+' SAMPLED STARS'});function draw(now){requestAnimationFrame(draw);let z=(now-start)/1000;g.uniform2f(u('r'),c.width,c.height);g.uniform2f(u('m'),...mouse);g.uniform1f(u('t'),z);g.uniform1i(u('n'),stars.length);g.uniform3fv(u('stars'),new Float32Array([...stars,...Array(10-stars.length).fill([0,0,-999])].flat()));g.drawArrays(g.TRIANGLES,0,3)}requestAnimationFrame(draw);
</script></html>
