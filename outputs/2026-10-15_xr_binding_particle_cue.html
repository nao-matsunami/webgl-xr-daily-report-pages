<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XR Binding Particle Cue</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070612;color:#fff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:16px;left:18px;pointer-events:none;text-shadow:0 2px 15px #000}.title{letter-spacing:.12em;color:#e0bbff}.meta{margin-top:8px;color:#bdefff;line-height:1.5}</style><canvas id="c"></canvas><div class="hud"><div class="title">XR BINDING PARTICLE CUE</div><div class="meta">1 eye bindings / 2 interaction beams / 3 particle collision cue / 4 composite · drag = gaze · click or Space = controller impulse · mode <span id="mode">4</span></div></div><script>
(()=>{let c=document.querySelector('#c'),x=c.getContext('2d'),m=[.5,.5],mode=4,hit=-9;function resize(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function p(e){m=[e.clientX/innerWidth,e.clientY/innerHeight]}addEventListener('pointermove',p);addEventListener('pointerdown',e=>{p(e);hit=performance.now()/1e3});addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')mode=+e.key;if(e.code==='Space')hit=performance.now()/1e3;document.querySelector('#mode').textContent=mode});let dots=Array.from({length:360},(_,i)=>({a:i*2.399,b:Math.sqrt(i/360),w:Math.random()}));function draw(n){let t=n/1e3,w=innerWidth,h=innerHeight,q=Math.exp(-3*Math.max(0,t-hit));x.fillStyle='#070612';x.fillRect(0,0,w,h);let gx=m[0]*w,gy=m[1]*h;function eyes(){for(let e=0;e<2;e++){let cx=w*(.5+(e?-.14:.14)),cy=h*.51;x.strokeStyle=e?'#70caff':'#ea8bff';x.globalAlpha=.8;x.lineWidth=2;x.beginPath();x.arc(cx,cy,Math.min(w,h)*(.18+.03*Math.sin(t*1.4+e)),0,Math.PI*2);x.stroke();x.globalAlpha=.3;x.beginPath();x.moveTo(cx,cy);x.lineTo(gx,gy);x.stroke()}}function beam(){x.globalAlpha=.65;x.strokeStyle='#fff1a8';x.lineWidth=1+7*q;for(let i=0;i<7;i++){let a=t*.7+i*.9;x.beginPath();x.moveTo(gx,gy);x.lineTo(w*.5+Math.cos(a)*w*.35,h*.5+Math.sin(a*1.3)*h*.32);x.stroke()}}function particles(){for(let d of dots){let r=d.b*Math.min(w,h)*.62,a=d.a+t*(.12+d.w*.18);let px=w*.5+Math.cos(a)*r,py=h*.5+Math.sin(a*1.2)*r;let near=Math.max(0,1-Math.hypot(px-gx,py-gy)/(w*.22));x.globalAlpha=.18+.7*near;x.fillStyle=near>.45?'#ffb34a':'#76e9ff';x.beginPath();x.arc(px,py,1+near*5+q*3,0,7);x.fill()}}if(mode===1)eyes();else if(mode===2)beam();else if(mode===3)particles();else{eyes();beam();particles()}x.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw)})();
</script></html>
