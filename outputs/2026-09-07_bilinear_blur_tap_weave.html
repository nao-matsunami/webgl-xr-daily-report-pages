<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2026-09-07 Bilinear Blur Tap Weave</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#050607;color:#eef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    canvas{display:block;width:100vw;height:100vh}
    .hud{position:fixed;left:16px;top:14px;max-width:560px;font-size:13px;line-height:1.45;color:#e5ecef;text-shadow:0 1px 8px #000}
    .hud b{color:#fff}.hud span{color:#aab7bc}
  </style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud"><b>Bilinear Blur Tap Weave</b><br><span>1 raw taps / 2 merged pairs / 3 bloom mips / 4 woven postprocess. Drag = tap offset and threshold. Click or Space = bright transient.</span></div>
<script>
const canvas=document.getElementById("gl");
const gl=canvas.getContext("webgl",{antialias:false,alpha:false});
const frag=`
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_pointer;
uniform float u_pulse;
uniform int u_mode;

float hash(vec2 p){return fract(sin(dot(p,vec2(41.7,289.3)))*17312.91);}
float stripe(vec2 p,float a,float k){
  vec2 d=vec2(cos(a),sin(a));
  return smoothstep(.08,.0,abs(fract(dot(p,d)*k)-.5));
}
float source(vec2 p){
  float orb=0.0;
  for(int i=0;i<5;i++){
    float fi=float(i);
    vec2 c=.55*vec2(sin(u_time*.37+fi*1.7),cos(u_time*.29+fi*2.1));
    orb+=exp(-10.0*length(p-c));
  }
  float threads=stripe(p+u_time*.04,.65,9.0)+stripe(p-u_time*.025,2.15,13.0);
  return orb+.3*threads;
}
vec3 pal(float t){return .5+.5*cos(6.28318*(vec3(.0,.2,.44)+t+vec3(0.0,.11,.28)));}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-u_res)/min(u_res.x,u_res.y);
  vec2 px=1.0/u_res*min(u_res.x,u_res.y);
  float tapScale=mix(1.0,9.0,u_pointer.x);
  float raw=0.0;
  float merged=0.0;
  float wsum=0.0;
  for(int i=-10;i<=10;i++){
    float x=float(i);
    float w=exp(-x*x/28.0);
    raw+=source(uv+vec2(x*px.x*tapScale,0.0))*w;
    wsum+=w;
  }
  raw/=wsum;
  for(int j=-5;j<=5;j++){
    float x=float(j)*2.0+.5;
    float w=exp(-x*x/28.0)*1.8;
    merged+=source(uv+vec2(x*px.x*tapScale,0.0))*w;
  }
  merged/=10.2;
  float mip=0.0;
  for(int k=0;k<4;k++){
    float fk=float(k);
    mip+=source(uv/(1.0+fk*.35)+vec2(sin(fk+u_time)*.03,cos(fk)*.02))*(.52/(1.0+fk));
  }
  float weave=stripe(uv+merged*.025,.15+u_pointer.y,18.0)+stripe(uv-raw*.035,1.8-u_pointer.y,24.0);
  float gate=smoothstep(.34+.45*u_pointer.y,.92,mip+u_pulse*.6);
  vec3 rawCol=pal(raw*.45+uv.x*.1)*raw;
  vec3 mergedCol=vec3(.15,.7,.95)*merged+vec3(.95,.52,.2)*abs(raw-merged)*2.2;
  vec3 bloomCol=pal(mip*.34+.18)*mip+vec3(1.0,.82,.38)*pow(max(mip-.45,0.0),2.0)*3.0;
  vec3 woven=vec3(.03,.045,.055)+bloomCol*.55+mergedCol*.45+vec3(.9,.95,1.0)*weave*gate*.38;
  float mode=float(u_mode);
  vec3 col=rawCol;
  col=mix(col,mergedCol,step(1.5,mode));
  col=mix(col,bloomCol,step(2.5,mode));
  col=mix(col,woven,step(3.5,mode));
  col+=vec3(1.0,.75,.35)*exp(-9.0*length(uv-(u_pointer*2.0-1.0)*vec2(u_res.x/u_res.y,1.0)))*u_pulse;
  col*=1.0-.28*length(uv);
  gl_FragColor=vec4(pow(max(col,0.0),vec3(.86)),1.0);
}`;
const vert=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vert));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={res:gl.getUniformLocation(prog,"u_res"),time:gl.getUniformLocation(prog,"u_time"),pointer:gl.getUniformLocation(prog,"u_pointer"),pulse:gl.getUniformLocation(prog,"u_pulse"),mode:gl.getUniformLocation(prog,"u_mode")};
let pointer=[.52,.42],pulse=0,mode=4;
addEventListener("pointermove",e=>{if(e.buttons){pointer=[e.clientX/innerWidth,1-e.clientY/innerHeight]}});
addEventListener("pointerdown",e=>{pointer=[e.clientX/innerWidth,1-e.clientY/innerHeight];pulse=1});
addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4")mode=+e.key;if(e.code==="Space")pulse=1});
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener("resize",resize);resize();
const start=performance.now();
function frame(){gl.useProgram(prog);gl.uniform2f(U.res,canvas.width,canvas.height);gl.uniform1f(U.time,(performance.now()-start)/1000);gl.uniform2f(U.pointer,pointer[0],pointer[1]);gl.uniform1f(U.pulse,pulse);gl.uniform1i(U.mode,mode);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);pulse*=.9;requestAnimationFrame(frame)}
frame();
</script>
<!-- mobile-preset-controls:v1 -->
<style>
  .mobile-preset-controls {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 2147483647;
    display: flex;
    justify-content: center;
    gap: 7px;
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .mobile-preset-controls button {
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    background: rgba(8, 10, 14, 0.68);
    color: rgba(255, 255, 255, 0.92);
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    touch-action: manipulation;
  }
  .mobile-preset-controls button:active,
  .mobile-preset-controls button.is-active {
    background: rgba(255, 221, 128, 0.86);
    color: #101014;
    border-color: rgba(255, 255, 255, 0.72);
  }
  @media (hover: hover) and (pointer: fine) {
    .mobile-preset-controls { opacity: 0.42; transition: opacity 160ms ease; }
    .mobile-preset-controls:hover { opacity: 1; }
  }
  @media (max-width: 520px) {
    .mobile-preset-controls { gap: 6px; }
    .mobile-preset-controls button { min-width: 34px; height: 36px; padding: 0 10px; font-size: 12px; }
  }
</style>
<div class="mobile-preset-controls" aria-label="Preset controls">
  <button type="button" data-mobile-key="1" aria-label="Preset 1">1</button>
  <button type="button" data-mobile-key="2" aria-label="Preset 2">2</button>
  <button type="button" data-mobile-key="3" aria-label="Preset 3">3</button>
  <button type="button" data-mobile-key="4" aria-label="Preset 4">4</button>
  <button type="button" data-mobile-key="5" aria-label="Preset 5">5</button>
  <button type="button" data-mobile-key="Space" aria-label="Pulse">Pulse</button>
</div>
<script>
(() => {
  const dock = document.currentScript.previousElementSibling;
  if (!dock || dock.dataset.ready === 'true') return;
  dock.dataset.ready = 'true';
  const sendKey = (keyName) => {
    const isSpace = keyName === 'Space';
    const key = isSpace ? ' ' : keyName;
    const code = isSpace ? 'Space' : 'Digit' + keyName;
    const eventInit = { key, code, bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    if (isSpace) {
      window.setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
      }, 140);
    }
  };
  dock.querySelectorAll('button').forEach((button) => {
    const keyName = button.dataset.mobileKey;
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      dock.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      sendKey(keyName);
    });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
  });
})();
</script>
</body>
</html>
