<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Texture Lifetime Orbit</title><style>html,body{margin:0;background:#080b16;overflow:hidden;color:#dde7ff;font:12px ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}p{position:fixed;left:18px;top:8px;line-height:1.6}b{color:#a9ddff}</style><canvas></canvas><p><b>TEXTURE LIFETIME ORBIT</b><br>click: retire a lantern → rebirth from the pool<br>static constellation = bundle / pulse = safe replacement</p><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,lanterns=[],t0=performance.now();function size(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();for(let i=0;i<45;i++)lanterns.push({a:i*.43,r:60+(i%9)*25,age:Math.random()*3,life:3+Math.random()*5,hue:185+i*2});addEventListener('pointerdown',e=>{let best=lanterns.reduce((a,q)=>Math.abs(q.a-Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2))<Math.abs(a.a-Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2))?q:a);best.age=best.life;});function go(now){let t=(now-t0)/1000;x.fillStyle='#080b16';x.fillRect(0,0,innerWidth,innerHeight);let cx=innerWidth/2,cy=innerHeight/2;lanterns.forEach((q,i)=>{q.age+=.016;if(q.age>q.life){q.age=0;q.a=Math.random()*7;q.r=70+Math.random()*220;q.hue=175+Math.random()*70}let a=q.a+t*(.09+(i%4)*.015),px=cx+Math.cos(a)*q.r,py=cy+Math.sin(a)*q.r,life=1-q.age/q.life;x.strokeStyle=`hsla(${q.hue},85%,70%,${life*.22})`;x.beginPath();x.arc(cx,cy,q.r,a-.18,a+.18);x.stroke();let g=x.createRadialGradient(px,py,0,px,py,18);g.addColorStop(0,`hsla(${q.hue},100%,82%,${life})`);g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(px,py,18,0,7);x.fill()});x.fillStyle='rgba(180,220,255,.18)';x.beginPath();x.arc(cx,cy,34+Math.sin(t)*4,0,7);x.fill();requestAnimationFrame(go)}requestAnimationFrame(go);
</script></html>
