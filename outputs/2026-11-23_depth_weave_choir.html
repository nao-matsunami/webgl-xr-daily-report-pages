<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Weave Choir</title>
<style>html,body{margin:0;overflow:hidden;background:#050713;color:#e7efff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:18px;top:16px;pointer-events:none;line-height:1.55;text-shadow:0 1px 8px #000}h1{font:600 16px system-ui;margin:0 0 5px;letter-spacing:.04em}b{color:#9eeaff}#readout{position:fixed;right:18px;bottom:14px;text-align:right;color:#a9c3e7}</style>
<canvas></canvas><div id="ui"><h1>DEPTH WEAVE / CHOIR</h1><b>pointer</b> = guide light &nbsp; <b>click</b> = place a bell &nbsp; <b>space</b> = hold time<br>Shared low-resolution depth bands become a playable score.</div><div id="readout">DEPTH-AWARE STUDY<br>0 BELLS</div>
<script>
const c=document.querySelector('canvas'), gl=c.getContext('webgl',{antialias:false});
if(!gl)document.body.innerHTML='WebGL is required for this study.';
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`precision highp float;uniform vec2 r,m;uniform float t;uniform vec3 bells[8];uniform int count;float hash(vec2 p){return fract(sin(dot(p,vec2(41.23,271.9)))*613.71);}float line(float y,float w){return smoothstep(w,0.,abs(y));}void main(){vec2 p=(gl_FragCoord.xy*2.-r)/min(r.x,r.y);vec3 col=vec3(.012,.02,.075);float glow=0.;for(int k=0;k<9;k++){float z=float(k)/8.;float wave=sin(p.x*(3.+z*9.)+t*(.45+z*.5)+z*18.)*.035*(1.-z*.45);float y=-.72+z*1.45+wave;float d=line(p.y-y,.007+z*.006);vec3 hue=mix(vec3(.06,.23,.55),vec3(.92,.18,.63),z);col+=hue*d*(.3+z*.5);glow+=d*(.08+z*.12);}vec2 q=p-m;float cursor=exp(-dot(q,q)*9.);col+=vec3(.2,.75,1.)*cursor*.65;for(int i=0;i<8;i++){if(i>=count)break;vec2 b=bells[i].xy;float age=t-bells[i].z;float d=length(p-b);float ring=exp(-pow(d-fract(age*.18)*.48,2.)/.0009)*exp(-age*.10);float core=exp(-d*d*220.)*exp(-age*.05);col+=mix(vec3(.18,.8,1.),vec3(1.,.26,.58),float(i)/8.)*(ring*.55+core*1.5);glow+=ring*.25;}float grain=hash(floor(p*vec2(180.,100.)))-.5;col+=grain*.025;col+=vec3(.05,.12,.28)*glow;col=1.-exp(-col*1.35);gl_FragColor=vec4(col,1.);}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let u=n=>gl.getUniformLocation(pr,n), bells=[],mouse=[0,0],frozen=false,start=performance.now();
function resize(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',resize);resize();
function pointer(e){let x=(e.clientX-innerWidth*.5)/(Math.min(innerWidth,innerHeight)*.5),y=(innerHeight*.5-e.clientY)/(Math.min(innerWidth,innerHeight)*.5);mouse=[x,y]}addEventListener('pointermove',pointer);addEventListener('click',e=>{pointer(e);bells.push([mouse[0],mouse[1],(performance.now()-start)/1000]);if(bells.length>8)bells.shift();document.querySelector('#readout').innerHTML='DEPTH-AWARE STUDY<br>'+bells.length+' BELLS'});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();frozen=!frozen;start+=frozen?0:performance.now()-start;}});
function draw(now){requestAnimationFrame(draw);let time=frozen?bells.at(-1)?.[2]||0:(now-start)/1000;gl.uniform2f(u('r'),c.width,c.height);gl.uniform2f(u('m'),mouse[0],mouse[1]);gl.uniform1f(u('t'),time);gl.uniform1i(u('count'),bells.length);gl.uniform3fv(u('bells'),new Float32Array([...bells,...Array(8-bells.length).fill([0,0,-99])].flat()));gl.drawArrays(gl.TRIANGLES,0,3)}requestAnimationFrame(draw);
</script></html>
