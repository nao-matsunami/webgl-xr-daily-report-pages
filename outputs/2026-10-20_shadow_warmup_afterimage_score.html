<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Warmup Afterimage Score</title><style>html,body{margin:0;height:100%;background:#050611;overflow:hidden;color:#e9f5ff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:18px;left:18px;line-height:1.6;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #668;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>SHADOW WARMUP / AFTERIMAGE SCORE</b><br>pointer: light direction　<kbd>1</kbd> compile <kbd>2</kbd> casters <kbd>3</kbd> afterimage <kbd>4</kbd> composite<br>click / space: prewarm a shadow pass<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p={x:.5,y:.5},mode=4,pulse=0,last=0;function rs(){W=innerWidth;H=innerHeight;let d=devicePixelRatio;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')pulse=1});
function loop(t){let dt=Math.min(.05,(t-last)/1e3||0);last=t;pulse=Math.max(0,pulse-dt*.18);let q=t/1e3,b=Math.min(W,H),cx=W*.5,cy=H*.55,lx=p.x*W,ly=p.y*H,hot=.2+.8*pulse;g.fillStyle='rgba(3,4,13,.18)';g.fillRect(0,0,W,H);if(mode!==2){for(let i=0;i<12;i++){let x=W*.14+i*W*.065,y=H*.75-Math.sin(q*.8+i*.72)*b*.05;g.fillStyle=`hsla(${208+i*4},80%,${30+i*2}%,.78)`;g.fillRect(x,y,b*.018,b*.16)}}if(mode!==1){for(let i=0;i<24;i++){let a=i/24*Math.PI*2+q*.16,r=b*(.12+(i%5)*.025),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.42;g.strokeStyle=`hsla(${40+i*4},100%,${58+hot*28}%,${.10+hot*.38})`;g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke()}}if(mode!==1&&mode!==2){for(let j=0;j<8;j++){let lag=j*.11,rr=b*(.06+j*.033+hot*.05);g.strokeStyle=`rgba(112,210,255,${.28*(1-j/9)})`;g.beginPath();g.ellipse(cx+(p.x-.5)*b*.2*lag,cy+(p.y-.5)*b*.1*lag,rr,rr*.36,0,0,7);g.stroke()}}if(mode===4){let v=g.createRadialGradient(lx,ly,0,lx,ly,b*.3);v.addColorStop(0,'rgba(255,180,90,.32)');v.addColorStop(1,'rgba(255,180,90,0)');g.fillStyle=v;g.fillRect(0,0,W,H)}document.querySelector('#s').textContent=`mode ${mode} · shadow pipeline warmup ${Math.round(hot*100)}% · caster set 24 · afterimage age ${Math.round((1-pulse)*850)}ms`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
