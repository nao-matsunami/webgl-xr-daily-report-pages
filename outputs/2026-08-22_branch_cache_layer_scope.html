<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-08-22 Branch Cache Layer Scope</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07080b;
      color: #e9edf4;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 18px;
      top: 16px;
      max-width: 560px;
      padding: 0;
      pointer-events: none;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.65);
    }
    .hud h1 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .hud p {
      margin: 3px 0;
      font-size: 12px;
      line-height: 1.45;
      color: #cbd4e4;
    }
    .mode {
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <h1>Branch Cache Layer Scope</h1>
    <p><span class="mode" id="modeLabel">1 beauty</span> | 1 beauty / 2 branch cache fault / 3 stencil clip lanes / 4 layered texture mix</p>
    <p>Drag to move the shared node vector. Click or Space to inject a rebuild pulse.</p>
  </div>

  <script id="vertex" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fragment" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2 resolution;
    uniform vec2 pointer;
    uniform float time;
    uniform float pulse;
    uniform int mode;

    #define PI 3.14159265359

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.55;
      for (int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p = mat2(1.62, 1.12, -1.12, 1.62) * p + 0.31;
        a *= 0.5;
      }
      return v;
    }

    float sdBox(vec2 p, vec2 b) {
      vec2 d = abs(p) - b;
      return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
    }

    vec3 palette(float t) {
      return 0.5 + 0.5 * cos(6.28318 * (vec3(0.08, 0.33, 0.62) + t + vec3(0.0, 0.18, 0.36)));
    }

    float branchField(vec2 p, float branchId) {
      vec2 q = p;
      q.x += sin(q.y * 5.0 + time * 0.85 + branchId) * 0.08;
      q.y += cos(q.x * 4.0 - time * 0.65 + branchId) * 0.06;
      return fbm(q * 3.0 + branchId * 7.0);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec2 p = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
      vec2 m = (pointer * 2.0 - 1.0);
      m.x *= resolution.x / resolution.y;

      float node = branchField(p - m * 0.24, 0.0);
      float siblingA = branchField(p + vec2(0.22, 0.0), 2.0);
      float siblingB = branchField(p - vec2(0.22, 0.0), 5.0);
      float branchMask = step(0.0, sin(p.x * 2.7 + p.y * 1.4 + time * 0.8));
      float correct = mix(siblingA, siblingB, branchMask);
      float stale = mix(node, correct, 0.26 + 0.22 * sin(time + pulse * 4.0));
      float cacheFault = abs(correct - stale);

      vec2 cell = floor((uv + vec2(time * 0.015, 0.0)) * vec2(18.0, 10.0));
      float layer = mod(cell.x + cell.y, 4.0);
      float layerEdge = smoothstep(0.47, 0.5, abs(fract(uv.x * 18.0) - 0.5));
      layerEdge += smoothstep(0.47, 0.5, abs(fract(uv.y * 10.0) - 0.5));
      float alphaCoverage = step(0.48 + 0.22 * sin(time + layer), correct + 0.14 * sin(uv.x * 36.0));

      float clipA = sdBox(p - vec2(-0.34, 0.04), vec2(0.46, 0.64));
      float clipB = sdBox(p - vec2(0.34, -0.02), vec2(0.46, 0.56));
      float stencil = smoothstep(0.02, -0.01, min(clipA, clipB));
      float stencilRim = smoothstep(0.018, 0.0, abs(min(clipA, clipB)));

      vec3 tex0 = palette(correct * 0.55 + 0.06 * time);
      vec3 tex1 = vec3(0.08, 0.78, 0.92) * (0.3 + siblingA);
      vec3 tex2 = vec3(1.0, 0.42, 0.16) * (0.25 + siblingB);
      vec3 tex3 = vec3(0.86, 0.92, 0.42) * (0.25 + node);
      vec3 layered = tex0;
      layered = mix(layered, tex1, smoothstep(0.15, 0.85, alphaCoverage * (1.0 - branchMask)));
      layered = mix(layered, tex2, smoothstep(0.20, 0.90, alphaCoverage * branchMask));
      layered = mix(layered, tex3, 0.18 + 0.24 * sin(layer + time));

      vec3 beauty = mix(vec3(0.025, 0.035, 0.055), layered, 0.72);
      beauty += stencilRim * vec3(1.0, 0.75, 0.36);
      beauty += cacheFault * vec3(0.85, 0.18, 1.0) * (0.25 + pulse);
      beauty *= 0.55 + 0.45 * stencil;

      vec3 faultView = vec3(cacheFault * 2.2, correct * 0.55, stale * 0.7);
      faultView += vec3(0.7, 0.05, 0.9) * smoothstep(0.18, 0.45, cacheFault);

      vec3 stencilView = mix(vec3(0.015, 0.025, 0.035), vec3(0.05, 0.33, 0.46), stencil);
      stencilView += stencilRim * vec3(1.0, 0.8, 0.36);
      stencilView += layerEdge * 0.35 * vec3(0.5, 0.8, 1.0);
      stencilView += alphaCoverage * 0.18 * vec3(1.0);

      vec3 layerView = layered;
      layerView += layerEdge * vec3(0.15, 0.25, 0.2);
      layerView = mix(layerView, vec3(layer / 3.0, 0.2 + 0.2 * layer, 0.9 - layer * 0.18), 0.18);

      vec3 color = beauty;
      if (mode == 2) color = faultView;
      if (mode == 3) color = stencilView;
      if (mode == 4) color = layerView;

      float vignette = smoothstep(1.45, 0.15, length(p));
      color *= vignette;
      color += 0.02 * hash(gl_FragCoord.xy + time);
      gl_FragColor = vec4(pow(color, vec3(0.92)), 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true });
    const modeLabel = document.getElementById("modeLabel");
    const labels = ["1 beauty", "2 branch cache fault", "3 stencil clip lanes", "4 layered texture mix"];

    if (!gl) {
      document.body.innerHTML = "<p>WebGL is not available.</p>";
      throw new Error("WebGL unavailable");
    }

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, document.getElementById("vertex").textContent));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, document.getElementById("fragment").textContent));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      time: gl.getUniformLocation(program, "time"),
      pulse: gl.getUniformLocation(program, "pulse"),
      mode: gl.getUniformLocation(program, "mode")
    };

    let pointer = [0.55, 0.5];
    let mode = 1;
    let pulse = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.floor(innerWidth * dpr);
      const height = Math.floor(innerHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
      }
    }

    function setPointer(event) {
      pointer = [event.clientX / innerWidth, 1 - event.clientY / innerHeight];
    }

    window.addEventListener("pointermove", setPointer);
    window.addEventListener("pointerdown", (event) => {
      setPointer(event);
      pulse = 1;
    });
    window.addEventListener("keydown", (event) => {
      if (event.key >= "1" && event.key <= "4") {
        mode = Number(event.key);
        modeLabel.textContent = labels[mode - 1];
      }
      if (event.code === "Space") {
        pulse = 1;
      }
    });

    function frame(now) {
      resize();
      pulse *= 0.94;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer[0], pointer[1]);
      gl.uniform1f(uniforms.time, now * 0.001);
      gl.uniform1f(uniforms.pulse, pulse);
      gl.uniform1i(uniforms.mode, mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
