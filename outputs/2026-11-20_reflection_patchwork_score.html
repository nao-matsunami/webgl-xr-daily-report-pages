<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflection Patchwork Score</title><style>html,body{margin:0;background:#04060b;color:#e9f5ff;font:13px ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:18px;bottom:16px;line-height:1.55;text-shadow:0 1px 5px #000;pointer-events:none}b{color:#a8ffd0}span{color:#99b8d0}</style><canvas></canvas><div id="ui"><b>REFLECTION PATCHWORK / SCORE</b><br><span>pointer: steer horizon · click / space: repair a missing tile · 1–4: source / coverage / stitch / composite</span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,x=.5,y=.5,mode=4,t=0,pulse=0,tiles=[];function fit(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}fit();addEventListener('resize',fit);addEventListener('pointermove',e=>{x=e.clientX/W;y=e.clientY/H});function repair(){pulse=1;tiles.unshift({x,y,a:1});if(tiles.length>24)tiles.pop()}addEventListener('pointerdown',repair);addEventListener('keydown',e=>{if(e.key===' ')repair();if(+e.key>0&&+e.key<5)mode=+e.key});function loop(n){requestAnimationFrame(loop);t=n*.001;pulse*=.94;g.fillStyle='#04060b';g.fillRect(0,0,W,H);let hy=H*(.48+(y-.5)*.22),s=Math.max(26,Math.min(W,H)/13),sun=W*(.5+(x-.5)*.55);if(mode===1||mode===4){let sky=g.createLinearGradient(0,0,0,hy);sky.addColorStop(0,'#101d3f');sky.addColorStop(1,'#c9896d');g.fillStyle=sky;g.fillRect(0,0,W,hy);g.fillStyle='#ffe1a2';g.beginPath();g.arc(sun,hy-34,18+12*Math.sin(t*.4)**2,0,7);g.fill();g.fillStyle='#07122b';g.fillRect(0,hy,W,H-hy)}if(mode===2||mode===4){for(let j=0;j<8;j++)for(let i=0;i<18;i++){let X=i*W/18,Y=hy+j*(H-hy)/8;let miss=(Math.sin(i*4.7+j*7.1+t*.4)+1)/2<.23+Math.abs(x-i/18)*.18;g.fillStyle=miss?'rgba(8,13,26,.92)':`rgba(97,178,255,${.12+j*.022})`;g.fillRect(X+1,Y+1,W/18-2,(H-hy)/8-2)}}if(mode===3||mode===4){tiles.forEach((q,i)=>{q.a*=.992;let X=q.x*W,Y=hy+(1-q.y)*(H-hy);let r=s*(1+i*.055);g.strokeStyle=`rgba(160,255,211,${q.a*.65})`;g.lineWidth=1+q.a*3;g.beginPath();g.arc(X,Y,r,0,7);g.stroke();g.fillStyle=`rgba(160,255,211,${q.a*.08})`;g.fillRect(X-r,Y-r,r*2,r*2)});g.strokeStyle=`rgba(255,226,170,${.18+pulse*.55})`;g.setLineDash([4,8]);g.beginPath();g.moveTo(0,hy);g.lineTo(W,hy);g.stroke();g.setLineDash([])}if(mode===4){for(let i=0;i<80;i++){let X=(i*97%W),Y=hy+(i*47%(H-hy));g.fillStyle=`rgba(255,${180+i%60},${130+i%80},${.06+pulse*.16})`;g.fillRect(X,Y,1+(i%3),1+(i%3))}}let names=['SOURCE / sky + water','COVERAGE / reflection tiles','STITCH / repair history','COMPOSITE / patched horizon'];g.fillStyle='#e9f5ff';g.fillText(names[mode-1],18,28);g.fillStyle='#9ab9cf';g.fillText(`coverage ${(77+pulse*19|0)}% · repairs ${tiles.length} · history ${tiles.length?'held':'quiet'}`,18,48)}requestAnimationFrame(loop);
</script></html>
