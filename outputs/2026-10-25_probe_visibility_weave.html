<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probe Visibility Weave</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#070a12;color:#eff8ff;font:13px/1.45 ui-monospace,SFMono-Regular,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:490px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.17em;color:#8edcff}.title{margin:7px 0;font-size:clamp(22px,3.5vw,42px);line-height:1.02}.meta{color:#aebdce}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #385775;border-radius:999px;color:#bcecff}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#bdcce0}</style>
<canvas></canvas><div class="hud"><div class="eyebrow">LIGHT PROBE GRID / DDGI STATE STUDY — 25 OCT 2026</div><div class="title">Visibility turns leaking light<br>into a woven room score.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: observer &amp; occlusion</span><span class="tag">click / space: radiance pulse</span><span class="tag">1–4: isolate pass</span></div></div><div class="keys">1 probes &nbsp; 2 visibility &nbsp; 3 SH weave &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,x=.5,y=.5,mode=4,pulse=0,last=0;function fit(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(e.key===' ')pulse=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;pulse*=Math.exp(-dt*1.45);const w=innerWidth,h=innerHeight,T=t*.001,cx=w*.53,cy=h*.54,R=Math.min(w,h)*.31,occ=.08+.84*y,show=n=>mode===4||mode===n;g.fillStyle='#070a12';g.fillRect(0,0,w,h);
if(show(1)){for(let iy=-3;iy<=3;iy++)for(let ix=-4;ix<=4;ix++){let px=cx+ix*R*.23,py=cy+iy*R*.23;g.strokeStyle='rgba(109,218,255,.42)';g.beginPath();g.arc(px,py,7+3*Math.sin(T+ix+iy),0,7);g.stroke();g.fillStyle='#baf1ff';g.fillRect(px-1,py-1,2,2)}}
if(show(2)){const ox=cx+(x-.5)*R*1.5,oy=cy+(y-.5)*R;g.strokeStyle='rgba(255,151,204,.8)';g.setLineDash([5,7]);for(let a=0;a<18;a++){let q=a/18*Math.PI*2;g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+Math.cos(q)*R*1.3,oy+Math.sin(q)*R*.85);g.stroke()}g.setLineDash([]);g.fillStyle='#fff0b3';g.beginPath();g.arc(ox,oy,7,0,7);g.fill();g.fillStyle=`rgba(9,12,20,${occ*.78})`;g.fillRect(cx-R*.84,cy-R*.62,R*1.68,R*1.24)}
if(show(3)){for(let i=0;i<68;i++){let a=i*2.399+T*.08,r=R*(.08+(i%17)/18),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.72;let alpha=(1-occ*.72)*(.22+.58*((i%5)/4))+pulse*.4;g.strokeStyle=`hsla(${178+i%90},92%,70%,${alpha})`;g.lineWidth=1.2+(i%3);g.beginPath();g.moveTo(px,py);g.quadraticCurveTo(cx+(x-.5)*R*.55,cy+(y-.5)*R*.35,cx+Math.cos(a+.9)*r,cy+Math.sin(a+.9)*r*.72);g.stroke()}}
if(show(4)){let q=g.createRadialGradient(cx,cy,4,cx,cy,R*1.65);q.addColorStop(0,'rgba(148,226,255,.16)');q.addColorStop(.53,'rgba(255,105,181,.055)');q.addColorStop(1,'rgba(7,10,18,0)');g.fillStyle=q;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`observer ${Math.round(x*100)} · occlusion ${Math.round(occ*100)}% · probes 63 · leak rejection ${Math.round(occ*74)}% · ${['PROBES','VISIBILITY','SH WEAVE','COMPOSITE'][mode-1]}`}
requestAnimationFrame(loop);
</script></html>
