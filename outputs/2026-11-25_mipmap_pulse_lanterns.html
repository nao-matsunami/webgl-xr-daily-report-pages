<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mipmap Pulse Lanterns</title>
<style>html,body{margin:0;background:#050610;overflow:hidden;color:#eaf7ff;font:12px ui-monospace,monospace}canvas{display:block}#ui{position:fixed;left:18px;top:16px;line-height:1.65;text-shadow:0 2px 12px #000}h1{margin:0 0 4px;font:600 16px system-ui;letter-spacing:.08em}b{color:#ffc782}</style>
<canvas></canvas><div id="ui"><h1>MIPMAP PULSE / LANTERNS</h1><b>move</b> = change detail scale &nbsp; <b>click</b> = send a cached warm-up pulse<br>One pattern is read at coarse and fine scales, then made audible.</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),dots=[];let mouse={x:.5,y:.5},audio;function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();addEventListener('pointermove',e=>mouse={x:e.clientX/innerWidth,y:e.clientY/innerHeight});addEventListener('click',e=>{dots.push({x:e.clientX,y:e.clientY,t:performance.now()});if(dots.length>18)dots.shift();if(!audio){audio=new AudioContext()}let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=160+e.clientY/innerHeight*360;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.45);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.48)});function draw(now){requestAnimationFrame(draw);let w=innerWidth,h=innerHeight,detail=3+Math.floor(mouse.x*17);x.fillStyle='#050610';x.fillRect(0,0,w,h);for(let y=0;y<h;y+=detail*2){for(let z=0;z<w;z+=detail*2){let wave=Math.sin(z*.018+y*.024+now*.001)+Math.sin(z*.008-now*.0007);let a=(wave+2)/4;x.fillStyle=`hsla(${200+a*70},80%,${10+a*16}%,.85)`;x.fillRect(z,y,detail*2,detail*2)}}for(let i=0;i<26;i++){let px=(i*.61803398875%1)*w,py=(.18+(i*.382)%1*.72)*h;let r=5+Math.sin(now*.001+i)*2;x.beginPath();x.fillStyle='rgba(255,190,104,.68)';x.shadowBlur=18;x.shadowColor='#ff7a32';x.arc(px,py,r,0,7);x.fill()}x.shadowBlur=0;for(const d of dots){let age=(now-d.t)/1000;if(age>5)continue;let r=age*105;x.strokeStyle=`rgba(255,170,75,${1-age/5})`;x.lineWidth=2;x.beginPath();x.arc(d.x,d.y,r,0,7);x.stroke()}x.fillStyle='#d8efff';x.fillText('DETAIL LEVEL '+detail+'  /  PULSES '+dots.length,18,h-22)}requestAnimationFrame(draw);
</script></html>
