<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velocity Reprojection Lanterns</title><style>html,body{margin:0;background:#080917;color:#e4eaff;font:12px ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:16px;top:15px;line-height:1.65;pointer-events:none}b{color:#ffc478}kbd{border:1px solid #876;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>VELOCITY REPROJECTION LANTERNS</b><br>pointer: motion vector　click/Space: instance cut　<kbd>1</kbd> velocity <kbd>2</kbd> previous <kbd>3</kbd> reject <kbd>4</kbd> composite<br><span id="status"></span></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let W,H,m=4,mx=.5,my=.5,kick=0,t=0;function rz(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}rz();addEventListener('resize',rz);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});addEventListener('pointerdown',()=>kick=1);addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')m=+e.key;if(e.code==='Space')kick=1});const dots=Array.from({length:240},(_,i)=>({a:Math.random()*6.28,r:30+Math.random()*Math.min(innerWidth,innerHeight)*.45,z:Math.random(),p:0}));function draw(now){let dt=Math.min(.04,(now-t||16)/1000);t=now;kick*=.94;let vx=(mx-.5)*2,vy=(my-.5)*2,vel=Math.hypot(vx,vy)+kick*.8;x.fillStyle='#080917';x.fillRect(0,0,innerWidth,innerHeight);let reject=0;dots.forEach((d,i)=>{let a=d.a+now*.00018*(.3+d.z)+vx*.25;let rr=d.r*(.65+d.z*.55);let X=innerWidth*.5+Math.cos(a)*rr+vx*now*.012,Y=innerHeight*.5+Math.sin(a*1.43)*rr+vy*now*.012;let dx=X-d.px||0,dy=Y-d.py||0,broken=Math.hypot(dx,dy)>20||kick>.18;if(broken)reject++;if(m===1){x.strokeStyle='rgba(112,201,255,.45)';x.beginPath();x.moveTo(X,Y);x.lineTo(X-dx*3,Y-dy*3);x.stroke()}if(m===2&&!broken){x.fillStyle='rgba(255,150,80,.10)';x.beginPath();x.arc(d.px||X,d.py||Y,3+d.z*7,0,7);x.fill()}if(m===3&&broken){x.strokeStyle='rgba(255,92,130,.9)';x.beginPath();x.arc(X,Y,8+d.z*10,0,7);x.stroke()}if(m===4||m===2&&!broken||m===3&&broken){let g=x.createRadialGradient(X,Y,0,X,Y,4+d.z*18);g.addColorStop(0,broken?'rgba(255,115,88,.95)':'rgba(255,222,151,.85)');g.addColorStop(1,'rgba(255,132,68,0)');x.fillStyle=g;x.fillRect(X-25,Y-25,50,50)}d.px=X;d.py=Y});x.fillStyle='rgba(255,255,255,.07)';x.fillRect(0,innerHeight*.72,innerWidth,1);s.textContent=`instance velocity ${vel.toFixed(2)} · rejected ${reject}/${dots.length} · mode ${m} · ${kick>.1?'matrix cut':'reprojecting'}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
