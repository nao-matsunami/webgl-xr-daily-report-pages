<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRT Echo Score</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#070a10;color:#edf7ff;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:520px;pointer-events:none}.ey{font-size:10px;letter-spacing:.16em;color:#8cdcff}.title{margin:7px 0;font-size:clamp(23px,3.7vw,44px);line-height:1.02}.meta{color:#afc2d0}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #3c5e73;border-radius:999px;color:#c7efff}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#c7d6e2}</style>
<canvas></canvas><div class="hud"><div class="ey">MULTIPLE RENDER TARGET / EXR ECHO STUDY — 26 OCT 2026</div><div class="title">Every attachment keeps<br>a different kind of memory.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: capture focus</span><span class="tag">click / space: export beat</span><span class="tag">1–4: attachment pass</span></div></div><div class="keys">1 albedo &nbsp; 2 normal &nbsp; 3 depth &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,beat=0,last=0;function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(e.key===' ')beat=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1e3||0);last=t;beat*=Math.exp(-dt*1.45);let w=innerWidth,h=innerHeight,T=t/1e3,cx=w*x,cy=h*y,R=Math.min(w,h)*(.12+.12*y),show=n=>mode===4||mode===n;g.fillStyle='#070a10';g.fillRect(0,0,w,h);for(let i=0;i<128;i++){let a=i*2.399+T*.16,r=15+Math.sqrt(i)*17,px=w*.52+Math.cos(a)*r*1.2,py=h*.54+Math.sin(a)*r*.72,z=Math.max(0,1-Math.hypot(px-cx,py-cy)/(R*2.3));if(show(1)){g.fillStyle=`hsla(${190+i%80},90%,${42+z*36}%,${.22+z*.65})`;g.beginPath();g.arc(px,py,2+z*4,0,7);g.fill()}if(show(2)){g.strokeStyle=`rgba(${80+z*160},${150+z*90},255,${.08+z*.44})`;g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a+1.4)*10*(1+z*2),py+Math.sin(a+1.4)*10*(1+z*2));g.stroke()}if(show(3)){g.strokeStyle=`rgba(255,${120+i%80},180,${.05+z*.35+beat*.25})`;g.beginPath();g.arc(px,py,7+z*15+beat*18,0,7);g.stroke()}}if(show(4)){let q=g.createRadialGradient(cx,cy,2,cx,cy,R*3);q.addColorStop(0,'rgba(255,235,160,.18)');q.addColorStop(.4,'rgba(90,182,255,.08)');q.addColorStop(1,'rgba(7,10,16,0)');g.fillStyle=q;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`capture focus ${Math.round(x*100)} · attachments 3 · textureIndex ${mode===4?'all':mode-1} · EXR echo ${Math.round(beat*100)}% · ${['ALBEDO','NORMAL','DEPTH','COMPOSITE'][mode-1]}`};requestAnimationFrame(loop);
</script></html>
