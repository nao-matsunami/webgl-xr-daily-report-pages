<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame Graph Splat Cue Field</title><style>html,body{margin:0;height:100%;background:#05070c;overflow:hidden;color:#e8f7ff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:18px;left:18px;line-height:1.6;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #668;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>FRAME GRAPH / SPLAT CUE FIELD</b><br>pointer: focal target　<kbd>1</kbd> passes <kbd>2</kbd> budget <kbd>3</kbd> cue <kbd>4</kbd> composite<br>click / space: insert a frame-graph beat<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p={x:.5,y:.5},mode=4,beat=0,last=0;function rs(){W=innerWidth;H=innerHeight;let d=devicePixelRatio;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')beat=1});
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;beat=Math.max(0,beat-dt*.3);let q=t/1000,b=Math.min(W,H),fx=p.x*W,fy=p.y*H,active=20+Math.floor(beat*100);g.fillStyle='rgba(3,5,10,.16)';g.fillRect(0,0,W,H);let nodes=[[.18,.28,'depth'],[.42,.2,'sort'],[.72,.31,'light'],[.27,.69,'splat'],[.58,.73,'tone'],[.84,.61,'out']];
if(mode!==2){g.lineWidth=1;for(let i=0;i<nodes.length-1;i++){let a=nodes[i],z=nodes[i+1];g.strokeStyle=`rgba(103,216,255,${.18+beat*.55})`;g.beginPath();g.moveTo(a[0]*W,a[1]*H);g.bezierCurveTo((a[0]+z[0])*W/2,a[1]*H,(a[0]+z[0])*W/2,z[1]*H,z[0]*W,z[1]*H);g.stroke()}}
if(mode!==1){for(let i=0;i<160;i++){let x=(i*71%997)/997*W,y=(i*193%991)/991*H,d=Math.hypot(x-fx,y-fy)/b,r=Math.max(0,1-d*2.6),on=i<active;g.fillStyle=`hsla(${185+i%70},95%,${45+r*42}%,${on?(.08+r*.75):.035})`;g.beginPath();g.arc(x,y,.6+r*4+(i%3),0,7);g.fill()}}
if(mode!==1&&mode!==2){for(let i=0;i<nodes.length;i++){let n=nodes[i],x=n[0]*W,y=n[1]*H,R=b*(.022+beat*.018);let h=190+i*18;g.fillStyle=`hsla(${h},85%,${42+beat*36}%,.85)`;g.beginPath();g.arc(x,y,R,0,7);g.fill();g.fillStyle='#e9faff';g.fillText(n[2],x+R+5,y+3)}}if(mode===4){g.strokeStyle=`rgba(255,193,110,${.25+beat*.7})`;g.beginPath();g.arc(fx,fy,b*(.04+beat*.18),0,7);g.stroke()}document.querySelector('#s').textContent=`mode ${mode} · focal budget ${active}/120 · graph pulse ${Math.round(beat*100)}% · passes 6`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
