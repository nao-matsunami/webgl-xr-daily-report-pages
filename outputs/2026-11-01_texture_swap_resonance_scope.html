<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Texture Swap Resonance Scope</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05060b;color:#f1f5ff;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:620px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#ffa86b}.title{margin:7px 0;font-size:clamp(23px,3.8vw,45px);line-height:1.02}.meta{color:#cbd5e4}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #7d4a35;border-radius:999px;color:#ffe0c8}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#d7c8d6}</style>
<canvas></canvas><div class="hud"><div class="ey">TEXTURE SWAP × COPY REGION × MEMORY — 01 NOV 2026</div><div class="title">A material change<br>leaves a resonance.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: copy region / focus</span><span class="tag">click / space: swap texture</span><span class="tag">1–4: isolate passes</span></div></div><div class="keys">1 source &nbsp; 2 copy region &nbsp; 3 sampler resonance &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),gl=c.getContext('webgl');let mx=.5,my=.5,mode=4,pulse=0,last=0,swaps=0;
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 r,m;uniform float t,k,view;float n(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5);}float box(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;float time=t*.001;vec2 focus=(m-.5)*vec2(1.1,.62);vec2 q=uv-focus*.14;float tile=step(.5,fract(q.x*6.+q.y*2.))*step(.45,fract(q.y*5.-time*.05));float src=.5+.5*sin(q.x*18.+sin(q.y*7.-time*.7)*2.+time);float region=smoothstep(.39,.36,abs(length(q-focus*.36)-.25));float frame=smoothstep(.018,.0,abs(box(q-focus*.24,vec2(.36,.21))));float compress=sin(q.x*57.+q.y*23.+time*2.)*.5+.5;float ring=exp(-18.*abs(length(q-focus*.24)-(.08+k*.36)))*(1.-k);float swap=exp(-4.*k)*(1.-smoothstep(.0,.9,k));vec3 source=mix(vec3(.025,.04,.10),vec3(.12,.72,1.),src)*(.25+.75*tile);vec3 copy=source*region+vec3(.95,.34,.12)*frame;vec3 sampler=vec3(.05,.02,.11)+vec3(.95,.2,.55)*ring+vec3(.2,.75,1.)*compress*.22;vec3 v;if(view<1.5)v=source;else if(view<2.5)v=copy;else if(view<3.5)v=sampler;else v=source*.42+copy*.6+sampler*.85;v+=vec3(1.,.48,.18)*swap*(.2+.8*region);v+=n(q*160.)*.035;gl_FragColor=vec4(v,1.);}`;
function shader(t,s){let z=gl.createShader(t);gl.shaderSource(z,s);gl.compileShader(z);return z}const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);const U=x=>gl.getUniformLocation(p,x),ur=U('r'),um=U('m'),ut=U('t'),uk=U('k'),uv=U('view');
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight});function fire(){pulse=1;swaps++}addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.key===' ')fire();if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000||0);last=now;pulse+=dt*(0-pulse)*1.8;gl.uniform2f(ur,c.width,c.height);gl.uniform2f(um,mx,my);gl.uniform1f(ut,now);gl.uniform1f(uk,pulse);gl.uniform1f(uv,mode);gl.drawArrays(gl.TRIANGLES,0,3);document.querySelector('#meta').textContent=`copy window ${Math.round(mx*100)}% · sampler ${pulse>.08?'rebuilding':'stable'} · compressed mip estimate ${Math.round(24+mx*58)} MB · swaps ${swaps}`}
requestAnimationFrame(loop);
</script></html>
