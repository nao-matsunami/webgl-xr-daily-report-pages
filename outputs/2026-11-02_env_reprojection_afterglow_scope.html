<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Environment Reprojection Afterglow Scope</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#03050a;color:#eaf7ff;font:13px/1.45 ui-monospace,monospace}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;left:18px;top:17px;max-width:650px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#8cf0d8}.title{font:700 clamp(24px,4.2vw,52px)/.98 system-ui;margin:7px 0}.meta{color:#bcd1dc}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #2f6c6f;border-radius:999px;color:#c7fff1}.keys{position:fixed;right:18px;bottom:17px;text-align:right;color:#bcd1dc}</style>
<canvas></canvas><div class="hud"><div class="ey">RUNTIME ENV LIGHT × REPROJECTION CACHE × AFTERGLOW — 02 NOV 2026</div><div class="title">Make the light update<br>leave a trace.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: sky / probe direction</span><span class="tag">click / space: regenerate atlas</span><span class="tag">1–4: source / faces / cache / composite</span></div></div><div class="keys">1 sky source &nbsp; 2 cube faces &nbsp; 3 cache echoes &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),gl=c.getContext('webgl');let mx=.5,my=.5,mode=4,last=0,pulse=0,cycles=0;
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 r,m;uniform float t,p,mode;float h(vec2 q){return fract(sin(dot(q,vec2(41.2,289.7)))*16317.13);}float ring(vec2 q,float a,float b){return smoothstep(b,b-.008,abs(length(q)-a));}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;vec3 col=vec3(.008,.016,.035);float ang=atan(uv.y,uv.x)+m.x*6.283;float rad=length(uv);float sky=.5+.5*sin(ang*3.+t*.31+m.y*5.);vec3 env=mix(vec3(.025,.13,.22),vec3(.15,.85,.69),sky)*(1.-smoothstep(.15,.9,rad));float cube=0.;for(int i=0;i<6;i++){float a=float(i)*1.0472+t*.04;vec2 q=mat2(cos(a),-sin(a),sin(a),cos(a))*uv;cube+=smoothstep(.24,.23,max(abs(q.x),abs(q.y)))*smoothstep(.47,.45,max(abs(q.x),abs(q.y)));}float echo=0.;for(int j=0;j<5;j++){float z=float(j);echo+=ring(uv,.18+z*.115+p*.17, .0)*exp(-z*.38);}float seam=step(.5,fract((ang+3.1416)/1.0472));if(mode<1.5)col=env;else if(mode<2.5)col=vec3(.03,.12,.16)+cube*mix(vec3(.07,.45,.55),vec3(.2,.95,.68),seam);else if(mode<3.5)col=vec3(.01,.02,.05)+vec3(.12,.78,.72)*echo;else col=env+cube*vec3(.04,.3,.38)+vec3(.08,.72,.64)*echo;col+=.025*h(floor(uv*210.));gl_FragColor=vec4(col,1.);}`;
function sh(type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);return x}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW),gl.useProgram(pr);let loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);let U=n=>gl.getUniformLocation(pr,n);
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});function fire(){pulse=1;cycles++}addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.key===' ')fire();if(+e.key>0&&+e.key<5)mode=+e.key});function draw(now){requestAnimationFrame(draw);let dt=Math.min(.05,(now-last)/1000||0);last=now;pulse*=Math.exp(-dt*1.25);gl.uniform2f(U('r'),c.width,c.height);gl.uniform2f(U('m'),mx,my);gl.uniform1f(U('t'),now*.001);gl.uniform1f(U('p'),pulse);gl.uniform1f(U('mode'),mode);gl.drawArrays(gl.TRIANGLES,0,3);document.querySelector('#meta').textContent=`atlas regeneration ${cycles} · cache age ${(1-pulse).toFixed(2)} · 6 faces × mip regions · ${['sky source','cube faces','cache echoes','composite'][mode-1]}`}requestAnimationFrame(draw);
</script></html>
