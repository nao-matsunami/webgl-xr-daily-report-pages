const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,x=.5,y=.5,mode=4,kick=0,t=0,queue=0;const dots=Array.from({length:126},(_,i)=>({a:i*2.399,b:(i%13)*.77,r:35+(i*37)%310,delay:(i%17)/17}));function z(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}z();addEventListener('resize',z);addEventListener('pointermove',e=>{x=e.clientX/W;y=e.clientY/H});function resolve(){kick=1;queue=Math.min(1,queue+.48)}addEventListener('pointerdown',resolve);addEventListener('keydown',e=>{if(e.key===' ')resolve();if(+e.key>0&&+e.key<5)mode=+e.key});function glow(X,Y,r,col){let q=g.createRadialGradient(X,Y,0,X,Y,r);q.addColorStop(0,col);q.addColorStop(1,'transparent');g.fillStyle=q;g.fillRect(X-r,Y-r,r*2,r*2)}function f(n){requestAnimationFrame(f);t=n*.001;kick*=.94;queue*=.996;g.fillStyle='#06040d';g.fillRect(0,0,W,H);let cx=W*x,cy=H*y;dots.forEach((d,i)=>{let ang=d.a+t*.11,rr=d.r*(.72+.28*Math.sin(t*.4+d.b));let X=cx+Math.cos(ang)*rr,Y=cy+Math.sin(ang*.86)*rr*.56;let rank=Math.max(0,1-Math.hypot(X-cx,Y-cy)/(Math.min(W,H)*.42));let ready=Math.max(0,Math.min(1,(queue+rank*.64-d.delay)*2.3));if(mode===1||mode===4){if(ready<.72){g.strokeStyle=`rgba(180,119,255,${.06+rank*.14})`;g.beginPath();g.arc(X,Y,4,0,7);g.stroke()}}if(mode===2||mode===4){if(ready>.22){g.strokeStyle=`rgba(122,198,255,${ready*.24})`;g.beginPath();g.moveTo(X,Y);g.lineTo(cx,cy);g.stroke()}}if(mode===3||mode===4){if(ready>.45){let r=1.5+ready*4;glow(X,Y,14+r*2,`rgba(255,166,232,${ready*.2})`);g.fillStyle=`rgba(244,220,255,${ready*.8})`;g.beginPath();g.arc(X,Y,r,0,7);g.fill()}}});if(mode===4){glow(cx,cy,125+kick*80,`rgba(126,213,255,${.1+kick*.2})`);g.strokeStyle='rgba(239,207,255,.5)';g.beginPath();g.arc(cx,cy,18+kick*42,0,7);g.stroke()}g.fillStyle='#f2ddff';g.fillText(['PENDING / cached pipelines','SORT / view-space ranks','SETTLE / stable splats','COMPOSITE / choir'][mode-1],18,28);g.fillStyle='#c8a8d9';g.fillText(`qu
