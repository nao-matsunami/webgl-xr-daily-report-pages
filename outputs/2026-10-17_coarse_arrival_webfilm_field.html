<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coarse Arrival Webfilm Field</title><style>html,body{margin:0;height:100%;background:#05070a;overflow:hidden;color:#e6f5ee;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#t{position:fixed;left:18px;top:18px;line-height:1.6}b{color:#fff}kbd{border:1px solid #697;padding:1px 4px}</style><canvas></canvas><div id="t"><b>COARSE ARRIVAL / WEBFILM FIELD</b><br>pointer: attention / stream target　<kbd>1</kbd> coarse <kbd>2</kbd> fine <kbd>3</kbd> tone <kbd>4</kbd> composite<br>click / space: arrival burst</div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,P={x:.5,y:.5},m=4,b=0;function rs(){w=c.width=innerWidth;h=c.height=innerHeight}rs();onresize=rs;onpointermove=e=>P={x:e.clientX/w,y:e.clientY/h};onpointerdown=()=>b=1;onkeydown=e=>{if(+e.key)m=+e.key;if(e.code==='Space')b=1};let then=0;
function draw(now){let dt=Math.min(.05,(now-then)/1000||0);then=now;b=Math.max(0,b-dt*.35);g.fillStyle='rgba(3,6,9,.2)';g.fillRect(0,0,w,h);let cx=P.x*w,cy=P.y*h,time=now*.001;
for(let k=0;k<430;k++){let a=k*2.399+Math.sin(k)*.2,r=Math.sqrt(k/430)*Math.max(w,h)*.75,x=cx+Math.cos(a+time*.07)*r,y=cy+Math.sin(a+time*.07)*r*.58;let near=1-Math.min(1,Math.hypot(x-cx,y-cy)/(Math.min(w,h)*.62));let rank=(Math.sin(k*31.7)*.5+.5),arrive=Math.max(0,near*.9+b*.7-rank*.45);let coarse=2+8*(1-rank),fine=1+arrive*5;if(m===1||m===4){g.fillStyle=`hsla(${184+rank*55},70%,${38+arrive*42}%,${.09+arrive*.55})`;g.beginPath();g.arc(x,y,coarse,0,7);g.fill()}if(m===2||m===4){g.fillStyle=`hsla(${38+rank*35},95%,${55+arrive*28}%,${arrive*.72})`;g.fillRect(x-fine,y-fine,fine*2,fine*2)}}
if(m===3||m===4){let gr=g.createRadialGradient(cx,cy,2,cx,cy,Math.min(w,h)*.42);gr.addColorStop(0,`rgba(255,174,95,${.23+b*.4})`);gr.addColorStop(.45,'rgba(66,175,255,.08)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}g.strokeStyle='rgba(202,240,255,.32)';g.beginPath();g.arc(cx,cy,18+b*90,0,7);g.stroke();requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
