<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Probe Afterimage</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#11100e;color:#fff7e9;font:13px/1.45 ui-monospace,SFMono-Regular,monospace}canvas{width:100vw;height:100vh;display:block}.copy{position:fixed;left:18px;top:18px;pointer-events:none;max-width:460px}.over{letter-spacing:.16em;font-size:10px;color:#ffd79e}.title{font-size:clamp(21px,3.2vw,39px);line-height:1.02;margin:8px 0}.meta{color:#c9bca8}.hint{position:fixed;right:18px;bottom:16px;text-align:right;color:#ded0ba}</style>
<canvas></canvas><div class="copy"><div class="over">DOM / SHADER COMPOSITING STUDY — 24 OCT 2026</div><div class="title">A paper surface remembers<br>the light it did not receive.</div><div class="meta" id="m"></div></div><div class="hint">pointer: cut / parallax<br>click / space: expose<br>1–4: paper / cut / probe / composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,x=.5,y=.5,mode=4,flash=0,last=0;function fit(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}fit();addEventListener('resize',fit);addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',()=>flash=1);addEventListener('keydown',e=>{if(e.key===' ')flash=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function f(t){requestAnimationFrame(f);const d=Math.min(.05,(t-last)/1000||0);last=t;flash*=Math.exp(-d*1.1);const w=innerWidth,h=innerHeight,T=t*.001,S=Math.min(w,h)*.31,show=n=>mode===4||mode===n;g.fillStyle='#11100e';g.fillRect(0,0,w,h);const cx=w*.55+(x-.5)*S*.3,cy=h*.55+(y-.5)*S*.2;
 if(show(1)){g.fillStyle='#e8d8bd';g.save();g.translate(cx,cy);g.rotate((x-.5)*.18);g.fillRect(-S,-S*.7,S*2,S*1.4);g.strokeStyle='#9c896c';g.strokeRect(-S,-S*.7,S*2,S*1.4);for(let i=0;i<22;i++){g.strokeStyle=`rgba(75,57,39,${.03+(i%3)*.02})`;g.beginPath();g.moveTo(-S,-S*.67+i*S*.065);g.bezierCurveTo(-S*.2,-S*.8+i*S*.08,S*.2,-S*.48+i*S*.05,S,-S*.65+i*S*.07);g.stroke()}g.restore()}
 if(show(2)){g.save();g.globalCompositeOperation='destination-out';g.beginPath();g.ellipse(cx+(x-.5)*S*.7,cy+(y-.5)*S*.45,S*.38,S*.23,(x-.5)*.5,0,7);g.fill();g.restore();g.strokeStyle='rgba(49,35,22,.5)';g.setLineDash([5,7]);g.beginPath();g.ellipse(cx+(x-.5)*S*.7,cy+(y-.5)*S*.45,S*.38,S*.23,(x-.5)*.5,0,7);g.stroke();g.setLineDash([])}
 if(show(3)){const a=.14+flash*.72,px=cx+(x-.5)*S*.7,py=cy+(y-.5)*S*.45;for(let i=0;i<9;i++){g.strokeStyle=`rgba(255,157,82,${a*(1-i/10)})`;g.lineWidth=2;g.beginPath();g.ellipse(px,py,S*(.42+i*.13),S*(.25+i*.07),0,0,7);g.stroke()}g.fillStyle='rgba(255,118,75,'+a+')';g.fillRect(px-S*.8,py-S*.08,S*1.6,S*.16)}
 if(show(4)){const r=g.createRadialGradient(cx,cy,2,cx,cy,S*1.5);r.addColorStop(0,'rgba(255,201,118,.18)');r.addColorStop(1,'rgba(17,16,14,0)');g.fillStyle=r;g.fillRect(0,0,w,h)}document.querySelector('#m').textContent=`cut angle ${Math.round((x-.5)*90)}° · afterimage ${Math.round((.14+flash*.72)*100)}% · ${['PAPER','CUT','PROBE','COMPOSITE'][mode-1]}`;}requestAnimationFrame(f);
</script></html>
