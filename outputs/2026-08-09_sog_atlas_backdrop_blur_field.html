<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-08-09 SOG Atlas Backdrop Blur Field</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: #d9f7ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .hud {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      pointer-events: none;
      color: rgba(221, 252, 255, 0.82);
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 11px;
      line-height: 1.55;
    }

    .hud strong {
      color: #ffffff;
      font-weight: 700;
    }

    .modes {
      text-align: right;
      color: rgba(168, 230, 245, 0.7);
    }

    @media (max-width: 720px) {
      .hud {
        grid-template-columns: 1fr;
        font-size: 10px;
      }

      .modes {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <div>
      <strong>SOG ATLAS BACKDROP BLUR FIELD</strong><br>
      Drag bends streamed atlas bands. Hold / Space injects memory pressure.
    </div>
    <div class="modes">1 Atlas LOD / 2 Tombstone Compact / 3 Backdrop Blur / 4 Gradient Rebake</div>
  </div>

  <script id="vertex" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fragment" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2 u_resolution;
    uniform vec2 u_pointer;
    uniform float u_time;
    uniform float u_pressure;
    uniform float u_mode;

    #define PI 3.14159265359

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 345.45));
      p += dot(p, p + 34.345);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }

    float sdSegment(vec2 p, vec2 a, vec2 b) {
      vec2 pa = p - a;
      vec2 ba = b - a;
      float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
      return length(pa - ba * h);
    }

    float band(vec2 uv, float y, float width) {
      return smoothstep(width, 0.0, abs(uv.y - y));
    }

    float pulse(float x, float speed, float width) {
      float v = fract(x - u_time * speed);
      return smoothstep(width, 0.0, abs(v - 0.5));
    }

    vec3 palette(float t) {
      vec3 a = vec3(0.09, 0.68, 0.92);
      vec3 b = vec3(0.97, 0.28, 0.82);
      vec3 c = vec3(1.0, 0.82, 0.22);
      return mix(mix(a, b, smoothstep(0.0, 0.65, t)), c, smoothstep(0.55, 1.0, t));
    }

    vec3 backdrop(vec2 uv) {
      vec2 p = uv - 0.5;
      float r = length(p);
      float stars = pow(noise(uv * 180.0 + u_time * 0.02), 28.0);
      float nebula = noise(uv * 5.0 + vec2(0.0, u_time * 0.04));
      vec3 col = mix(vec3(0.015, 0.025, 0.045), vec3(0.04, 0.08, 0.12), nebula);
      col += vec3(0.08, 0.26, 0.32) * exp(-r * 5.0);
      col += vec3(0.6, 0.85, 1.0) * stars;
      return col;
    }

    vec3 cheapBlur(vec2 uv, vec2 dir, float repeats) {
      vec3 sum = vec3(0.0);
      float total = 0.0;
      for (int i = -4; i <= 4; i++) {
        float fi = float(i);
        float enabled = step(abs(fi), repeats);
        float w = enabled * (1.0 - abs(fi) / 5.0);
        sum += backdrop(uv + dir * fi) * w;
        total += w;
      }
      return sum / max(total, 0.001);
    }

    vec3 atlasLane(vec2 uv, vec2 pointer) {
      vec3 col = vec3(0.0);
      float pressure = u_pressure;
      for (int i = 0; i < 7; i++) {
        float fi = float(i);
        float y = 0.18 + fi * 0.105;
        float drift = sin(uv.x * 8.0 + fi * 1.7 + u_time * 0.7) * 0.018;
        float bend = 0.08 * exp(-abs(uv.x - pointer.x) * 8.0) * (pointer.y - 0.5);
        float lane = band(uv, y + drift + bend, 0.012 + 0.005 * sin(fi));
        float chunks = step(0.58, noise(vec2(floor(uv.x * 34.0), fi * 9.0 + floor(u_time * 0.9))));
        float lod = smoothstep(0.0, 0.9, pulse(uv.x + fi * 0.13, 0.12 + fi * 0.012, 0.28));
        vec3 pc = palette(fract(fi * 0.17 + lod));
        col += pc * lane * (0.18 + chunks * 0.7 + lod * 0.5);
        col += pc * pow(lane, 8.0) * (1.5 + pressure * 2.0);
      }
      return col;
    }

    vec3 tombstoneCompact(vec2 uv, vec2 pointer) {
      vec3 col = atlasLane(uv, pointer) * 0.35;
      float pressure = u_pressure;
      for (int i = 0; i < 8; i++) {
        float fi = float(i);
        vec2 a = vec2(0.12 + fi * 0.09, 0.22 + 0.08 * sin(fi));
        vec2 b = vec2(0.86 - fi * 0.035, 0.75 - 0.055 * fi);
        float d = sdSegment(uv, a, b);
        float active = pulse(fi * 0.1 + uv.x * 0.18, 0.22, 0.2);
        vec3 c = mix(vec3(1.0, 0.28, 0.18), vec3(0.1, 0.9, 1.0), active);
        col += c * smoothstep(0.018, 0.0, d) * (0.7 + pressure);
        col += vec3(1.0, 0.7, 0.2) * smoothstep(0.045, 0.0, abs(uv.x - (0.23 + 0.48 * fract(u_time * 0.11 + fi * 0.07)))) * smoothstep(0.03, 0.0, d);
      }
      return col;
    }

    vec3 backdropBlurField(vec2 uv, vec2 pointer) {
      vec2 p = uv - pointer;
      float lens = smoothstep(0.42, 0.02, length(p * vec2(1.15, 0.85)));
      float repeats = mix(1.0, 4.0, 0.35 + 0.65 * u_pressure);
      vec2 dir = normalize(vec2(0.0025, 0.0012 + 0.001 * sin(u_time)));
      vec3 base = backdrop(uv);
      vec3 blurred = cheapBlur(uv, dir, repeats);
      vec3 col = mix(base, blurred, lens * 0.92);
      float ring = smoothstep(0.018, 0.0, abs(length(p * vec2(1.15, 0.85)) - 0.42));
      col += vec3(0.2, 0.95, 1.0) * ring;
      col += atlasLane(uv + vec2(sin(uv.y * 18.0 + u_time) * 0.01, 0.0), pointer) * 0.55;
      return col;
    }

    vec3 gradientRebake(vec2 uv, vec2 pointer) {
      vec3 col = backdrop(uv) * 0.45;
      vec2 center = vec2(0.5) + (pointer - 0.5) * 0.24;
      for (int i = 0; i < 48; i++) {
        float fi = float(i);
        float t = fi / 48.0;
        float a = t * PI * 2.0 + u_time * (0.28 + 0.06 * sin(fi));
        float radius = 0.08 + 0.34 * fract(t * 1.618 + 0.12 * sin(u_time + fi));
        vec2 q = center + vec2(cos(a), sin(a)) * radius * vec2(1.45, 0.85);
        float d = length(uv - q);
        float rebake = 0.5 + 0.5 * sin(u_time * 2.0 + fi * 0.7 + u_pressure * 4.0);
        vec3 c = palette(fract(t + rebake * 0.23));
        col += c * smoothstep(0.035, 0.0, d) * (0.35 + rebake);
      }
      float lut = smoothstep(0.0, 0.015, abs(uv.y - 0.86)) * smoothstep(0.9, 0.1, abs(uv.y - 0.86));
      float xbin = floor(uv.x * 42.0) / 42.0;
      col += palette(fract(xbin + u_time * 0.08)) * smoothstep(0.02, 0.0, abs(uv.y - 0.86)) * 1.6;
      return col + lut * 0.02;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 pointer = u_pointer;
      uv.x *= u_resolution.x / u_resolution.y;
      pointer.x *= u_resolution.x / u_resolution.y;

      vec3 col = backdrop(uv);
      float mode = floor(u_mode + 0.5);
      if (mode < 1.5) {
        col += atlasLane(uv, pointer);
      } else if (mode < 2.5) {
        col += tombstoneCompact(uv, pointer);
      } else if (mode < 3.5) {
        col = backdropBlurField(uv, pointer);
      } else {
        col = gradientRebake(uv, pointer);
      }

      vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
      float vignette = smoothstep(1.05, 0.18, length(p));
      col *= vignette;
      col += vec3(0.02, 0.05, 0.06) * sin((uv.y + u_time * 0.15) * 900.0);
      col = pow(col, vec3(0.86));
      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById('stage');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    const state = {
      pointer: [0.52, 0.48],
      pressure: 0,
      targetPressure: 0,
      mode: 1,
      dragging: false,
      start: performance.now()
    };

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function makeProgram() {
      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, document.getElementById('vertex').textContent));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, document.getElementById('fragment').textContent));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      return program;
    }

    const program = makeProgram();
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'position');
    const uniforms = {
      resolution: gl.getUniformLocation(program, 'u_resolution'),
      pointer: gl.getUniformLocation(program, 'u_pointer'),
      time: gl.getUniformLocation(program, 'u_time'),
      pressure: gl.getUniformLocation(program, 'u_pressure'),
      mode: gl.getUniformLocation(program, 'u_mode')
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.floor(canvas.clientWidth * dpr);
      const height = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      state.pointer[0] = (event.clientX - rect.left) / rect.width;
      state.pointer[1] = 1 - (event.clientY - rect.top) / rect.height;
    }

    canvas.addEventListener('pointerdown', (event) => {
      state.dragging = true;
      state.targetPressure = 1;
      canvas.setPointerCapture(event.pointerId);
      setPointer(event);
    });
    canvas.addEventListener('pointermove', setPointer);
    canvas.addEventListener('pointerup', () => {
      state.dragging = false;
      state.targetPressure = 0;
    });
    canvas.addEventListener('pointercancel', () => {
      state.dragging = false;
      state.targetPressure = 0;
    });
    window.addEventListener('keydown', (event) => {
      if (event.key >= '1' && event.key <= '4') state.mode = Number(event.key);
      if (event.code === 'Space') state.targetPressure = 1;
    });
    window.addEventListener('keyup', (event) => {
      if (event.code === 'Space' && !state.dragging) state.targetPressure = 0;
    });

    function render(now) {
      resize();
      state.pressure += (state.targetPressure - state.pressure) * 0.08;
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, state.pointer[0], state.pointer[1]);
      gl.uniform1f(uniforms.time, (now - state.start) / 1000);
      gl.uniform1f(uniforms.pressure, state.pressure);
      gl.uniform1f(uniforms.mode, state.mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
