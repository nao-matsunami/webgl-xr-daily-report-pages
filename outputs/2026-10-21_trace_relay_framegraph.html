<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace Relay Framegraph</title><style>html,body{margin:0;height:100%;background:#080510;overflow:hidden;color:#f6eaff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#ui{position:fixed;left:18px;top:18px;line-height:1.65;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #866;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>TRACE RELAY / FRAMEGRAPH</b><br>pointer: trace source　<kbd>1</kbd> input <kbd>2</kbd> ghosts <kbd>3</kbd> relay <kbd>4</kbd> composite<br>click / space: stamp a transition beat<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s');let W,H,d,mode=4,p={x:.5,y:.5},last=0,beat=0;let trail=[];function rs(){W=innerWidth;H=innerHeight;d=devicePixelRatio;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')beat=1});
function loop(t){let dt=Math.min(.05,(t-last)/1e3||0);last=t;beat=Math.max(0,beat-dt*.2);let q=t/1e3,b=Math.min(W,H),x=p.x*W,y=p.y*H;trail.unshift({x,y,t:q});trail=trail.filter(o=>q-o.t<2.5);g.fillStyle='rgba(7,3,14,.2)';g.fillRect(0,0,W,H);
if(mode!==2){for(let i=0;i<7;i++){let yy=H*.18+i*H*.1;g.strokeStyle=`rgba(${85+i*19},80,180,.2)`;g.beginPath();g.moveTo(0,yy);g.bezierCurveTo(W*.28,yy-b*.12*Math.sin(q+i),W*.72,yy+b*.12*Math.cos(q*.7+i),W,yy);g.stroke()}}
if(mode!==1){for(let i=trail.length-1;i>=0;i--){let o=trail[i],age=q-o.t,a=1-age/2.5;g.strokeStyle=`hsla(${290-age*80},95%,${60+beat*25}%,${a*.55})`;g.lineWidth=1+a*5;g.beginPath();g.arc(o.x+(i%3-1)*age*18,o.y,18+age*50,0,Math.PI*2);g.stroke()}g.fillStyle='rgba(255,240,255,.9)';g.beginPath();g.arc(x,y,4+beat*10,0,7);g.fill()}
if(mode!==1&&mode!==2){for(let i=0;i<4;i++){let yy=H*.18+i*H*.19,w=W*(.17+i*.06),xx=W*.5-w*.5;g.strokeStyle=`rgba(255,174,91,${.2+beat*.45})`;g.strokeRect(xx,yy,w,H*.06);g.fillStyle=`rgba(255,130,80,${beat*.1})`;g.fillRect(xx,yy,w*beat,H*.06)}}
if(mode===4){let r=b*(.08+.24*beat),v=g.createRadialGradient(x,y,0,x,y,r);v.addColorStop(0,'rgba(255,120,180,.25)');v.addColorStop(1,'rgba(255,120,180,0)');g.fillStyle=v;g.fillRect(0,0,W,H)}s.textContent=`mode ${mode} · trace samples ${trail.length} · relay passes 4 · transition beat ${Math.round(beat*100)}%`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
