const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:false}),o=document.querySelector('#readout');if(!g)document.body.innerHTML='WebGL が必要です';const V=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`,F=`precision highp float;uniform vec2 r,m;uniform float t,burst,mode;float h(vec2 p){return fract(sin(dot(p,vec2(12.99,78.23)))*4358.2);}float dotp(vec2 p,vec2 q,float s){return exp(-dot(p-q,p-q)*s);}void main(){vec2 u=(gl_FragCoord.xy-.5*r)/r.y,q=m-.5*r/r.y;float trail=0.,core=0.;for(int i=0;i<24;i++){float z=float(i)/23.;vec2 p=q+vec2(sin(t*1.8+z*8.),cos(t*1.25+z*7.))*z*.23+vec2(-z*.48,0.);float a=dotp(u,p,420.-z*250.);core+=a*(1.-z);trail+=a*z;}float stripes=smoothstep(.035,0.,abs(fract((u.x-u.y*.3)*14.-t*.45)-.5));float upload=exp(-length(u-q)*12.)*burst;vec3 src=vec3(1.,.22,.08)*core;vec3 motion=vec3(.3,.15,1.)*trail+vec3(.03,.1,.3)*stripes;vec3 glow=vec3(1.,.64,.12)*(trail*.5+upload);vec3 col=src+motion+glow;if(mode<.25)col=src+vec3(.01);else if(mode<.75)col=motion+src*.28+vec3(.01);float vig=1.-smoothstep(.35,1.12,length(u));gl_FragColor=vec4(col*vig,1.);}`;function S(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw g.getShaderInfoLog(x);return x}let P=g.createProgram();g.attachShader(P,S(g.VERTEX_SHADER,V));g.attachShader(P,S(g.FRAGMENT_SHADER,F));g.linkProgram(P);g.useProgram(P);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U=Object.fromEntries(['r','m','t','burst','mode'].map(x=>[x,g.getUniformLocation(P,x)])),x=.5,y=.5,k=0,mo=2;function rz(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}addEventListener('resize',rz);rz();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=1-e.clientY/innerHeight});func
