<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pipeline Echo Weave</title>
<style>html,body{margin:0;overflow:hidden;background:#070816;color:#e7eeff;font:12px ui-monospace,monospace}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:18px;top:16px;line-height:1.6;pointer-events:none}h1{font:600 16px system-ui;margin:0 0 4px;letter-spacing:.06em}b{color:#ffc37d}#state{position:fixed;right:18px;bottom:15px;text-align:right;color:#c5cce2}</style>
<canvas></canvas><div id="ui"><h1>PIPELINE ECHO / WEAVE</h1><b>pointer</b> = route a signal &nbsp; <b>click</b> = add a warm-up pulse<br>Repeated work leaves a visible, reusable trail.</div><div id="state">0 WARM-UP PULSES</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),pulses=[],trail=[];let m={x:.5,y:.5};function fit(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();function point(e){m={x:e.clientX/innerWidth,y:e.clientY/innerHeight};trail.push({...m,t:performance.now()});if(trail.length>80)trail.shift()}addEventListener('pointermove',point);addEventListener('click',e=>{point(e);pulses.push({...m,t:performance.now()});if(pulses.length>12)pulses.shift();document.querySelector('#state').textContent=pulses.length+' WARM-UP PULSES'});function loop(now){requestAnimationFrame(loop);x.fillStyle='rgba(7,8,22,.18)';x.fillRect(0,0,innerWidth,innerHeight);let lanes=6;x.lineWidth=1;for(let i=0;i<lanes;i++){let y=(i+1)/(lanes+1)*innerHeight;x.strokeStyle='rgba(85,115,205,.20)';x.beginPath();for(let q=0;q<=innerWidth;q+=10){let yy=y+Math.sin(q*.011+now*.0012+i)*12;x.lineTo(q,yy)}x.stroke()}for(const a of trail){let age=(now-a.t)/1000;if(age>2)continue;x.fillStyle=`hsla(${190+age*80},90%,72%,${(1-age/2)*.38})`;x.beginPath();x.arc(a.x*innerWidth,a.y*innerHeight,2+age*8,0,7);x.fill()}for(const p of pulses){let age=(now-p.t)/1000;if(age>7)continue;let R=25+age*110;x.strokeStyle=`hsla(${35+age*30},100%,70%,${.7-age/10})`;x.lineWidth=2;x.beginPath();x.arc(p.x*innerWidth,p.y*innerHeight,R,0,7);x.stroke()}x.fillStyle='#fff1cf';x.beginPath();x.arc(m.x*innerWidth,m.y*innerHeight,5,0,7);x.fill()}requestAnimationFrame(loop);
</script></html>
