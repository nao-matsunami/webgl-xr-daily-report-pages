<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightmap Sketch Weave</title><style>html,body{margin:0;height:100%;background:#100b17;color:#ffe8cf;font:13px ui-monospace,monospace;overflow:hidden}canvas{width:100%;height:100%;display:block}#x{position:fixed;left:16px;top:16px;pointer-events:none;line-height:1.55}b{color:#ffb570}</style><canvas id="c"></canvas><div id="x"><b>LIGHTMAP SKETCH WEAVE</b><br>pointer = bake focus · click / Space = new light pass<br><span></span></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),label=document.querySelector('span');let m=[.5,.5],burst=0;onpointermove=e=>m=[e.clientX/innerWidth,e.clientY/innerHeight];onpointerdown=()=>burst=1;onkeydown=e=>{if(e.code==='Space')burst=1};function f(ms){let w=c.width=innerWidth*devicePixelRatio,h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;x.fillStyle='#100b17';x.fillRect(0,0,w,h);let q=40,px=m[0]*w,py=m[1]*h;for(let y=0;y<h;y+=q)for(let z=0;z<w;z+=q){let d=Math.hypot(z-px,y-py),a=Math.max(0,1-d/(Math.min(w,h)*.72)),ph=ms*.001+d*.018; x.strokeStyle=`hsla(${24+100*a},90%,${30+48*a}%,${.18+.62*a})`;x.lineWidth=1+a*3;x.beginPath();x.moveTo(z,y+Math.sin(ph)*q*.33);x.quadraticCurveTo(z+q*.5,y+Math.cos(ph*1.3)*q*(.1+a*.5),z+q,y+Math.sin(ph+.9)*q*.33);x.stroke()}for(let i=0;i<160;i++){let a=i*2.399+ms*.0002,r=(i%16)*18+burst*80,xx=px+Math.cos(a)*r,yy=py+Math.sin(a)*r;x.fillStyle=`hsla(${30+i%50},100%,70%,${.2+(i%4)*.12})`;x.fillRect(xx,yy,2+(i%3),2+(i%3))}burst*=.94;label.textContent=`bake focus ${Math.round(m[0]*100)}, ${Math.round(m[1]*100)} · progressive pass ${Math.round(ms/800)%12+1}`;requestAnimationFrame(f)}requestAnimationFrame(f);
</script></html>
