<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Inspector Resonance</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#08050d;color:#ffe9ff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#t{position:fixed;top:18px;left:18px;line-height:1.6}b{color:#ffb6ed}span{color:#98e9ff}</style><canvas id="c"></canvas><div id="t"><b>AUDIO INSPECTOR / RESONANCE</b><br>move: choose band · click / Space: capture an onset<br><span>1 spectrum · 2 onset trace · 3 frozen capture · 4 composite</span></div>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d');let w,h,p=.5,mode=4,hit=-3,capt=[];function rs(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}rs();addEventListener('resize',rs);addEventListener('pointermove',e=>p=e.clientX/innerWidth);function pulse(){hit=performance.now()/1000;capt.push(p);if(capt.length>7)capt.shift()}addEventListener('pointerdown',pulse);addEventListener('keydown',e=>{if(e.code==='Space')pulse();if(+e.key>0&&+e.key<5)mode=+e.key});
function f(ms){let t=ms/1000,a=t-hit;g.fillStyle='#08050d';g.fillRect(0,0,innerWidth,innerHeight);let base=innerHeight*.72;
 if(mode!==2&&mode!==3){for(let i=0;i<88;i++){let u=i/87,focus=Math.exp(-Math.pow((u-p)*9,2)),amp=.1+.72*focus+.16*Math.sin(t*3+i*.7)**2;let hh=amp*(42+Math.sin(t*2+i)*23);g.fillStyle=`hsla(${280+u*90},90%,70%,.7)`;g.fillRect(u*innerWidth,base-hh,innerWidth/88-2,hh)}}
 if(mode!==1&&mode!==3&&a>=0&&a<1.4){let q=1-a/1.4;g.strokeStyle=`rgba(109,237,255,${q})`;g.lineWidth=2;g.beginPath();for(let i=0;i<90;i++){let xx=i/89*innerWidth,yy=base-100*Math.exp(-Math.pow((i/89-p)*14,2))*Math.sin(i*.52-a*18)*q; i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke()}
 if(mode!==1&&mode!==2){capt.forEach((v,j)=>{let yy=innerHeight*.18+j*22;g.strokeStyle=`rgba(255,180,237,${.25+j*.06})`;g.beginPath();g.moveTo(0,yy);g.lineTo(v*innerWidth,yy);g.lineTo(v*innerWidth+20,yy-10);g.stroke()})}
 g.fillStyle='rgba(255,245,255,.72)';g.fillText(a>=0&&a<.3?'audio onset captured → visual tail is retained':'Inspector Lite metaphor: band / onset / retained capture',18,innerHeight-26);requestAnimationFrame(f)}requestAnimationFrame(f);
</script></html>
