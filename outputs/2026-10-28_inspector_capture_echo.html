<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspector Capture Echo</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#100b17;color:#fff0fb;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:550px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#f3a8ff}.title{margin:7px 0;font-size:clamp(23px,3.8vw,45px);line-height:1.02}.meta{color:#e5c4eb}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #74447a;border-radius:999px;color:#ffe0ff}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#ebceef}</style>
<canvas></canvas><div class="hud"><div class="ey">INSPECTOR LITE CAPTURE × RENDER ECHO — 28 OCT 2026</div><div class="title">A performance trace<br>becomes an afterimage.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: inspect location</span><span class="tag">click / space: capture frame</span><span class="tag">1–4: isolate stages</span></div></div><div class="keys">1 measure &nbsp; 2 capture &nbsp; 3 echo &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,flash=0,last=0,frames=[];function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();function capture(){flash=1;frames.push([x,y,1,performance.now()]);frames=frames.slice(-18)}addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',capture);addEventListener('keydown',e=>{if(e.key===' ')capture();if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1e3||0);last=t;flash*=Math.exp(-dt*1.35);let w=innerWidth,h=innerHeight,T=t/1000,px=w*x,py=h*y,show=n=>mode===4||mode===n;g.fillStyle='#100b17';g.fillRect(0,0,w,h);if(show(1)){for(let i=0;i<36;i++){let q=i/35,yy=h*(.2+q*.62),ms=11+Math.sin(T*2+q*12)*5+Math.max(0,1-Math.abs(q-y)*5)*16;g.strokeStyle=`hsla(${285+q*42},90%,70%,.25)`;g.lineWidth=1;g.beginPath();g.moveTo(w*.13,yy);g.lineTo(w*.13+ms*w*.028,yy);g.stroke()}}if(show(2)){g.strokeStyle='rgba(255,221,255,.8)';g.setLineDash([5,5]);g.strokeRect(px-55,py-34,110,68);g.setLineDash([]);g.fillStyle='rgba(255,225,255,.85)';g.fillText('FRAME '+String(frames.length).padStart(2,'0'),px-40,py+5)}if(show(3)){for(let i=0;i<frames.length;i++){let f=frames[i],age=Math.min(1,(t-f[3])/2800),fx=w*f[0],fy=h*f[1];g.strokeStyle=`hsla(${300+i*11},92%,70%,${(1-age)*.4})`;g.lineWidth=1+(1-age)*5;g.beginPath();g.ellipse(fx,fy,28+age*150,14+age*70,age*3,0,7);g.stroke()}}if(show(4)){let z=g.createRadialGradient(px,py,2,px,py,260);z.addColorStop(0,`rgba(255,207,245,${.16+flash*.28})`);z.addColorStop(.45,'rgba(198,79,255,.10)');z.addColorStop(1,'rgba(16,11,23,0)');g.fillStyle=z;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`capture frames ${frames.length} · selected pass ${mode===4?'composite':mode} · estimated frame ${Math.round(12+Math.abs(y-.5)*18)}ms · flash ${Math.round(flash*100)}%`};requestAnimationFrame(loop);
</script></html>
