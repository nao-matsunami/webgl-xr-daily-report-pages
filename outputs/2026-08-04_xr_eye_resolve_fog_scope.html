<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XR Eye Resolve Fog Scope - 2026-08-04</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03070b;
      color: #e8fbff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      inset: 16px 16px auto 16px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(230, 250, 255, 0.75);
      text-shadow: 0 0 16px rgba(77, 216, 255, 0.42);
    }
    .hud strong {
      display: block;
      color: #ffe49a;
      font-size: 12px;
      font-weight: 700;
    }
    .hud span {
      max-width: 430px;
    }
    @media (max-width: 720px) {
      .hud {
        inset: 12px;
        flex-direction: column;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <span><strong>XR Eye Resolve Fog Scope</strong>Pointer = stereo resolve lens / Hold or Space = fallback pressure</span>
    <span>1 stereo / 2 resolve / 3 fog / 4 padding / Drag to bias eye disparity</span>
  </div>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false });
    if (!gl) {
      document.body.textContent = "WebGL is not available.";
      throw new Error("WebGL unavailable");
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;
      uniform vec2 resolution;
      uniform vec2 pointer;
      uniform vec2 velocity;
      uniform float time;
      uniform float pressure;
      uniform float mode;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += noise(p) * a;
          p = mat2(1.55, -1.12, 1.12, 1.55) * p + vec2(4.7, 2.1);
          a *= 0.52;
        }
        return v;
      }

      float ring(vec2 p, float r, float w) {
        return 1.0 - smoothstep(0.0, w, abs(length(p) - r));
      }

      float ray(vec2 p, float a, float w) {
        vec2 d = vec2(cos(a), sin(a));
        float line = abs(dot(p, vec2(-d.y, d.x)));
        float along = dot(p, d);
        return smoothstep(w, 0.0, line) * smoothstep(-0.05, 0.72, along);
      }

      float splat(vec2 p, vec2 c, vec2 scale, float rot) {
        float co = cos(rot);
        float si = sin(rot);
        mat2 m = mat2(co, -si, si, co);
        vec2 q = m * (p - c);
        return exp(-dot(q / scale, q / scale));
      }

      vec3 ramp(float x) {
        vec3 ink = vec3(0.015, 0.026, 0.038);
        vec3 cyan = vec3(0.08, 0.86, 1.0);
        vec3 violet = vec3(0.72, 0.38, 1.0);
        vec3 amber = vec3(1.0, 0.73, 0.28);
        return mix(mix(ink, cyan, smoothstep(0.03, 0.55, x)), mix(violet, amber, x), smoothstep(0.42, 1.2, x));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        vec2 m = (pointer * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
        vec2 drag = velocity * vec2(14.0, 10.0);
        vec2 eyeAxis = normalize(vec2(1.0, 0.18) + drag);
        vec2 eyeOffset = eyeAxis * (0.030 + 0.030 * pressure);
        float field = fbm(uv * 2.1 + vec2(time * 0.08, -time * 0.04));

        float leftEye = 0.0;
        float rightEye = 0.0;
        float resolveError = 0.0;
        float fogCoverage = 0.0;
        float paddingResidue = 0.0;

        for (int i = 0; i < 52; i++) {
          float fi = float(i);
          vec2 seed = vec2(hash(vec2(fi, 9.0)), hash(vec2(3.0, fi)));
          vec2 c = (seed * 2.0 - 1.0) * vec2(1.65, 0.82);
          c += 0.055 * vec2(sin(time * 0.22 + fi * 1.7), cos(time * 0.18 + fi * 1.3));
          float depth = hash(seed * 13.0 + 1.7);
          float angle = fi * 0.47 + time * 0.035;
          vec2 scale = vec2(0.024 + depth * 0.050, 0.010 + depth * 0.026);
          float l = splat(uv + eyeOffset * (0.5 + depth), c, scale, angle);
          float r = splat(uv - eyeOffset * (0.6 - depth * 0.25), c, scale, angle + 0.08);
          leftEye += l * (0.55 + depth);
          rightEye += r * (0.55 + depth);
          resolveError += abs(l - r) * (0.55 + 0.75 * depth);
          fogCoverage += max(l, r) * smoothstep(-0.80, 0.62, c.y + field * 0.32);
          paddingResidue += max(l, r) * step(0.91, hash(seed * 41.0 + floor(time * 0.9))) * (0.7 + pressure);
        }

        float stereo = abs(leftEye - rightEye);
        float resolved = 0.5 * (leftEye + rightEye);
        vec2 lensP = uv - m;
        float lens = smoothstep(0.66, 0.08, length(lensP));
        float lensRing = ring(lensP, 0.24 + pressure * 0.16, 0.018);
        float wake = exp(-abs(dot(lensP, vec2(-eyeAxis.y, eyeAxis.x))) * 9.0) * smoothstep(0.72, -0.10, dot(lensP, -eyeAxis));
        float horizon = smoothstep(-0.92, 0.70, uv.y + 0.12 * sin(uv.x * 5.0 + field * 4.0 + time));
        float fog = fogCoverage * horizon;

        float stereoOn = mode < 1.5 ? 1.0 : 0.28;
        float resolveOn = abs(mode - 2.0) < 0.5 ? 1.0 : 0.28;
        float fogOn = abs(mode - 3.0) < 0.5 ? 1.0 : 0.28;
        float paddingOn = mode > 3.5 ? 1.0 : 0.28;

        vec3 col = vec3(0.010, 0.018, 0.028);
        col += ramp(resolved) * resolved * (0.40 + stereoOn * 0.48);
        col += vec3(0.10, 0.92, 1.0) * stereo * (0.25 + stereoOn) * (0.75 + lens * 0.45);
        col += vec3(1.0, 0.50, 0.22) * pow(resolveError, 1.22) * (0.16 + resolveOn * 0.86);
        col += vec3(0.68, 0.80, 1.0) * fog * (0.14 + fogOn * 0.58);
        col += vec3(1.0, 0.30, 0.74) * paddingResidue * (0.18 + paddingOn);

        col += vec3(0.30, 0.92, 1.0) * ray(uv - vec2(-0.72, -0.25), 0.42 + 0.12 * sin(time), 0.014) * stereoOn;
        col += vec3(1.0, 0.62, 0.24) * ray(uv - vec2(-0.18, -0.34), 1.15, 0.012) * resolveOn;
        col += vec3(0.75, 0.86, 1.0) * ring(uv - vec2(0.34, -0.18), 0.28 + 0.02 * sin(time * 1.8), 0.014) * fogOn;
        col += vec3(1.0, 0.35, 0.92) * smoothstep(0.985, 1.0, noise(uv * 42.0 + time * 1.8)) * paddingOn;
        col += vec3(1.0, 0.80, 0.32) * lensRing * (0.72 + pressure);
        col += vec3(0.18, 0.80, 1.0) * lens * 0.16;
        col += vec3(0.62, 0.94, 1.0) * wake * (0.18 + pressure * 0.46);

        float grid = smoothstep(0.988, 1.0, sin((uv.x + time * 0.03) * 48.0) * sin((uv.y - time * 0.02) * 30.0));
        float vignette = smoothstep(1.72, 0.18, length(uv));
        float grain = noise(gl_FragCoord.xy * 0.72 + time * 22.0);
        col += vec3(0.05, 0.22, 0.30) * grid * (0.20 + pressure * 0.45);
        col *= vignette;
        col += grain * 0.022;
        col = col / (1.0 + col);
        col = pow(col, vec3(0.82));
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      velocity: gl.getUniformLocation(program, "velocity"),
      time: gl.getUniformLocation(program, "time"),
      pressure: gl.getUniformLocation(program, "pressure"),
      mode: gl.getUniformLocation(program, "mode")
    };

    let pointer = [innerWidth * 0.54, innerHeight * 0.50];
    let lastPointer = pointer.slice();
    let velocity = [0.18, -0.08];
    let targetPressure = 0;
    let pressure = 0;
    let mode = 1;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(innerWidth * dpr));
      canvas.height = Math.max(1, Math.floor(innerHeight * dpr));
      gl.viewport(0, 0, canvas.width, canvas.height);
      pointer[0] = Math.min(pointer[0], canvas.width);
      pointer[1] = Math.min(pointer[1], canvas.height);
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const dpr = canvas.width / rect.width;
      lastPointer = pointer.slice();
      pointer = [
        (event.clientX - rect.left) * dpr,
        canvas.height - (event.clientY - rect.top) * dpr
      ];
      velocity = [
        (pointer[0] - lastPointer[0]) / Math.max(canvas.width, 1),
        (pointer[1] - lastPointer[1]) / Math.max(canvas.height, 1)
      ];
    }

    addEventListener("resize", resize);
    addEventListener("pointermove", setPointer);
    addEventListener("pointerdown", (event) => {
      setPointer(event);
      targetPressure = 1;
    });
    addEventListener("pointerup", () => {
      targetPressure = 0;
    });
    addEventListener("keydown", (event) => {
      if (event.code === "Space") targetPressure = 1;
      if (event.key >= "1" && event.key <= "4") mode = Number(event.key);
    });
    addEventListener("keyup", (event) => {
      if (event.code === "Space") targetPressure = 0;
    });

    resize();

    function frame(now) {
      pressure += (targetPressure - pressure) * 0.08;
      velocity[0] *= 0.94;
      velocity[1] *= 0.94;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer[0], pointer[1]);
      gl.uniform2f(uniforms.velocity, velocity[0], velocity[1]);
      gl.uniform1f(uniforms.time, now * 0.001);
      gl.uniform1f(uniforms.pressure, pressure);
      gl.uniform1f(uniforms.mode, mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
