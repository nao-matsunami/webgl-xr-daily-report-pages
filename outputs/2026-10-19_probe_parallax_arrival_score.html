<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probe Parallax Arrival Score</title><style>html,body{margin:0;height:100%;background:#030712;overflow:hidden;color:#dff7ff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:18px;left:18px;line-height:1.6;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #668;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>PROBE PARALLAX / ARRIVAL SCORE</b><br>pointer: viewing position　<kbd>1</kbd> cube <kbd>2</kbd> probe <kbd>3</kbd> arrival <kbd>4</kbd> composite<br>click / space: dispatch a compressed environment packet<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p={x:.5,y:.5},mode=4,burst=0,last=0;function resize(){W=innerWidth;H=innerHeight;let d=devicePixelRatio;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>burst=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')burst=1});
function line(a,b,col,w=1){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;burst=Math.max(0,burst-dt*.22);let q=t/1000,b=Math.min(W,H),cx=p.x*W,cy=p.y*H,ox=W*.5,oy=H*.56,par=(p.x-.5)*b*.18,packet=.15+.85*burst;g.fillStyle='rgba(2,5,14,.19)';g.fillRect(0,0,W,H);
if(mode!==2){let sz=b*.23;g.save();g.translate(ox,oy);g.rotate(q*.14);g.strokeStyle='rgba(120,225,255,.45)';g.lineWidth=1.4;for(let i=0;i<4;i++){let z=(i-1.5)*sz*.32;g.strokeRect(-sz/2+z,-sz/2+z,sz,sz)}for(let i=0;i<4;i++)line([-sz/2+(i-1.5)*sz*.32,-sz/2+(i-1.5)*sz*.32],[sz/2+(i-1.5)*sz*.32,sz/2+(i-1.5)*sz*.32],'rgba(120,225,255,.35)');g.restore()}
if(mode!==1){for(let i=0;i<11;i++){let r=b*(.05+i*.042)+packet*b*.08;g.strokeStyle=`hsla(${184+i*8},95%,70%,${.04+(i%3)*.035+packet*.1})`;g.beginPath();g.ellipse(ox+par*(i/10),oy,r,r*.38,0,0,7);g.stroke()}}
if(mode!==1&&mode!==2){for(let i=0;i<42;i++){let a=i*2.4+q*.35,rr=b*(.13+(i%7)*.03)+burst*b*.2*(i/42);let x=ox+Math.cos(a)*rr+par,y=oy+Math.sin(a)*rr*.42;g.fillStyle=`hsla(${190+i*4},95%,${55+packet*28}%,${.18+packet*.55})`;g.beginPath();g.arc(x,y,1+(i%4)*.7+packet*2,0,7);g.fill()}line([cx,cy],[ox+par,oy],`rgba(255,209,130,${.15+packet*.7})`,1.5)}
if(mode===4){let v=g.createRadialGradient(cx,cy,0,cx,cy,b*.28);v.addColorStop(0,'rgba(255,184,109,.35)');v.addColorStop(1,'rgba(255,184,109,0)');g.fillStyle=v;g.fillRect(0,0,W,H)}document.querySelector('#s').textContent=`mode ${mode} · local probe shift ${Math.round(Math.abs(par))}px · cube mip ${Math.round(2+packet*7)} · packet arrival ${Math.round(packet*100)}%`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
