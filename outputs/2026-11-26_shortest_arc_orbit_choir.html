<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortest Arc Orbit Choir — 2026-11-26</title>
<style>html,body{margin:0;height:100%;background:#080b16;color:#e5e8ff;font:13px/1.5 ui-monospace,monospace;overflow:hidden}canvas{display:block;width:100%;height:100%}aside{position:fixed;left:18px;top:16px;pointer-events:none}b{letter-spacing:.08em;color:#b8c8ff}.note{position:fixed;right:18px;bottom:16px;text-align:right;color:#abb3d1}</style><canvas id="c"></canvas><aside><b>SHORTEST-ARC ORBIT CHOIR</b><br>pointer で目標角度　click で新しい軌道を追加<br>長い回り道をせず、全て最短の弧で追従する</aside><div class="note">angle wrap / orbit interpolation<br>PlayCanvas math.lerpAngle study</div>
<script>const c=document.querySelector('#c'),x=c.getContext('2d');let target=0,last=0,orbits=[0,1.4,2.8,4.2,5.6],trails=[];function rs(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>target=Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2));addEventListener('pointerdown',()=>{orbits.push(target+Math.PI);if(orbits.length>11)orbits.shift()});function wrap(d){return ((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI}function loop(ms){let dt=Math.min(.05,(ms-last)/1000||.016);last=ms;let w=innerWidth,h=innerHeight,cx=w/2,cy=h/2;x.fillStyle='rgba(8,11,22,.22)';x.fillRect(0,0,w,h);x.strokeStyle='#28335f';x.lineWidth=1;for(let r=62;r<Math.min(w,h)*.48;r+=48){x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}orbits=orbits.map((a,i)=>a+wrap(target-a)*(0.025+i*.007));trails.push(orbits.map((a,i)=>[cx+Math.cos(a)*(70+i*26),cy+Math.sin(a)*(70+i*26)]));if(trails.length>28)trails.shift();trails.forEach((s,k)=>s.forEach((p,i)=>{x.fillStyle=`hsla(${205+i*19},90%,72%,${k/42})`;x.beginPath();x.arc(p[0],p[1],1.5+k/20,0,7);x.fill()}));orbits.forEach((a,i)=>{let r=70+i*26,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.strokeStyle=`hsla(${205+i*19},90%,70%,.58)`;x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke();x.fillStyle=`hsl(${205+i*19},95%,72%)`;x.beginPath();x.arc(px,py,5+i*.25,0,7);x.fill()});x.strokeStyle='#ffbd80';x.lineWidth=2;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(target)*Math.min(w,h)*.47,cy+Math.sin(target)*Math.min(w,h)*.47);x.stroke();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></html>
