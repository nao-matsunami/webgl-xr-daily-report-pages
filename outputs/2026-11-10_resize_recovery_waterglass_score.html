<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resize Recovery Waterglass Score</title>
<style>html,body{margin:0;height:100%;background:#061019;color:#dbeeff;font:12px/1.4 ui-monospace,monospace;overflow:hidden}canvas{width:100%;height:100%;display:block}#ui{position:fixed;left:16px;top:14px;max-width:360px;text-shadow:0 1px 8px #000}b{color:#8cf5ff}kbd{border:1px solid #65809a;border-radius:3px;padding:1px 4px}</style>
<canvas></canvas><div id="ui"><b>RESIZE / RECOVERY / WATERGLASS</b><br>pointer: resize lens　click / Space: rebuild pulse<br><kbd>1</kbd> old target　<kbd>2</kbd> destroy/rebuild　<kbd>3</kbd> waterglass relay　<kbd>4</kbd> composite</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let p={x:.5,y:.5},mode=4,pulse=0,t0=performance.now();
addEventListener('pointermove',e=>p={x:e.clientX/innerWidth,y:e.clientY/innerHeight});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')mode=+e.key;if(e.code==='Space')pulse=1});
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();
function dot(X,Y,r,col,a=1){x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.arc(X,Y,r,0,7);x.fill()}function frame(now){let w=innerWidth,h=innerHeight,t=(now-t0)/1000;pulse*=.972;x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#061a2d');g.addColorStop(1,'#130924');x.fillStyle=g;x.fillRect(0,0,w,h);
let horizon=h*(.40+p.y*.18),rx=w*(.16+p.x*.22),ry=h*.12; x.strokeStyle='#355879';x.globalAlpha=.55;x.lineWidth=1;for(let i=0;i<18;i++){let yy=horizon+(i*i)*h/360+Math.sin(t*2+i)*6;x.beginPath();x.moveTo(0,yy);for(let q=0;q<=w;q+=18)x.lineTo(q,yy+Math.sin(q*.018+i+t*2)*7);x.stroke()}
if(mode===1||mode===4){x.globalAlpha=.5;x.strokeStyle='#ff5d85';for(let i=0;i<8;i++){x.strokeRect(w*.16+i*6,h*.14+i*5,w*.43,h*.28)}x.globalAlpha=1;x.fillStyle='#ff5d85';x.fillText('stale target / old extent',w*.17,h*.12)}
if(mode===2||mode===4){x.globalAlpha=.9;x.strokeStyle='#8cf5ff';x.setLineDash([5,7]);x.strokeRect(w*.16,h*.14,rx*2,ry*2);x.setLineDash([]);for(let i=0;i<22;i++){let a=i/22*7+t;dot(w*.16+rx+Math.cos(a)*(rx+14+pulse*45),h*.14+ry+Math.sin(a)*(ry+8+pulse*25),2+(i%3),'#8cf5ff',.45)}x.fillStyle='#8cf5ff';x.fillText('resize → discard → allocate',w*.17,h*.47)}
if(mode===3||mode===4){let cx=w*.69,cy=h*.53;x.globalAlpha=.75;x.fillStyle='#c18cff';x.beginPath();x.ellipse(cx,cy,w*.18,h*.23,0,0,7);x.fill();x.globalCompositeOperation='screen';for(let i=0;i<100;i++){let a=i*2.4+t*.9,r=18+(i%16)*9;dot(cx+Math.cos(a)*r,cy+Math.sin(a*1.7)*r*.45,1+(i%4),'#f6e7ff',.22)}x.globalCompositeOperation='source-over';x.fillStyle='#e8d3ff';x.fillText('new surface catches a moving reflection',cx-w*.16,cy+h*.29)}
x.globalAlpha=1;x.fillStyle='#dbeeff';x.fillText('frame '+Math.floor(t*60)+'  • target generation '+(pulse>.03?'rebuilding':'stable')+'  • lens '+Math.round(p.x*100)+'%',16,h-18);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
