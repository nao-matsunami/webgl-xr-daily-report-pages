<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Word Release Field</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#03050a;color:#eefaff;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:610px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#88f6b7}.title{margin:7px 0;font-size:clamp(23px,3.8vw,45px);line-height:1.02}.meta{color:#c5d8e2}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #36755b;border-radius:999px;color:#cbffe2}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#c3d7e1}</style>
<canvas></canvas><div class="hud"><div class="ey">TEXT MASK × PARTICLE RELEASE × COARSE-TO-FINE — 01 NOV 2026</div><div class="title">Hold a word together.<br>Release it as weather.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: gravity well</span><span class="tag">click / space: release / reform</span><span class="tag">1–4: mask / coarse / fine / composite</span></div></div><div class="keys">1 text mask &nbsp; 2 coarse cloud &nbsp; 3 fine filaments &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let mx=.5,my=.5,mode=4,held=true,last=0,age=0;const pts=Array.from({length:900},(_,i)=>({a:i/899*Math.PI*2,r:18+Math.random()*220,j:Math.random()*6,s:.3+Math.random()*1.8}));
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});function flip(){held=!held;age=0}addEventListener('pointerdown',flip);addEventListener('keydown',e=>{if(e.key===' ')flip();if(+e.key>0&&+e.key<5)mode=+e.key});
function dot(px,py,r,col){x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill()}function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1000||0);last=t;age+=dt;let w=innerWidth,h=innerHeight,cx=w*.5,cy=h*.52,gx=mx*w,gy=my*h;x.fillStyle='rgba(3,5,10,.16)';x.fillRect(0,0,w,h);x.globalCompositeOperation='lighter';x.textAlign='center';x.font=`900 ${Math.min(w*.19,190)}px system-ui`;let mask=held?1:Math.exp(-age*.45);if(mode===1||mode===4){x.fillStyle=`rgba(104,255,188,${.025+mask*.10})`;x.fillText('FIELD',cx,cy+55)}for(let i=0;i<pts.length;i++){let p=pts[i],phase=p.a+t*.00025*p.s;let tx=cx+Math.cos(phase*3)*w*.20+Math.sin(phase*7)*w*.025,ty=cy+Math.sin(phase*4)*h*.16;let release=1-mask;let px=tx*(1-release)+ (cx+Math.cos(phase)*p.r*1.9+Math.sin(t*.0005+p.j)*70)*release;let py=ty*(1-release)+ (cy+Math.sin(phase)*p.r*.62+Math.cos(t*.00043+p.j)*45)*release;let dx=gx-px,dy=gy-py,d=Math.hypot(dx,dy)+50;px+=dx/d*(held?8:24);py+=dy/d*(held?8:24);let coarse=i%5===0;if((mode===2&&!coarse)||(mode===3&&coarse)||mode===1)continue;let alpha=coarse?.20:.065;dot(px,py,coarse?1.8:.7,coarse?`rgba(91,255,174,${alpha})`:`rgba(127,204,255,${alpha})`)}x.globalCompositeOperation='source-over';x.strokeStyle='rgba(170,255,220,.25)';x.beginPath();x.arc(gx,gy,18+Math.sin(t*.004)*4,0,7);x.stroke();document.querySelector('#meta').textContent=`state ${held?'forming':'released'} · cohesion ${Math.round(mask*100)}% · coarse particles 180 · fine particles 720 · release ${age.toFixed(1)}s`}
requestAnimationFrame(loop);
</script></html>
