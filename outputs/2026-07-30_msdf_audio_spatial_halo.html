<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSDF Audio Spatial Halo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      color: #d7f7ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      inset: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(218, 246, 255, .72);
      text-shadow: 0 0 18px rgba(94, 220, 255, .45);
    }

    .hud strong {
      display: block;
      margin-bottom: 6px;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: .12em;
    }

    .right {
      text-align: right;
      color: rgba(255, 214, 155, .72);
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <div>
      <strong>MSDF Audio Spatial Halo</strong>
      pointer lens / hold or space: pressure / A: audio vectors
    </div>
    <div class="right">
      playcanvas msdf edge<br>
      babylon spatial mediastream<br>
      relight coverage alpha
    </div>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const gl = canvas.getContext("webgl", { antialias: false, alpha: false });

    if (!gl) {
      document.body.innerHTML = "WebGL is not available.";
      throw new Error("WebGL unavailable");
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;

      uniform vec2 resolution;
      uniform vec2 pointer;
      uniform float time;
      uniform float pressure;
      uniform float audioMode;

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 345.45));
        p += dot(p, p + 34.345);
        return fract(p.x * p.y);
      }

      float sdBox(vec2 p, vec2 b) {
        vec2 q = abs(p) - b;
        return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
      }

      float sdCircle(vec2 p, float r) {
        return length(p) - r;
      }

      float msdfA(vec2 p) {
        float left = sdBox(p + vec2(.18, -.02), vec2(.045, .42));
        float right = sdBox(p - vec2(.18, .02), vec2(.045, .42));
        float cross = sdBox(p, vec2(.23, .045));
        float cut = -sdCircle(p - vec2(0.0, .02), .135);
        return min(min(left, right), max(cross, cut));
      }

      float msdfO(vec2 p) {
        return max(sdCircle(p, .33), -sdCircle(p, .19));
      }

      float msdfX(vec2 p) {
        float a = sdBox(mat2(.707, -.707, .707, .707) * p, vec2(.055, .42));
        float b = sdBox(mat2(.707, .707, -.707, .707) * p, vec2(.055, .42));
        return min(a, b);
      }

      float glyphField(vec2 p) {
        float d1 = msdfA(p + vec2(.72, 0.0));
        float d2 = msdfO(p);
        float d3 = msdfX(p - vec2(.72, 0.0));
        return min(min(d1, d2), d3);
      }

      float splat(vec2 p, vec2 c, float r) {
        vec2 q = p - c;
        float g = exp(-dot(q, q) / max(.0001, r));
        return g;
      }

      vec3 palette(float x) {
        vec3 a = vec3(.05, .08, .12);
        vec3 b = vec3(.03, .75, .95);
        vec3 c = vec3(.94, .22, .76);
        vec3 d = vec3(1.0, .72, .30);
        return mix(mix(a, b, smoothstep(.0, .55, x)), mix(c, d, x), smoothstep(.45, 1.0, x));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
        vec2 mouse = (pointer * 2.0 - resolution) / min(resolution.x, resolution.y);
        mouse.y *= -1.0;

        float beat = .5 + .5 * sin(time * 2.8);
        beat = pow(beat, 5.0);
        float audio = mix(.32, 1.0, audioMode) * (.35 + beat * .65 + pressure * .35);
        float lens = smoothstep(.72, .0, length(uv - mouse));

        vec2 warp = uv;
        float fisheye = .12 + .08 * sin(time * .7) + .14 * pressure;
        warp *= 1.0 + fisheye * dot(warp, warp);

        float field = 0.0;
        for (int i = 0; i < 34; i++) {
          float fi = float(i);
          vec2 c = vec2(
            sin(fi * 13.17 + time * .21),
            cos(fi * 8.73 - time * .17)
          ) * (.18 + .72 * hash(vec2(fi, fi + 9.0)));
          float r = .006 + .034 * hash(vec2(fi + 1.0, fi + 4.0));
          field += splat(warp, c, r) * (.35 + .65 * hash(vec2(fi + 8.0, fi)));
        }
        field = clamp(field / 4.2, 0.0, 1.0);

        float relightMask = smoothstep(.82, .14, abs(length(uv * vec2(.9, 1.2)) - .62));
        relightMask *= smoothstep(1.35, .18, length(uv - vec2(.08 * sin(time), .02)));

        float d = glyphField(uv * 1.15 + vec2(.0, .03 * sin(time * 1.3)));
        float glyph = smoothstep(.018, -.012, d);
        float edge = 1.0 - smoothstep(.0, .055, abs(d));
        float badHalo = smoothstep(.12, .0, abs(d - (.032 + .025 * sin(time * 1.7)))) * (1.0 - glyph);
        float fixedEdge = edge * (.55 + .45 * lens);

        float gridX = abs(fract((uv.x + time * .015) * 9.0) - .5);
        float gridY = abs(fract((uv.y - time * .012) * 7.0) - .5);
        float tile = smoothstep(.49, .50, max(gridX, gridY));

        vec2 sourceA = vec2(.72 * sin(time * .65), .48 * cos(time * .51));
        vec2 sourceB = vec2(.54 * sin(time * .35 + 2.4), .54 * cos(time * .42 + 1.7));
        vec2 va = uv - sourceA;
        vec2 vb = uv - sourceB;
        float waveA = sin(length(va) * 28.0 - time * 5.5);
        float waveB = sin(length(vb) * 34.0 - time * 6.4);
        float rings = (smoothstep(.94, 1.0, waveA) / (1.0 + length(va) * 6.0) +
                       smoothstep(.95, 1.0, waveB) / (1.0 + length(vb) * 7.0)) * audio;

        float vectorLines = 0.0;
        for (int i = 0; i < 9; i++) {
          float fi = float(i);
          float a = fi / 9.0 * 6.28318 + time * (.18 + .02 * fi);
          vec2 dir = vec2(cos(a), sin(a));
          vec2 p = uv - dir * (.22 + .045 * sin(time + fi));
          float ray = abs(dot(p, vec2(-dir.y, dir.x)));
          float along = dot(p, dir);
          vectorLines += smoothstep(.014, .0, ray) * smoothstep(.38, .0, abs(along)) * smoothstep(-.08, .04, along);
        }

        vec3 color = vec3(.012, .017, .028);
        color += palette(field) * field * (1.1 + .5 * relightMask);
        color += vec3(.08, .44, .68) * relightMask * .38;
        color += vec3(.09, .75, .95) * glyph * 1.15;
        color += vec3(.95, .98, 1.0) * fixedEdge * .75;
        color += vec3(1.0, .26, .72) * badHalo * (.35 + .65 * (1.0 - lens));
        color += vec3(1.0, .62, .18) * tile * (.1 + .5 * pressure);
        color += vec3(.2, .95, 1.0) * rings * .8;
        color += vec3(.95, .35, .92) * vectorLines * audioMode * .22;
        color += vec3(.8, .95, 1.0) * lens * .12;

        float scan = .96 + .04 * sin(gl_FragCoord.y * 1.7 + time * 12.0);
        float vignette = smoothstep(1.45, .25, length(uv));
        color *= scan * vignette;
        color = pow(color, vec3(.86));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    const position = gl.getAttribLocation(program, "position");
    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      time: gl.getUniformLocation(program, "time"),
      pressure: gl.getUniformLocation(program, "pressure"),
      audioMode: gl.getUniformLocation(program, "audioMode")
    };

    const state = {
      pointerX: innerWidth * .5,
      pointerY: innerHeight * .5,
      down: false,
      space: false,
      audioMode: 1
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(innerWidth * dpr));
      const height = Math.max(1, Math.floor(innerHeight * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    addEventListener("resize", resize);
    addEventListener("pointermove", (event) => {
      state.pointerX = event.clientX;
      state.pointerY = event.clientY;
    });
    addEventListener("pointerdown", () => { state.down = true; });
    addEventListener("pointerup", () => { state.down = false; });
    addEventListener("keydown", (event) => {
      if (event.code === "Space") state.space = true;
      if (event.key.toLowerCase() === "a") state.audioMode = 1 - state.audioMode;
    });
    addEventListener("keyup", (event) => {
      if (event.code === "Space") state.space = false;
    });

    const start = performance.now();
    function draw(now) {
      resize();
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      const dpr = Math.min(devicePixelRatio || 1, 2);
      gl.uniform2f(uniforms.pointer, state.pointerX * dpr, canvas.height - state.pointerY * dpr);
      gl.uniform1f(uniforms.time, (now - start) * .001);
      gl.uniform1f(uniforms.pressure, state.down || state.space ? 1 : 0);
      gl.uniform1f(uniforms.audioMode, state.audioMode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
