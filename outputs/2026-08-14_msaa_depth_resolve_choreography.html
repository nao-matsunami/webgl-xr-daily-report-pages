<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-08-14 MSAA Depth Resolve Choreography</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #03070b;
      color: #eef9ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .hud {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      pointer-events: none;
      color: rgba(236, 250, 255, 0.82);
      font-size: 11px;
      line-height: 1.5;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(67, 218, 255, 0.32);
    }

    .hud strong {
      color: #fff;
      font-weight: 700;
    }

    .modes {
      text-align: right;
      color: rgba(174, 232, 245, 0.76);
    }

    @media (max-width: 760px) {
      .hud {
        grid-template-columns: 1fr;
        font-size: 10px;
      }

      .modes {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hud">
    <div>
      <strong>MSAA DEPTH RESOLVE CHOREOGRAPHY</strong><br>
      Drag steers sample phase and scene-depth flow. Hold / Space increases resolve pressure.
    </div>
    <div class="modes">1 MSAA resolve / 2 scene depth texture / 3 splat sort prefix / 4 lazy editor import</div>
  </div>

  <script id="vertex" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fragment" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2 u_resolution;
    uniform vec2 u_pointer;
    uniform float u_time;
    uniform float u_pressure;
    uniform float u_mode;

    float hash(vec2 p) {
      p = fract(p * vec2(127.1, 311.7));
      p += dot(p, p + 19.19);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }

    mat2 rot(float a) {
      float s = sin(a);
      float c = cos(a);
      return mat2(c, -s, s, c);
    }

    float line(float v, float w) {
      return smoothstep(w, 0.0, abs(v));
    }

    float ring(vec2 p, float r, float w) {
      return line(length(p) - r, w);
    }

    float box(vec2 p, vec2 b, float w) {
      vec2 d = abs(p) - b;
      return 1.0 - smoothstep(0.0, w, length(max(d, 0.0)) + min(max(d.x, d.y), 0.0));
    }

    vec3 palette(float t) {
      vec3 a = vec3(0.02, 0.82, 1.0);
      vec3 b = vec3(0.82, 0.18, 0.96);
      vec3 c = vec3(1.0, 0.7, 0.2);
      return mix(mix(a, b, smoothstep(0.12, 0.66, t)), c, smoothstep(0.58, 1.0, t));
    }

    vec3 background(vec2 uv) {
      vec2 p = uv - 0.5;
      float n = noise(uv * 4.5 + vec2(u_time * 0.015, -u_time * 0.02));
      float scan = line(fract((uv.y + u_time * 0.015) * 90.0) - 0.5, 0.015);
      float stars = pow(noise(uv * 220.0 + u_time * 0.04), 25.0);
      vec3 col = mix(vec3(0.006, 0.01, 0.017), vec3(0.018, 0.028, 0.036), n);
      col += vec3(0.0, 0.25, 0.32) * exp(-length(p * vec2(1.0, 1.25)) * 3.4);
      col += vec3(0.8, 0.96, 1.0) * stars;
      col += vec3(0.03, 0.12, 0.16) * scan;
      return col;
    }

    float field(vec2 p) {
      float f = 0.0;
      for (int i = 0; i < 24; i++) {
        float fi = float(i);
        float a = fi * 2.399 + u_time * (0.05 + hash(vec2(fi, 3.0)) * 0.05);
        vec2 c = vec2(cos(a) * 0.31, sin(a * 1.17) * 0.23);
        vec2 q = rot(a + 0.4) * (p - c);
        f += exp(-dot(q / vec2(0.045, 0.018), q / vec2(0.045, 0.018))) * (0.55 + 0.45 * hash(vec2(fi)));
      }
      return f;
    }

    vec3 msaaResolve(vec2 uv, vec2 pointer) {
      vec3 col = background(uv) * 0.52;
      vec2 p = (uv - 0.5) * vec2(u_resolution.x / u_resolution.y, 1.0);
      vec2 dir = normalize((pointer - 0.5) * vec2(1.8, 1.0) + vec2(0.18, 0.14));
      vec2 sampleOffsets[4];
      sampleOffsets[0] = vec2(-0.35, -0.15);
      sampleOffsets[1] = vec2(0.22, -0.34);
      sampleOffsets[2] = vec2(-0.18, 0.32);
      sampleOffsets[3] = vec2(0.38, 0.2);

      vec3 accum = vec3(0.0);
      float mask = 0.0;
      for (int i = 0; i < 4; i++) {
        float fi = float(i);
        vec2 sp = p + sampleOffsets[i] * (0.008 + u_pressure * 0.018) + dir * sin(u_time * 1.4 + fi) * 0.006;
        float lane = field(sp);
        float edge = ring(sp + dir * (0.04 * fi - 0.06), 0.18 + fi * 0.035, 0.008);
        vec3 tint = palette(fi / 3.0);
        accum += tint * (lane * 0.13 + edge * (0.4 + u_pressure * 0.55));
        mask += edge;
      }

      float hardwareBox = field(p) * 0.18;
      float customResolve = mask * (0.42 + 0.55 * u_pressure);
      col += mix(vec3(0.03, 0.15, 0.18) * hardwareBox, accum, 0.82);
      col += vec3(1.0, 0.78, 0.28) * customResolve;
      col += vec3(0.1, 0.92, 1.0) * line(dot(p, vec2(-dir.y, dir.x)), 0.004) * 0.75;
      col += vec3(0.86, 0.98, 1.0) * ring((uv - pointer) * vec2(1.25, 0.9), 0.24, 0.006);
      return col;
    }

    vec3 sceneDepth(vec2 uv, vec2 pointer) {
      vec3 col = background(uv) * 0.5;
      vec2 p = uv - 0.5;
      float depth = 0.5 + 0.35 * sin((p.x * 4.0 + p.y * 2.0) + u_time * 0.42);
      depth += 0.18 * field(p * vec2(1.3, 1.0));
      float quant = floor(depth * 13.0) / 13.0;
      float contour = line(fract(depth * 13.0) - 0.5, 0.035);
      float splatWrites = field(p + (pointer - 0.5) * 0.12);
      float forwardAttachment = smoothstep(0.22, 1.2, splatWrites) * contour;
      float fog = smoothstep(0.15, 0.95, quant);
      col += mix(vec3(0.0, 0.12, 0.2), vec3(0.9, 0.24, 0.8), fog) * 0.44;
      col += vec3(0.05, 0.85, 1.0) * contour * 0.72;
      col += vec3(1.0, 0.7, 0.22) * forwardAttachment * (0.45 + u_pressure);
      col += vec3(0.8, 0.95, 1.0) * line(p.x + 0.18 * sin(u_time + p.y * 8.0), 0.006) * 0.45;
      return col;
    }

    vec3 splatPrefix(vec2 uv, vec2 pointer) {
      vec3 col = background(uv) * 0.46;
      vec2 p = uv - 0.5;
      float bars = 0.0;
      for (int i = 0; i < 32; i++) {
        float fi = float(i);
        float x = -0.42 + fi / 31.0 * 0.84;
        float h = 0.1 + 0.34 * pow(hash(vec2(fi, 8.0)), 0.65);
        h += 0.11 * sin(u_time * 0.8 + fi * 0.5 + pointer.x * 4.0);
        float b = box(p - vec2(x, -0.22 + h * 0.5), vec2(0.009, h), 0.012);
        float prefix = smoothstep(-0.45, 0.45, p.x) * smoothstep(-0.28, 0.22, p.y);
        bars += b;
        col += palette(fi / 31.0) * b * (0.34 + prefix * 0.34);
      }
      float sweep = line(p.x - sin(u_time * 0.55 + pointer.x * 3.0) * 0.35, 0.01 + u_pressure * 0.014);
      float sortedSplat = field(rot(pointer.y * 1.8 - 0.7) * p);
      col += vec3(0.0, 0.86, 1.0) * sweep * (0.5 + bars * 0.4);
      col += vec3(1.0, 0.42, 0.84) * smoothstep(0.8, 2.6, sortedSplat) * 0.35;
      col += vec3(1.0, 0.78, 0.22) * ring(p * vec2(1.25, 0.85), 0.36, 0.006);
      return col;
    }

    vec3 lazyEditorImport(vec2 uv, vec2 pointer) {
      vec3 col = background(uv) * 0.45;
      vec2 p = uv - 0.5;
      for (int i = 0; i < 5; i++) {
        float fi = float(i);
        float y = -0.26 + fi * 0.13;
        float phase = fract(u_time * (0.06 + fi * 0.012) + pointer.x * 0.35 + fi * 0.17);
        float rail = line(p.y - y, 0.004);
        float packet = box(p - vec2(-0.42 + phase * 0.84, y), vec2(0.035, 0.022), 0.014);
        float miss = ring(p - vec2(0.36 - phase * 0.16, y), 0.035 + u_pressure * 0.02, 0.006);
        col += palette(fi / 4.0) * rail * 0.25;
        col += palette(fi / 4.0) * packet * (0.74 + u_pressure * 0.5);
        col += vec3(1.0, 0.34, 0.25) * miss * smoothstep(0.58, 0.98, phase) * (0.45 + u_pressure);
      }
      float inspector = box(p, vec2(0.22, 0.38), 0.018);
      float virtualRows = line(fract((p.y + 0.38) * 18.0) - 0.5, 0.04) * inspector;
      float importShape = line(p.x + 0.18 * sin(p.y * 16.0 + u_time), 0.006);
      col += vec3(0.06, 0.6, 0.85) * inspector * 0.18;
      col += vec3(0.8, 0.96, 1.0) * virtualRows * 0.2;
      col += vec3(1.0, 0.76, 0.25) * importShape * 0.52;
      return col;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 pointer = clamp(u_pointer, vec2(0.001), vec2(0.999));
      vec3 a = msaaResolve(uv, pointer);
      vec3 b = sceneDepth(uv, pointer);
      vec3 c = splatPrefix(uv, pointer);
      vec3 d = lazyEditorImport(uv, pointer);

      float m = clamp(u_mode, 1.0, 4.0);
      vec3 col = a;
      col = mix(col, b, smoothstep(1.5, 2.0, m));
      col = mix(col, c, smoothstep(2.5, 3.0, m));
      col = mix(col, d, smoothstep(3.5, 4.0, m));

      float vignette = smoothstep(0.82, 0.18, length(uv - 0.5));
      col *= 0.72 + vignette * 0.58;
      col = pow(col, vec3(0.88));
      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById("stage");
    const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
    const pointer = { x: 0.55, y: 0.52 };
    let pressure = 0;
    let targetPressure = 0;
    let mode = 1;
    let dragging = false;

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, document.getElementById("vertex").textContent));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, document.getElementById("fragment").textContent));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "u_resolution"),
      pointer: gl.getUniformLocation(program, "u_pointer"),
      time: gl.getUniformLocation(program, "u_time"),
      pressure: gl.getUniformLocation(program, "u_pressure"),
      mode: gl.getUniformLocation(program, "u_mode")
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
      }
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = (event.clientX - rect.left) / rect.width;
      pointer.y = 1 - (event.clientY - rect.top) / rect.height;
    }

    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      targetPressure = 1;
      setPointer(event);
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (dragging) setPointer(event);
    });

    canvas.addEventListener("pointerup", () => {
      dragging = false;
      targetPressure = 0;
    });

    window.addEventListener("keydown", (event) => {
      if (event.key >= "1" && event.key <= "4") mode = Number(event.key);
      if (event.code === "Space") targetPressure = 1;
    });

    window.addEventListener("keyup", (event) => {
      if (event.code === "Space") targetPressure = dragging ? 1 : 0;
    });

    function frame(ms) {
      resize();
      pressure += (targetPressure - pressure) * 0.08;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
      gl.uniform1f(uniforms.time, ms * 0.001);
      gl.uniform1f(uniforms.pressure, pressure);
      gl.uniform1f(uniforms.mode, mode);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
