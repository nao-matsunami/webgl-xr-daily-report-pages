<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reflection Replacement Loom — 2026-11-26</title>
<style>html,body{margin:0;height:100%;background:#071019;color:#d9eff7;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:fixed;left:18px;top:16px;max-width:350px;pointer-events:none;text-shadow:0 1px 10px #000}.hud b{color:#aeeeff;letter-spacing:.08em}.hint{position:fixed;right:18px;bottom:16px;text-align:right;color:#a7bec9}.dot{color:#ffbd77}</style>
<canvas id="c"></canvas><div class="hud"><b>REFLECTION REPLACEMENT LOOM</b><br>青=環境反射 / 金=SSRで置換された部分<br><span class="dot">click</span> で鏡片を留める　pointer で光源の方位を変える</div><div class="hint">environment → difference → rough footprint<br>three.js SSR study / raw WebGL</div>
<script>
const c=document.querySelector('#c'),gl=c.getContext('webgl');
const v=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const f=`precision highp float;uniform vec2 r,m;uniform float t;uniform vec4 pins[8];
float h(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5);}float n(vec2 p){vec2 i=floor(p),q=fract(p);q=q*q*(3.-2.*q);return mix(mix(h(i),h(i+vec2(1,0)),q.x),mix(h(i+vec2(0,1)),h(i+1.),q.x),q.y);} 
void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/min(r.x,r.y), q=uv; float sky=.35+.3*sin(uv.y*5.+t*.13)+.18*n(uv*5.); vec3 env=vec3(.025,.13,.20)+sky*vec3(.10,.32,.42); vec2 l=(m-.5*r)/min(r.x,r.y); float weave=sin((uv.x+uv.y*.32)*70.+t*.9)*.5+.5; float mask=0.; vec3 repl=vec3(0.);
for(int i=0;i<8;i++){vec2 a=pins[i].xy;float age=pins[i].z;float live=step(0.01,age);vec2 d=uv-a;float rough=.035+.12*clamp(age*.025,0.,1.);float foot=exp(-dot(d,d)/(rough*rough));float stripe=.45+.55*sin(atan(d.y,d.x)*7.+length(d)*120.-t*.7);mask=max(mask,foot);repl+=foot*stripe*vec3(1.,.43,.10);}float cursor=exp(-dot(uv-l,uv-l)/.025);mask=max(mask,cursor*.55);repl+=cursor*vec3(1.,.52,.17);
// SSR is composited as a signed difference: replacement - environment, then beauty + difference.
vec3 col=mix(env,repl+env*.12,mask);col+=.07*weave*vec3(.1,.8,1.)*(1.-mask);float vig=1.-.28*dot(uv,uv);gl_FragColor=vec4(col*vig,1.);}`;
function sh(type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);return x}let p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);gl.useProgram(p);
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let pins=Array.from({length:8},()=>[0,0,0,0]), mouse=[innerWidth*.7,innerHeight*.35];
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',size);size();addEventListener('pointermove',e=>mouse=[e.clientX*devicePixelRatio,e.clientY*devicePixelRatio]);addEventListener('pointerdown',e=>{pins.unshift([(e.clientX-innerWidth/2)/Math.min(innerWidth,innerHeight),(innerHeight/2-e.clientY)/Math.min(innerWidth,innerHeight),performance.now()/1000,1]);pins.pop()});
function draw(){let now=performance.now()/1000;gl.uniform2f(gl.getUniformLocation(p,'r'),c.width,c.height);gl.uniform2f(gl.getUniformLocation(p,'m'),mouse[0],c.height-mouse[1]);gl.uniform1f(gl.getUniformLocation(p,'t'),now);let x=[];for(let z of pins)x.push(z[0],z[1],z[2]?now-z[2]:0,z[3]);gl.uniform4fv(gl.getUniformLocation(p,'pins'),x);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw)}draw();
</script></html>
