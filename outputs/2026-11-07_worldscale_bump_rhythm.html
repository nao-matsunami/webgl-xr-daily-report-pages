<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World-scale Bump Rhythm</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a0710;color:#fae9cf;font:13px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#n{position:fixed;left:18px;top:18px;line-height:1.6}b{color:#fff}kbd{border:1px solid #b08576;border-radius:3px;padding:2px 5px}</style>
<canvas></canvas><div id="n"><b>WORLD-SCALE BUMP RHYTHM</b><br>pointer: slope / scale &nbsp; <kbd>1</kbd> height <kbd>2</kbd> gradient <kbd>3</kbd> light <kbd>4</kbd> composite<br>click / Space: strike a relief beat</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,p={x:.5,y:.5},m=4,beat=0;function rs(){w=c.width=innerWidth;h=c.height=innerHeight}rs();addEventListener('resize',rs);addEventListener('pointermove',e=>p={x:e.clientX/w,y:e.clientY/h});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(+e.key)m=+e.key;if(e.code==='Space')beat=1});
function f(t){requestAnimationFrame(f);let T=t/1000;beat*=.94;g.fillStyle='#0a0710';g.fillRect(0,0,w,h);let sc=8+p.x*46,ly=.15+p.y*.7;
for(let y=0;y<h;y+=6)for(let x=0;x<w;x+=6){let u=x/w,v=y/h,z=Math.sin(u*sc+T*1.5)+Math.cos(v*sc*.72-T)+Math.sin((u+v)*sc*.42);let dx=Math.cos(u*sc+T)*sc,dy=-Math.sin(v*sc*.72-T)*sc*.72;let l=Math.max(0,(dx*.5+dy*ly+sc*.32)/(sc*1.6));let a=(z+2)/4;let col=m===1?`hsl(${280+a*45} 55% ${18+a*45}%)`:m===2?`hsl(${190+a*90} 68% ${12+Math.abs(dx-dy)/sc*55}%)`:m===3?`hsl(${38+a*34} 85% ${10+l*67}%)`:`hsl(${270+a*80} ${45+l*45}% ${9+l*68}%)`;g.fillStyle=col;g.fillRect(x,y,7,7)}
g.globalCompositeOperation='screen';let R=90+beat*260,rad=g.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,R);rad.addColorStop(0,'rgba(255,221,150,.75)');rad.addColorStop(1,'transparent');g.fillStyle=rad;g.fillRect(p.x*w-R,p.y*h-R,R*2,R*2);g.globalCompositeOperation='source-over';g.fillStyle='#f0caa8';g.fillText(['HEIGHT FIELD','WORLD-UNIT GRADIENT','LIGHT RESPONSE','COMPOSITE RELIEF'][m-1],18,h-22);g.fillStyle='#a7838a';g.fillText('scale '+sc.toFixed(1)+'m  •  strike '+beat.toFixed(2),18,h-8)}requestAnimationFrame(f);
</script></html>
