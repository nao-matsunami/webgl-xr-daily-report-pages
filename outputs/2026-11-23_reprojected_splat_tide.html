<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reprojected Splat Tide</title>
<style>html,body{margin:0;overflow:hidden;background:#070512;color:#f2eaff;font:12px ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}#copy{position:fixed;left:18px;bottom:16px;line-height:1.6;pointer-events:none}strong{color:#ffd3a5}</style><canvas></canvas><div id="copy"><strong>REPROJECTED SPLAT TIDE</strong><br>move = steer the current / click = leave a memory buoy / R = clear<br>Derived test: a current-frame field and a slower reprojected field disagree on purpose.</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),buoys=[];let m={x:.5,y:.5,px:.5,py:.5},last=0;
function size(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function move(e){m.px=m.x;m.py=m.y;m.x=e.clientX/innerWidth;m.y=e.clientY/innerHeight}addEventListener('pointermove',move);addEventListener('click',e=>{move(e);buoys.push({x:m.x,y:m.y,t:performance.now()});if(buoys.length>12)buoys.shift()});addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')buoys.length=0});
function blob(px,py,rad,color,alpha){let g=x.createRadialGradient(px,py,0,px,py,rad);g.addColorStop(0,color.replace(')',','+alpha+')').replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rad,0,7);x.fill()}
function tick(now){requestAnimationFrame(tick);let dt=Math.min(.05,(now-last)/1000||0);last=now;x.fillStyle='rgba(7,5,18,.16)';x.fillRect(0,0,innerWidth,innerHeight);x.globalCompositeOperation='screen';let vx=(m.x-m.px)*innerWidth,vy=(m.y-m.py)*innerHeight;let drift=Math.sin(now*.0005)*.08;for(let i=0;i<180;i++){let a=i*2.399+now*.00012,r=Math.sqrt(i/180)*Math.min(innerWidth,innerHeight)*.52;let px=innerWidth*.5+Math.cos(a+drift)*r,py=innerHeight*.5+Math.sin(a*1.7)*r*.62;let influence=Math.exp(-((px-m.x*innerWidth)**2+(py-m.y*innerHeight)**2)/70000);px+=vx*influence*.22;py+=vy*influence*.22;let hue=190+i%70;blob(px,py,3+(i%4),`rgb(${80+i%110},${120+i%90},255)`,.09+influence*.22)}for(const b of buoys){let age=(now-b.t)/1000,rad=20+age*42;x.strokeStyle=`hsla(${25+age*12},100%,72%,${Math.max(0,.55-age*.08)})`;x.lineWidth=1.5;x.beginPath();x.arc(b.x*innerWidth,b.y*innerHeight,rad,0,7);x.stroke();blob(b.x*innerWidth,b.y*innerHeight,26,'rgb(255,180,90)',.24)}x.globalCompositeOperation='source-over';m.px+=(m.x-m.px)*Math.min(1,dt*4);m.py+=(m.y-m.py)*Math.min(1,dt*4)}requestAnimationFrame(tick);
</script></html>
