<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2026-09-07 Incremental Probe Bake Timeline</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#08090a;color:#eef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    canvas{display:block;width:100vw;height:100vh}
    .hud{position:fixed;left:16px;top:14px;max-width:560px;font-size:13px;line-height:1.45;color:#dfe6ea;text-shadow:0 1px 8px #000}
    .hud b{color:#fff}.hud span{color:#9fb3bf}
  </style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud"><b>Incremental Probe Bake Timeline</b><br><span>1 probe cells / 2 bounce pass / 3 sunlight cascades / 4 composed city GI. Drag = bake cursor and sun. Click or Space = probe burst.</span></div>
<script>
const canvas=document.getElementById("gl");
const gl=canvas.getContext("webgl",{antialias:false,alpha:false});
const frag=`
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_pointer;
uniform float u_pulse;
uniform int u_mode;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float box(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.0))+min(max(d.x,d.y),0.0);}
vec3 pal(float t){return .55+.45*cos(6.28318*(vec3(.02,.27,.54)+t+vec3(0.0,.17,.33)));}

vec3 city(vec2 p){
  float g=floor((p.x+1.2)*9.0);
  float h=.12+.52*hash(vec2(g,2.0));
  float b=smoothstep(.02,-.01,box(vec2(fract((p.x+1.2)*9.0)-.5,p.y+h-.18),vec2(.035+.05*hash(vec2(g,8.0)),h)));
  float road=smoothstep(.03,.0,abs(p.y+.38))+smoothstep(.025,.0,abs(p.x+.15));
  return vec3(.08,.1,.12)+b*vec3(.32,.36,.38)+road*vec3(.04,.045,.04);
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-u_res)/min(u_res.x,u_res.y);
  vec2 m=(u_pointer*2.0-1.0)*vec2(u_res.x/u_res.y,1.0);
  float t=u_time*.32;
  float cursor=fract(t+m.x*.22+u_pulse*.08);
  vec2 grid=(uv+vec2(1.05,.72))*vec2(7.5,5.2);
  vec2 cell=floor(grid);
  vec2 f=fract(grid)-.5;
  float id=cell.x+cell.y*9.0;
  float order=fract(id*.073+hash(cell)*.18);
  float done=smoothstep(order-.05,order+.07,cursor);
  float ring=smoothstep(.025,.0,abs(length(f)-.37));
  float probe=done*(.42+.58*hash(cell+3.0))*smoothstep(.46,.12,length(f));
  float bounce=done*(.5+.5*sin(t*8.0+id*.61))*smoothstep(.42,.02,abs(f.x+sin(id)*.16));
  float sun=max(dot(normalize(vec2(.32+m.x*.32,.8+m.y*.2)),normalize(uv+vec2(.1,.25))),0.0);
  float cascade=0.0;
  for(int i=0;i<4;i++){
    float r=.28+float(i)*.22;
    cascade+=smoothstep(.018,.0,abs(length(uv-m*.25)-r))*(1.0-float(i)*.16);
  }
  float scan=smoothstep(.035,.0,abs(fract((uv.x+uv.y*.25-t*.7)*7.0)-.5));
  vec3 base=city(uv);
  vec3 probeCol=pal(order*.6+done*.25)*probe+vec3(.03,.06,.09)*ring;
  vec3 bounceCol=vec3(.12,.36,.92)*bounce+vec3(.85,.55,.2)*done*scan*.25;
  vec3 sunCol=vec3(1.0,.82,.45)*pow(sun,5.0)+vec3(.22,.5,.95)*cascade*.45;
  vec3 composed=base+probeCol*.9+bounceCol*.65+sunCol*(.28+.38*done);
  float mode=float(u_mode);
  vec3 col=probeCol;
  col=mix(col,bounceCol,step(1.5,mode));
  col=mix(col,sunCol+base*.4,step(2.5,mode));
  col=mix(col,composed,step(3.5,mode));
  col+=vec3(1.0,.62,.22)*exp(-10.0*length(uv-m))*(.25+.75*u_pulse);
  col*=1.0-.35*length(uv);
  gl_FragColor=vec4(pow(max(col,0.0),vec3(.82)),1.0);
}`;
const vert=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vert));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={res:gl.getUniformLocation(prog,"u_res"),time:gl.getUniformLocation(prog,"u_time"),pointer:gl.getUniformLocation(prog,"u_pointer"),pulse:gl.getUniformLocation(prog,"u_pulse"),mode:gl.getUniformLocation(prog,"u_mode")};
let pointer=[.58,.48],pulse=0,mode=4;
addEventListener("pointermove",e=>{if(e.buttons){pointer=[e.clientX/innerWidth,1-e.clientY/innerHeight]}});
addEventListener("pointerdown",e=>{pointer=[e.clientX/innerWidth,1-e.clientY/innerHeight];pulse=1});
addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4")mode=+e.key;if(e.code==="Space")pulse=1});
function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener("resize",resize);resize();
const start=performance.now();
function frame(){gl.useProgram(prog);gl.uniform2f(U.res,canvas.width,canvas.height);gl.uniform1f(U.time,(performance.now()-start)/1000);gl.uniform2f(U.pointer,pointer[0],pointer[1]);gl.uniform1f(U.pulse,pulse);gl.uniform1i(U.mode,mode);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);pulse*=.92;requestAnimationFrame(frame)}
frame();
</script>
<!-- mobile-preset-controls:v1 -->
<style>
  .mobile-preset-controls {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 2147483647;
    display: flex;
    justify-content: center;
    gap: 7px;
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .mobile-preset-controls button {
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    background: rgba(8, 10, 14, 0.68);
    color: rgba(255, 255, 255, 0.92);
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    touch-action: manipulation;
  }
  .mobile-preset-controls button:active,
  .mobile-preset-controls button.is-active {
    background: rgba(255, 221, 128, 0.86);
    color: #101014;
    border-color: rgba(255, 255, 255, 0.72);
  }
  @media (hover: hover) and (pointer: fine) {
    .mobile-preset-controls { opacity: 0.42; transition: opacity 160ms ease; }
    .mobile-preset-controls:hover { opacity: 1; }
  }
  @media (max-width: 520px) {
    .mobile-preset-controls { gap: 6px; }
    .mobile-preset-controls button { min-width: 34px; height: 36px; padding: 0 10px; font-size: 12px; }
  }
</style>
<div class="mobile-preset-controls" aria-label="Preset controls">
  <button type="button" data-mobile-key="1" aria-label="Preset 1">1</button>
  <button type="button" data-mobile-key="2" aria-label="Preset 2">2</button>
  <button type="button" data-mobile-key="3" aria-label="Preset 3">3</button>
  <button type="button" data-mobile-key="4" aria-label="Preset 4">4</button>
  <button type="button" data-mobile-key="5" aria-label="Preset 5">5</button>
  <button type="button" data-mobile-key="Space" aria-label="Pulse">Pulse</button>
</div>
<script>
(() => {
  const dock = document.currentScript.previousElementSibling;
  if (!dock || dock.dataset.ready === 'true') return;
  dock.dataset.ready = 'true';
  const sendKey = (keyName) => {
    const isSpace = keyName === 'Space';
    const key = isSpace ? ' ' : keyName;
    const code = isSpace ? 'Space' : 'Digit' + keyName;
    const eventInit = { key, code, bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    if (isSpace) {
      window.setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
      }, 140);
    }
  };
  dock.querySelectorAll('button').forEach((button) => {
    const keyName = button.dataset.mobileKey;
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      dock.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      sendKey(keyName);
    });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
  });
})();
</script>
</body>
</html>
