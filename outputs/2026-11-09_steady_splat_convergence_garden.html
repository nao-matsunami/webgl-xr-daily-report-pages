<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steady Splat Convergence Garden</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#070812;color:#ecedff;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#hud{position:fixed;inset:18px auto auto 18px;line-height:1.6;letter-spacing:.04em;text-shadow:0 1px 12px #000}b{color:#c4b4ff}span{color:#f8d477}</style>
<canvas id="c"></canvas><div id="hud"><b>STEADY SPLAT / CONVERGENCE GARDEN</b><br>move: set the focus · click / Space: reset history<br><span>1 noisy samples · 2 spatial reuse · 3 temporal settle · 4 composite</span></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let px=.5,py=.5,mode=4,reset=0;function rs(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight});addEventListener('pointerdown',()=>reset=performance.now()/1000);addEventListener('keydown',e=>{if(e.code==='Space')reset=performance.now()/1000;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(ms){let t=ms/1000,age=t-reset,settle=Math.min(1,Math.max(0,age/2.7)),cx=innerWidth*px,cy=innerHeight*py;x.fillStyle='#070812';x.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<420;i++){let a=i*2.39996,r=12+Math.sqrt(i)*18,sw=Math.sin(i*17.2+t*4.);let xx=cx+Math.cos(a)*r+sw*(1-settle)*17,yy=cy+Math.sin(a)*r*.58+Math.cos(i*9+t*3)*(1-settle)*13;let noise=mode===1?1:mode===2?.5:mode===3?.18:1-settle*.82;let size=2.2+(i%5)*.7+noise*3;let alpha=.12+(1-noise)*.46;let hue=185+i%70;x.fillStyle=`hsla(${hue},90%,${58+settle*22}%,${alpha})`;x.beginPath();x.arc(xx,yy,size,0,7);x.fill();if(mode!==1&&i%4===0){x.strokeStyle=`hsla(${280-i%50},90%,75%,${.05+settle*.16})`;x.beginPath();x.moveTo(xx,yy);x.lineTo(cx+(xx-cx)*.88,cy+(yy-cy)*.88);x.stroke()}}x.strokeStyle=`rgba(255,210,110,${.85*(1-settle)})`;x.lineWidth=1+6*(1-settle);x.beginPath();x.arc(cx,cy,20+age*85,0,7);x.stroke();x.fillStyle='rgba(220,225,255,.75)';x.fillText(age<2.7?`history reset · convergence ${Math.round(settle*16)}/16 frames`:'history retained · image settled',18,innerHeight-28);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
