<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splat Half-Float Lanterns</title><style>html,body{margin:0;background:#05050a;color:#edf7ff;font:13px ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:18px;bottom:16px;line-height:1.55;text-shadow:0 1px 5px #000;pointer-events:none}b{color:#ffd798}span{color:#9ab5c8}</style><canvas></canvas><div id="ui"><b>SPLAT LANTERNS / HALF-FLOAT STUDY</b><br><span>pointer: set focal plane · click / space: compress and release · 1–4: raw / quantize / min-pixel / composite</span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,x=.5,y=.5,m=4,t=0,k=0;let pts=Array.from({length:180},(_,i)=>({a:i*2.399,r:Math.sqrt(i/180),z:(i*37%101)/100}));function fit(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}fit();addEventListener('resize',fit);addEventListener('pointermove',e=>{x=e.clientX/W;y=e.clientY/H});function kick(){k=1}addEventListener('pointerdown',kick);addEventListener('keydown',e=>{if(e.key===' ')kick();if(+e.key>0&&+e.key<5)m=+e.key});function loop(n){requestAnimationFrame(loop);t=n*.001;k*=.93;g.fillStyle='#05050a';g.fillRect(0,0,W,H);let cx=W*.5,cy=H*.5,R=Math.min(W,H)*.42;pts.forEach((p,i)=>{let dx=Math.cos(p.a+t*.08)*p.r*R,dy=Math.sin(p.a+t*.06)*p.r*R*.55;let q=Math.round(p.z*7)/7;let z=m===2?q:p.z;let focus=1-Math.abs(z-x);let size=2+focus*14+k*5;if(m===3||m===4)size=Math.max(3.2,size);if(m===1||m===4){g.fillStyle=`hsla(${28+focus*45},100%,${50+focus*30}%,${.12+focus*.7})`;g.beginPath();g.arc(cx+dx,cy+dy,size,0,7);g.fill()}if(m===2){g.fillStyle=`rgba(100,160,255,${.2+focus*.7})`;g.fillRect(cx+dx-size,cy+dy-size,size*2,size*2)}if(m===3){g.strokeStyle=`rgba(255,212,138,${.16+focus*.7})`;g.beginPath();g.arc(cx+dx,cy+dy,size,0,7);g.stroke()}});if(m===4){g.strokeStyle=`rgba(255,215,152,${.25+k*.55})`;g.beginPath();g.arc(cx+R*(x-.5)*.7,cy+R*(y-.5)*.4,35+k*80,0,7);g.stroke()}let names=['RAW / continuous depth illustration','QUANTIZE / 8-bin depth illustration','MIN PIXEL / retention ring','COMPOSITE / focal lanterns'];g.fillStyle='#eff8ff';g.fillText(names[m-1],18,28);g.fillStyle='#9ab5c8';g.fillText(`focus ${(x*100|0)}% · conceptual 2D study; not real half-float packing · release ${k>.08?'active':'rest'}`,18,48)}requestAnimationFrame(loop);
