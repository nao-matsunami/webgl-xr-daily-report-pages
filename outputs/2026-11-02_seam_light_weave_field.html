<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seam Light Weave Field</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05030b;color:#fff1df;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:620px;pointer-events:none}.ey{font-size:10px;letter-spacing:.15em;color:#ffb98f}.title{margin:7px 0;font:700 clamp(24px,4vw,49px)/1 system-ui}.meta{color:#e5cfc2}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #7e4d4b;border-radius:999px;color:#ffe0c1}.keys{position:fixed;right:18px;bottom:17px;text-align:right;color:#e5cfc2}</style>
<canvas></canvas><div class="hud"><div class="ey">SEAM TRANSITION × LIGHT WEAVE × POINTER VELOCITY — 02 NOV 2026</div><div class="title">Pull the seam.<br>Let light remember.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: weave direction</span><span class="tag">click / space: stitch a transition</span><span class="tag">1–4: thread / seam / memory / composite</span></div></div><div class="keys">1 threads &nbsp; 2 seam &nbsp; 3 memory &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');
let mx=.5,my=.5,mode=4,beat=0,last=0,stitches=[];
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',fit);fit();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
function fire(){beat=1;stitches.push({x:mx,y:my,a:1});stitches=stitches.slice(-12)}
addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.key===' ')fire();if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){
  requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1000||0);last=t;beat*=Math.exp(-dt*1.5);let w=innerWidth,h=innerHeight;x.fillStyle='rgba(5,3,11,.16)';x.fillRect(0,0,w,h);let sx=mx*w,sy=my*h;
  for(let i=0;i<80;i++){let y=(i/79)*h,phase=t*.001*(.6+i%5*.12);x.strokeStyle=`hsla(${12+i*1.7},90%,${42+(i%4)*8}%,${mode===1||mode===4?.24:0})`;x.lineWidth=1+(i%7===0);x.beginPath();for(let k=0;k<34;k++){let px=k/33*w,warp=Math.sin(k*.42+phase+y*.011)*18+(sx-px)*.07*Math.exp(-Math.abs(y-sy)/160);k?x.lineTo(px,y+warp):x.moveTo(px,y+warp)}x.stroke()}
  if(mode===2||mode===4){x.strokeStyle=`rgba(255,184,109,${.25+.55*beat})`;x.lineWidth=2.5;x.beginPath();for(let y=0;y<h;y+=9){let px=sx+Math.sin(y*.035+t*.004)*28+(y-sy)*.15;x.lineTo(px,y)}x.stroke()}
  for(let s of stitches){s.a-=dt*.2;if(mode===3||mode===4){x.fillStyle=`rgba(255,112,75,${s.a*.12})`;x.beginPath();x.arc(s.x*w,s.y*h,(1-s.a)*330+18,0,7);x.fill()}}
  stitches=stitches.filter(s=>s.a>0);x.strokeStyle='rgba(255,238,200,.45)';x.strokeRect(sx-8,sy-8,16,16);document.querySelector('#meta').textContent=`stitches ${stitches.length} · seam tension ${Math.round(mx*100)}% · light memory ${Math.round(beat*100)}% · ${['threads','seam','memory','composite'][mode-1]}`;
}
requestAnimationFrame(loop);
</script></html>
