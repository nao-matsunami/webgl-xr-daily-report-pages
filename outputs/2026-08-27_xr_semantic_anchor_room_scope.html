<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XR Semantic Anchor Room Scope</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #08090b;
      color: #eef4f6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(238, 244, 246, 0.82);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.72);
    }
    .hud strong {
      color: #ffffff;
      font-weight: 700;
    }
    #error {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 16px;
      color: #ffd6d6;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div><strong>XR Semantic Anchor Room Scope</strong><br>1 room capture / 2 persistent anchors / 3 semantic labels / 4 texture layers</div>
    <div>Drag: viewer path<br>Click or Space: capture pulse</div>
  </div>
  <pre id="error"></pre>
  <script>
  (() => {
    const canvas = document.getElementById('c');
    const errorEl = document.getElementById('error');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) {
      errorEl.textContent = 'WebGL is not available.';
      return;
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision mediump float;
      uniform vec2 resolution;
      uniform float time;
      uniform vec2 pointer;
      uniform float impulse;
      uniform float mode;

      float line(float v, float width) {
        return 1.0 - smoothstep(0.0, width, abs(v));
      }

      float ring(vec2 p, float radius, float width) {
        return 1.0 - smoothstep(width, width * 2.0, abs(length(p) - radius));
      }

      float circle(vec2 p, float r) {
        return smoothstep(r, r - 0.012, length(p));
      }

      float box(vec2 p, vec2 b) {
        vec2 d = abs(p) - b;
        return 1.0 - smoothstep(0.0, 0.018, length(max(d, 0.0)) + min(max(d.x, d.y), 0.0));
      }

      float segment(vec2 p, vec2 a, vec2 b, float width) {
        vec2 pa = p - a;
        vec2 ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return 1.0 - smoothstep(width, width * 2.0, length(pa - ba * h));
      }

      vec3 room(vec2 p) {
        vec2 floorP = vec2(p.x, p.y + 0.48);
        float floorGrid = max(line(fract((floorP.x + floorP.y * 0.22) * 7.0) - 0.5, 0.018), line(fract((floorP.y) * 6.0) - 0.5, 0.018));
        float back = box(p - vec2(0.0, 0.18), vec2(0.72, 0.43));
        float left = segment(p, vec2(-0.72, -0.25), vec2(-0.42, 0.72), 0.012);
        float right = segment(p, vec2(0.72, -0.25), vec2(0.42, 0.72), 0.012);
        vec3 col = vec3(0.03, 0.045, 0.055);
        col += back * vec3(0.08, 0.12, 0.14);
        col += floorGrid * smoothstep(-0.9, 0.2, -p.y) * vec3(0.1, 0.34, 0.38);
        col += (left + right) * vec3(0.5, 0.64, 0.65);
        return col;
      }

      vec3 captureView(vec2 p) {
        vec3 col = room(p);
        float sweep = line(p.x - sin(time * 0.65) * 0.8, 0.018);
        float pulse = ring(p, 0.14 + impulse * 1.1, 0.024);
        float planeA = box(p - vec2(-0.34, -0.12), vec2(0.19, 0.08));
        float planeB = box(p - vec2(0.32, 0.12), vec2(0.16, 0.1));
        float planeC = box(p - vec2(0.05, -0.42), vec2(0.46, 0.06));
        col += sweep * vec3(0.15, 0.85, 0.92);
        col += pulse * vec3(0.9, 0.55, 0.25);
        col += planeA * vec3(0.16, 0.42, 0.52);
        col += planeB * vec3(0.38, 0.22, 0.5);
        col += planeC * vec3(0.22, 0.52, 0.35);
        return col;
      }

      vec3 anchors(vec2 p) {
        vec3 col = room(p);
        vec2 a0 = vec2(-0.45, -0.18);
        vec2 a1 = vec2(0.38, 0.06);
        vec2 a2 = vec2(0.04, -0.38);
        float restore = 0.5 + 0.5 * sin(time * 1.8);
        float c = circle(p - a0, 0.055) + circle(p - a1, 0.055) + circle(p - a2, 0.055);
        float links = segment(p, a0, a1, 0.008) + segment(p, a1, a2, 0.008) + segment(p, a2, a0, 0.008);
        col += links * vec3(0.14, 0.48, 0.55);
        col += c * mix(vec3(0.95, 0.44, 0.18), vec3(0.25, 0.9, 0.72), restore);
        col += ring(p - pointer * 0.75, 0.12 + impulse * 0.72, 0.018) * vec3(1.0, 0.8, 0.45);
        return col;
      }

      vec3 labels(vec2 p) {
        vec3 col = room(p);
        float wall = box(p - vec2(0.0, 0.23), vec2(0.58, 0.27));
        float table = box(p - vec2(-0.22, -0.16), vec2(0.18, 0.08));
        float floor = box(p - vec2(0.1, -0.46), vec2(0.55, 0.06));
        float uncertain = ring(p - vec2(0.43, -0.08), 0.13, 0.016);
        col += wall * vec3(0.08, 0.35, 0.55);
        col += table * vec3(0.55, 0.28, 0.1);
        col += floor * vec3(0.12, 0.48, 0.28);
        col += uncertain * vec3(0.92, 0.82, 0.35);
        col += line(fract((p.x + p.y + time * 0.12) * 5.0) - 0.5, 0.015) * 0.08;
        return col;
      }

      vec3 textureLayers(vec2 p, vec2 uv) {
        vec3 col = vec3(0.025, 0.03, 0.04);
        for (int i = 0; i < 4; i++) {
          float fi = float(i);
          vec2 offset = vec2((fi - 1.5) * 0.18, (fi - 1.5) * 0.06);
          vec2 q = p - offset - pointer * 0.08;
          float layer = box(q, vec2(0.42, 0.24));
          float grain = 0.5 + 0.5 * sin((q.x * 8.0 + q.y * 5.0) * (fi + 1.0) + time + fi);
          vec3 tint = mix(vec3(0.12, 0.5, 0.62), vec3(0.9, 0.45, 0.18), fi / 3.0);
          col += layer * tint * (0.18 + 0.18 * grain);
          col += box(q, vec2(0.42, 0.24)) * ring(q, 0.22 + fi * 0.04, 0.01) * tint;
        }
        col += ring(p, 0.18 + impulse * 0.55, 0.022) * vec3(1.0, 0.88, 0.5);
        return col;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / resolution;
        vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
        vec3 c1 = captureView(p);
        vec3 c2 = anchors(p);
        vec3 c3 = labels(p);
        vec3 c4 = textureLayers(p, uv);
        vec3 col = c1;
        col = mix(col, c2, step(1.5, mode));
        col = mix(col, c3, step(2.5, mode));
        col = mix(col, c4, step(3.5, mode));
        float eye = circle(p - pointer * 0.75, 0.03);
        col += eye * vec3(0.95, 0.95, 0.78);
        float vignette = smoothstep(1.45, 0.2, length(p));
        gl_FragColor = vec4(pow(max(col * vignette, vec3(0.0)), vec3(0.92)), 1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    let program;
    try {
      program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
    } catch (err) {
      errorEl.textContent = err.message;
      return;
    }

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.useProgram(program);
    const pos = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, 'resolution'),
      time: gl.getUniformLocation(program, 'time'),
      pointer: gl.getUniformLocation(program, 'pointer'),
      impulse: gl.getUniformLocation(program, 'impulse'),
      mode: gl.getUniformLocation(program, 'mode')
    };

    let mode = 1;
    let pointer = { x: 0.1, y: -0.04 };
    let impulseStart = -10;
    const start = performance.now();

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const w = Math.floor(innerWidth * dpr);
      const h = Math.floor(innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function setPointer(ev) {
      const x = ev.clientX / innerWidth * 2 - 1;
      const y = 1 - ev.clientY / innerHeight * 2;
      const aspectSafe = Math.min(innerWidth, innerHeight) / innerWidth;
      pointer = { x: x / Math.max(aspectSafe, 0.001), y };
    }

    addEventListener('pointermove', (ev) => {
      if (ev.buttons) setPointer(ev);
    });
    addEventListener('pointerdown', (ev) => {
      setPointer(ev);
      impulseStart = (performance.now() - start) / 1000;
    });
    addEventListener('keydown', (ev) => {
      if (ev.key >= '1' && ev.key <= '4') mode = Number(ev.key);
      if (ev.code === 'Space') impulseStart = (performance.now() - start) / 1000;
    });

    function frame(now) {
      resize();
      const t = (now - start) / 1000;
      const impulse = Math.max(0, 1 - (t - impulseStart) * 0.9);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform1f(uniforms.time, t);
      gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
      gl.uniform1f(uniforms.impulse, impulse);
      gl.uniform1f(uniforms.mode, mode);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
<!-- mobile-preset-controls:v1 -->
<style>
  .mobile-preset-controls {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 2147483647;
    display: flex;
    justify-content: center;
    gap: 7px;
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .mobile-preset-controls button {
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    background: rgba(8, 10, 14, 0.68);
    color: rgba(255, 255, 255, 0.92);
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    touch-action: manipulation;
  }
  .mobile-preset-controls button:active,
  .mobile-preset-controls button.is-active {
    background: rgba(255, 221, 128, 0.86);
    color: #101014;
    border-color: rgba(255, 255, 255, 0.72);
  }
  @media (hover: hover) and (pointer: fine) {
    .mobile-preset-controls { opacity: 0.42; transition: opacity 160ms ease; }
    .mobile-preset-controls:hover { opacity: 1; }
  }
  @media (max-width: 520px) {
    .mobile-preset-controls { gap: 6px; }
    .mobile-preset-controls button { min-width: 34px; height: 36px; padding: 0 10px; font-size: 12px; }
  }
</style>
<div class="mobile-preset-controls" aria-label="Preset controls">
  <button type="button" data-mobile-key="1" aria-label="Preset 1">1</button>
  <button type="button" data-mobile-key="2" aria-label="Preset 2">2</button>
  <button type="button" data-mobile-key="3" aria-label="Preset 3">3</button>
  <button type="button" data-mobile-key="4" aria-label="Preset 4">4</button>
  <button type="button" data-mobile-key="5" aria-label="Preset 5">5</button>
  <button type="button" data-mobile-key="Space" aria-label="Pulse">Pulse</button>
</div>
<script>
(() => {
  const dock = document.currentScript.previousElementSibling;
  if (!dock || dock.dataset.ready === 'true') return;
  dock.dataset.ready = 'true';
  const sendKey = (keyName) => {
    const isSpace = keyName === 'Space';
    const key = isSpace ? ' ' : keyName;
    const code = isSpace ? 'Space' : 'Digit' + keyName;
    const eventInit = { key, code, bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    if (isSpace) {
      window.setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
      }, 140);
    }
  };
  dock.querySelectorAll('button').forEach((button) => {
    const keyName = button.dataset.mobileKey;
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      dock.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      sendKey(keyName);
    });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
  });
})();
</script>
</body>
</html>
