<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Stitch Tide</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071014;color:#eafffb;font:13px/1.45 ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}aside{position:fixed;right:18px;top:18px;width:min(390px,calc(100vw - 36px));background:#081b22d9;border:1px solid #66cbb866;border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px)}h1{font-size:14px;letter-spacing:.08em;margin:0 0 5px}p{margin:4px 0;color:#b3d5d2}.key{color:#ffdc87}</style><canvas></canvas><aside><h1>DEPTH STITCH TIDE</h1><p>低解像度の水面を、深度境界で縫い直す実験。ポインタで境界を傾け、クリック／Spaceで潮の記憶を残す。</p><p><span class="key">1</span> low-res <span class="key">2</span> depth guide <span class="key">3</span> stitch confidence <span class="key">4</span> composite</p><p id="readout"></p></aside>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),out=document.querySelector('#readout');let W,H,dpr,mode=4,m={x:.5,y:.45},marks=[];function resize(){dpr=Math.min(2,devicePixelRatio);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>m={x:e.clientX/W,y:e.clientY/H});function mark(){marks.push({x:m.x,y:m.y,t:performance.now()/1000})}addEventListener('pointerdown',mark);addEventListener('keydown',e=>{if('1234'.includes(e.key))mode=+e.key;if(e.code==='Space'){e.preventDefault();mark()}});
function d(v){return Math.max(0,Math.min(1,v))}function loop(now){requestAnimationFrame(loop);let t=now/1000,cols=42,rows=25,cellW=W/cols,cellH=H/rows;g.fillStyle='#061017';g.fillRect(0,0,W,H);let active=0;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let u=(i+.5)/cols,v=(j+.5)/rows,edge=.48+.23*Math.sin(u*5.2+t*.19)+(m.y-.5)*.65+(m.x-.5)*(u-.5)*.7,depth=d((v-edge)*5+.5);let wave=.5+.5*Math.sin(u*15+t*1.6+v*9+Math.sin(u*3-t));let low=Math.floor(wave*4)/3;let confidence=Math.exp(-Math.abs(v-edge)*26);for(const a of marks){let age=t-a.t,rad=Math.hypot(u-a.x,v-a.y);confidence=Math.max(confidence,Math.max(0,1-Math.abs(rad-age*.13)*18)*Math.max(0,1-age/5))}let value=low*(1-confidence)+wave*confidence;if(confidence>.45)active++;
let hue=190+value*46; if(mode===1){g.fillStyle=`hsl(${hue} 62% ${12+low*48}%)`}else if(mode===2){g.fillStyle=`hsl(${depth?43:206} 58% ${20+depth*38}%)`}else if(mode===3){g.fillStyle=`hsl(${confidence*130} 70% ${13+confidence*56}%)`}else{g.fillStyle=`hsl(${hue} ${50+confidence*40}% ${10+value*55}%)`}g.fillRect(i*cellW,j*cellH,cellW+1,cellH+1);
if(mode===4&&confidence>.28){g.strokeStyle=`rgba(235,255,245,${confidence*.45})`;g.strokeRect(i*cellW+.5,j*cellH+.5,cellW,cellH)}}
g.strokeStyle='rgba(255,220,135,.82)';g.lineWidth=1.5;g.beginPath();for(let k=0;k<=120;k++){let u=k/120,yy=(.48+.23*Math.sin(u*5.2+t*.19)+(m.y-.5)*.65+(m.x-.5)*(u-.5)*.7)*H;k?g.lineTo(u*W,yy):g.moveTo(u*W,yy)}g.stroke();marks=marks.filter(a=>t-a.t<5);out.textContent=`mode ${mode} · stitch confidence cells ${active}/${cols*rows}`}
requestAnimationFrame(loop);
</script></html>
