<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiosity Lattice Rehearsal</title>
<style>html,body{margin:0;height:100%;background:#071017;color:#dcecf0;font:12px ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{width:100%;height:100%;display:block}#hud{position:fixed;left:18px;top:16px;letter-spacing:.08em;line-height:1.6;pointer-events:none}b{color:#8ff1cf}small{opacity:.65}</style>
<canvas></canvas><div id="hud"><b>RADIOSITY LATTICE / rehearsal</b><br><span id="readout">move = probe / click or space = solve pulse</span><br><small>1 source · 2 bounce · 3 visibility · 4 composite</small></div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),r=document.querySelector('#readout');let W,H,d=1,px=.5,py=.5,mode=4,pulse=0,history=[];
function size(){d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight});function fire(){pulse=1;history.push({x:px,y:py,t:performance.now()});history=history.slice(-9)}addEventListener('pointerdown',fire);addEventListener('keydown',e=>{if(e.code==='Space')fire();if(+e.key>0&&+e.key<5)mode=+e.key});
function dot(a,b,c,d,e,f,g){const q=x.createRadialGradient(a,b,0,a,b,g);q.addColorStop(0,`hsla(${c},100%,${d}%,${e})`);q.addColorStop(1,`hsla(${c},100%,${d}%,0)`);x.fillStyle=q;x.fillRect(a-g,b-g,g*2,g*2)}
function frame(t){const w=innerWidth,h=innerHeight,tt=t*.001;pulse*=.978;x.fillStyle='#071017';x.fillRect(0,0,w,h);const cols=18,rows=11,s=1+18*pulse; x.globalCompositeOperation='lighter';
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let u=(i+.5)/cols,v=(j+.5)/rows,dist=Math.hypot(u-px,v-py),vis=Math.max(0,1-dist*1.9),wave=.5+.5*Math.sin(tt*2-i*.5+j*.7-dist*11);let e=vis*(.35+.65*wave)+pulse*Math.max(0,1-dist*2.2); if(mode===1)e=vis; if(mode===2)e=wave*(.2+vis); if(mode===3)e=(Math.sin(i*2.8+j*1.4+tt)+1)*.25*vis;dot(u*w,v*h,165+70*wave,42+32*e,.07+e*.25,0,4+s+e*48);}
for(const hst of history){let age=(t-hst.t)/1000;if(age<3){x.strokeStyle=`hsla(38,100%,72%,${.25*(1-age/3)})`;x.lineWidth=1+age*3;x.beginPath();x.arc(hst.x*w,hst.y*h,age*190,0,Math.PI*2);x.stroke()}}
x.globalCompositeOperation='source-over';x.fillStyle='rgba(7,16,23,.35)';x.fillRect(12,h-45,260,28);r.textContent=`probe ${px.toFixed(2)}, ${py.toFixed(2)} · solve energy ${(pulse*100).toFixed(0)}% · pass ${mode}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
