<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bundle Rebuild Ghost Garden</title><style>html,body{margin:0;height:100%;background:#040a0c;overflow:hidden;color:#e4fff3;font:12px ui-monospace,monospace}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:18px;left:18px;line-height:1.6;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #688;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>BUNDLE REBUILD / GHOST GARDEN</b><br>pointer: repair lens　<kbd>1</kbd> shared mesh <kbd>2</kbd> bundle <kbd>3</kbd> ghost <kbd>4</kbd> composite<br>click / space: dispose + rebuild a buffer<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p={x:.5,y:.5},mode=4,repair=0,last=0;function rs(){W=innerWidth;H=innerHeight;let d=devicePixelRatio;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>repair=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')repair=1});
function loop(t){let dt=Math.min(.05,(t-last)/1e3||0);last=t;repair=Math.max(0,repair-dt*.16);let q=t/1e3,b=Math.min(W,H),cx=p.x*W,cy=p.y*H,ok=.25+.75*repair;g.fillStyle='rgba(2,10,12,.16)';g.fillRect(0,0,W,H);for(let i=0;i<54;i++){let a=i*2.399+q*.11,r=b*(.06+(i%9)*.035),x=W*.5+Math.cos(a)*r,y=H*.56+Math.sin(a)*r*.48;if(mode!==2){g.fillStyle=`hsla(${145+i*2},75%,${35+(i%4)*9}%,.75)`;g.beginPath();g.arc(x,y,2+(i%3),0,7);g.fill()}if(mode!==1&&i%3===0){g.strokeStyle=`rgba(115,255,195,${.06+ok*.24})`;g.beginPath();g.moveTo(x,y);g.lineTo(cx,cy);g.stroke()}}if(mode!==1&&mode!==2){for(let j=0;j<7;j++){g.strokeStyle=`rgba(255,153,105,${.25-j*.028})`;g.strokeRect(W*.18+j*W*.045,H*.2+j*H*.035,W*.42,H*.28)}}if(mode===4){let z=g.createRadialGradient(cx,cy,0,cx,cy,b*.22);z.addColorStop(0,'rgba(172,255,219,.22)');z.addColorStop(1,'rgba(172,255,219,0)');g.fillStyle=z;g.fillRect(0,0,W,H)}document.querySelector('#s').textContent=`mode ${mode} · bundle rebuild ${Math.round(ok*100)}% · shared attributes 54 · destroyed buffer ghosts ${Math.round((1-repair)*7)}`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
