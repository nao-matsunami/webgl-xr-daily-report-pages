<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histogram Sky Breath Score</title><style>html,body{margin:0;background:#07101b;color:#e8f1ff;font:12px ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:16px;top:15px;line-height:1.65;pointer-events:none;text-shadow:0 1px 4px #000}b{color:#d9c1ff}kbd{border:1px solid #9b8bbb;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>HISTOGRAM SKY / BREATH SCORE</b><br>pointer: sun &amp; framing　click/Space: camera cut　<kbd>1</kbd> histogram <kbd>2</kbd> adaptation <kbd>3</kbd> sky pass <kbd>4</kbd> composite<br><span id="status"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#status');let mode=4,mx=.5,my=.5,cut=0,exposure=.55,target=.55,last=0;const stars=Array.from({length:160},()=>[Math.random(),Math.random(),Math.random()]);function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});function reset(){cut=1;exposure=target}addEventListener('pointerdown',reset);addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')mode=+e.key;if(e.code==='Space')reset()});
function sun(t){return {x:innerWidth*(.12+.76*mx),y:innerHeight*(.12+.33*my),r:30+55*(1-my)}}function histogram(t){let bins=Array(28).fill(0),u=sun(t);for(let i=0;i<1100;i++){let X=Math.random()*innerWidth,Y=Math.random()*innerHeight;let sky=1-Y/innerHeight*.9,glow=Math.exp(-((X-u.x)**2+(Y-u.y)**2)/55000)*1.6;let v=Math.min(.999,Math.max(.01,sky*.52+glow));bins[Math.min(27,Math.floor(v*28))]++}let lo=7,hi=26,total=0,n=0;bins.forEach((v,i)=>{if(i>=lo&&i<=hi){total+=v*(i+.5)/28;n+=v}});return {bins,mean:total/Math.max(1,n)}}
function drawSky(t,e,alpha=1){let u=sun(t),night=Math.max(0,1-e*1.5);let q=g.createLinearGradient(0,0,0,innerHeight);q.addColorStop(0,`rgba(${Math.round(8+24*e)},${Math.round(20+54*e)},${Math.round(58+95*e)},${alpha})`);q.addColorStop(.62,`rgba(${Math.round(33+92*e)},${Math.round(66+96*e)},${Math.round(105+95*e)},${alpha})`);q.addColorStop(1,`rgba(${Math.round(14+23*e)},${Math.round(29+48*e)},${Math.round(48+55*e)},${alpha})`);g.fillStyle=q;g.fillRect(0,0,innerWidth,innerHeight);g.globalCompositeOperation='screen';stars.forEach(a=>{g.fillStyle=`rgba(216,228,255,${night*a[2]*.8})`;g.fillRect(a[0]*innerWidth,a[1]*innerHeight*.64,1.5,1.5)});let r=g.createRadialGradient(u.x,u.y,2,u.x,u.y,180+70*e);r.addColorStop(0,`rgba(255,244,203,${.85*alpha})`);r.addColorStop(.2,`rgba(255,190,117,${.42*alpha})`);r.addColorStop(1,'rgba(255,148,86,0)');g.fillStyle=r;g.fillRect(u.x-280,u.y-280,560,560);g.globalCompositeOperation='source-over';for(let i=0;i<10;i++){let yy=innerHeight*.52+i*26;g.strokeStyle=`rgba(214,234,255,${.035+i*.005})`;g.beginPath();g.moveTo(0,yy+Math.sin(t*.00035+i)*8);g.bezierCurveTo(innerWidth*.3,yy-13,innerWidth*.7,yy+18,innerWidth,yy);g.stroke()}}
function frame(t){let dt=Math.min(.06,(t-last||16)/1000);last=t;cut*=.94;let h=histogram(t),bright=Math.min(1,Math.max(.07,h.mean*1.65));target=.24+(1-bright)*.9;exposure+=(target-exposure)*dt*(target>exposure?2.7:.8);g.clearRect(0,0,innerWidth,innerHeight);if(mode===1){g.fillStyle='#080b16';g.fillRect(0,0,innerWidth,innerHeight);h.bins.forEach((v,i)=>{let bh=v/28;g.fillStyle=i>=7&&i<=26?'#caa9ff':'#42516b';g.fillRect(i*innerWidth/28,innerHeight-bh,innerWidth/28-2,bh)});g.strokeStyle='#fff2c8';g.beginPath();g.moveTo(h.mean*innerWidth,innerHeight);g.lineTo(h.mean*innerWidth,innerHeight*.48);g.stroke()}else if(mode===2){drawSky(t,.28);g.fillStyle='rgba(5,8,20,.58)';g.fillRect(20,innerHeight-86,innerWidth-40,44);g.fillStyle='#8acfff';g.fillRect(24,innerHeight-72,(innerWidth-48)*exposure,16);g.fillStyle='#ffc480';g.fillRect(24,innerHeight-50,(innerWidth-48)*target,5)}else if(mode===3){drawSky(t,exposure)}else{drawSky(t,exposure);g.globalCompositeOperation='screen';g.fillStyle=`rgba(191,160,255,${cut*.25})`;g.fillRect(0,0,innerWidth,innerHeight);g.globalCompositeOperation='source-over'}s.textContent=`64-bin light estimate · exposure ${exposure.toFixed(2)} → ${target.toFixed(2)} · ${cut>.1?'camera cut / reset':'slow light-to-dark adaptation'} · mode ${mode}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
