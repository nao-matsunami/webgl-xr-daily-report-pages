<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRDF Echo Pulse</title>
<style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#050713}#ui{position:fixed;top:14px;left:16px;color:#dce9ff;font:12px ui-monospace,monospace;line-height:1.65;pointer-events:none}b{color:#f4c277}</style><canvas></canvas><div id="ui"><b>BRDF ECHO PULSE</b><br>move: light direction · click: send a specular pulse<br><span id="state">coverage 1.00</span></div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'), state=document.querySelector('#state');let m={x:.5,y:.5,px:.5,py:.5},pulses=[];
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
addEventListener('pointermove',e=>{m.px=m.x;m.py=m.y;m.x=e.clientX/innerWidth;m.y=e.clientY/innerHeight});addEventListener('pointerdown',e=>pulses.push({x:e.clientX/innerWidth,y:e.clientY/innerHeight,a:1}));
let before=performance.now();function frame(now){let dt=Math.min(.04,(now-before)/1000);before=now;let w=innerWidth,h=innerHeight,v=Math.hypot(m.x-m.px,m.y-m.py),cover=Math.max(.08,1-v*30);state.textContent='coverage '+cover.toFixed(2)+' · BRDF, not screen add';
 x.fillStyle='#050713';x.fillRect(0,0,w,h);let g=x.createRadialGradient(m.x*w,m.y*h,0,m.x*w,m.y*h,Math.max(w,h)*.72);g.addColorStop(0,`rgba(104,193,255,${.38*cover})`);g.addColorStop(.22,`rgba(42,90,190,${.14*cover})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
 for(let j=0;j<34;j++){let yy=(j+.5)/34*h, wave=Math.sin(j*1.9+now*.0012)*18; let spec=Math.pow(Math.max(0,1-Math.abs((m.x*w-(w*.5+wave))/(w*.5))),4)*cover;x.strokeStyle=`rgba(${190+spec*60},${120+spec*90},255,${.04+spec*.42})`;x.lineWidth=1+spec*4;x.beginPath();x.moveTo(0,yy);x.bezierCurveTo(w*.32,yy-wave,w*.65,yy+wave,w,yy);x.stroke()}
 pulses=pulses.filter(o=>(o.a-=dt*.23)>0);for(const o of pulses){let r=(1-o.a)*180+12;x.strokeStyle=`rgba(255,167,82,${o.a})`;x.lineWidth=2;x.beginPath();x.arc(o.x*w,o.y*h,r,0,7);x.stroke()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
