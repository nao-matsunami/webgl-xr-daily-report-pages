<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probe LOD Parallax Score</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#060811;color:#eaf7ff;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:540px;pointer-events:none}.ey{font-size:10px;letter-spacing:.16em;color:#94eaff}.title{margin:7px 0;font-size:clamp(23px,3.7vw,44px);line-height:1.02}.meta{color:#aec4d5}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #365e78;border-radius:999px;color:#c9eefa}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#c5d6e3}</style>
<canvas></canvas><div class="hud"><div class="ey">REFLECTION PROBE × COARSE-FIRST GSPLAT — 27 OCT 2026</div><div class="title">The view arrives<br>before the world does.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: camera / attention</span><span class="tag">click / space: stream beat</span><span class="tag">1–4: isolate passes</span></div></div><div class="keys">1 probe &nbsp; 2 parallax &nbsp; 3 LOD arrival &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let mx=.5,my=.5,mode=4,beat=0,last=0;function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(e.key===' ')beat=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1e3||0);last=t;beat*=Math.exp(-dt*1.25);let w=innerWidth,h=innerHeight,T=t/1000,cx=w*(.5+(mx-.5)*.20),cy=h*(.53+(my-.5)*.16),show=n=>mode===4||mode===n;g.fillStyle='#060811';g.fillRect(0,0,w,h);let horizon=h*.59;if(show(1)){for(let j=0;j<8;j++){let r=(j+1)*Math.min(w,h)*.09+Math.sin(T*.7+j)*5;g.strokeStyle=`hsla(${185+j*9},80%,62%,${.10+j*.012})`;g.lineWidth=1;g.beginPath();g.ellipse(cx,cy,r*1.38,r*.62,0,0,7);g.stroke()}}if(show(2)){for(let i=0;i<45;i++){let a=i*2.399+T*.06,q=(i%9)/8,px=cx+Math.cos(a)*(65+i*8)*(1+(mx-.5)*.4),py=cy+Math.sin(a)*(35+i*4)*(1+(my-.5)*.22);g.strokeStyle=`rgba(130,215,255,${.05+q*.17})`;g.beginPath();g.moveTo(px,py);g.lineTo(px+(mx-.5)*55,py+(my-.5)*34);g.stroke()}}if(show(3)){for(let i=0;i<180;i++){let seed=i*13.37,rank=(Math.sin(seed)+1)/2,arrival=Math.max(0,Math.min(1,(T*.22+beat*.55-rank*.78)));let px=(seed*73%w),py=horizon+Math.sin(seed*2.7)*h*.30;let near=1-Math.min(1,Math.hypot(px-w*mx,py-h*my)/(w*.58));let s=(1+near*3)*arrival;if(s>.02){g.fillStyle=`hsla(${198+near*80},95%,${46+near*30}%,${.08+arrival*.72})`;g.beginPath();g.arc(px,py,s*2.2,0,7);g.fill()}}}if(show(4)){let z=g.createRadialGradient(w*mx,h*my,2,w*mx,h*my,Math.min(w,h)*.42);z.addColorStop(0,`rgba(255,190,120,${.16+beat*.24})`);z.addColorStop(.4,'rgba(74,159,255,.07)');z.addColorStop(1,'rgba(6,8,17,0)');g.fillStyle=z;g.fillRect(0,0,w,h)}g.strokeStyle='rgba(230,248,255,.35)';g.setLineDash([3,7]);g.beginPath();g.moveTo(0,horizon);g.lineTo(w,horizon);g.stroke();g.setLineDash([]);document.querySelector('#meta').textContent=`camera ${Math.round(mx*100)} / ${Math.round(my*100)} · probe ${mode===4?'composite':mode} · coarse-first arrival ${Math.round((1-beat*.25)*100)}% · stream beat ${Math.round(beat*100)}%`};requestAnimationFrame(loop);
</script></html>
