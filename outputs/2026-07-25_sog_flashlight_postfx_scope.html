<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOG Flashlight PostFX Scope</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050607;
      color: #edf7f4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 16px;
      top: 14px;
      max-width: min(620px, calc(100vw - 32px));
      font-size: 12px;
      line-height: 1.45;
      color: rgba(237, 247, 244, 0.86);
      text-shadow: 0 1px 14px #000;
      pointer-events: none;
    }
    .hud b { color: #fff; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <b>SOG Flashlight PostFX Scope</b><br />
    pointer: view flashlight / hold: proxy relight coverage / F: fisheye + radial sort / Space: resize pressure
  </div>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: false, alpha: false });

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;
      uniform vec2 resolution;
      uniform vec2 pointer;
      uniform vec2 history;
      uniform float time;
      uniform float hold;
      uniform float pulse;
      uniform float fisheye;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(41.7, 289.3))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float ring(float d, float r, float w) {
        return 1.0 - smoothstep(0.0, w, abs(d - r));
      }

      vec2 warp(vec2 uv, float amount) {
        vec2 p = uv * 2.0 - 1.0;
        p.x *= resolution.x / resolution.y;
        float r = length(p);
        p /= 1.0 + amount * 0.58 * r * r;
        p.x /= resolution.x / resolution.y;
        return p * 0.5 + 0.5;
      }

      vec3 grade(float v) {
        return 0.5 + 0.5 * cos(6.28318 * (vec3(0.04, 0.26, 0.57) + v));
      }

      void main() {
        vec2 rawUv = gl_FragCoord.xy / resolution.xy;
        vec2 uv = warp(rawUv, fisheye);
        vec2 p = uv * 2.0 - 1.0;
        p.x *= resolution.x / resolution.y;
        vec2 m = pointer * 2.0 - 1.0;
        m.x *= resolution.x / resolution.y;
        vec2 h = history * 2.0 - 1.0;
        h.x *= resolution.x / resolution.y;

        vec2 g = floor((uv + vec2(time * 0.012, 0.0)) * vec2(22.0, 13.0));
        vec2 cell = fract((uv + vec2(time * 0.012, 0.0)) * vec2(22.0, 13.0)) - 0.5;
        float id = hash(g);
        float depth = 0.2 + 0.8 * noise(g * 0.31);
        float splat = exp(-dot(cell, cell) * mix(14.0, 58.0, depth));
        splat *= smoothstep(0.1, 0.86, id + noise(g + time * 0.2) * 0.38);

        float dView = length(p - m);
        float flashlight = smoothstep(0.58, 0.08, dView);
        float hardBeam = smoothstep(0.19, 0.13, dView);
        float proxy = smoothstep(0.82, 0.2, abs(p.y - 0.24 * sin(p.x * 2.7 + time * 0.65)));
        float proxyCoverage = proxy * (0.3 + 0.7 * smoothstep(0.85, 0.15, length(p - m * 0.65)));
        float relight = mix(flashlight, proxyCoverage, hold);

        float sortLag = ring(length(p - h), 0.29 + hold * 0.08, 0.018);
        float radialBenefit = fisheye * smoothstep(0.42, 1.05, length(p));
        float lagRisk = smoothstep(0.55, 1.0, abs(sin(time * 0.45 + id * 7.0)) + hold * 0.42) * (1.0 - radialBenefit);
        float postOnlyLeak = flashlight * (1.0 - proxyCoverage) * (0.4 + 0.6 * noise(p * 7.0 + time));

        vec3 base = grade(depth + id * 0.2) * splat;
        vec3 lit = base * (0.18 + 1.45 * relight);
        vec3 col = vec3(0.018, 0.024, 0.026) + lit;
        col += vec3(1.0, 0.74, 0.34) * hardBeam * splat * (1.0 - hold) * 0.55;
        col += vec3(0.35, 1.0, 0.72) * proxyCoverage * hold * splat * 0.7;
        col += vec3(1.0, 0.2, 0.14) * lagRisk * splat * 0.9;
        col += vec3(0.9, 0.28, 1.0) * postOnlyLeak * 0.22;
        col += vec3(0.95, 0.82, 0.45) * sortLag;
        col += vec3(0.28, 0.86, 1.0) * radialBenefit * ring(length(p), 0.88, 0.012);
        col += vec3(1.0, 0.22, 0.55) * pulse * exp(-18.0 * abs(rawUv.y - 0.9));

        float vignette = smoothstep(1.36, 0.28, length(p));
        col *= vignette;
        col += vec3(0.02, 0.03, 0.032) * (1.0 - vignette);
        gl_FragColor = vec4(pow(col, vec3(0.92)), 1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      history: gl.getUniformLocation(program, "history"),
      time: gl.getUniformLocation(program, "time"),
      hold: gl.getUniformLocation(program, "hold"),
      pulse: gl.getUniformLocation(program, "pulse"),
      fisheye: gl.getUniformLocation(program, "fisheye")
    };
    const state = { pointer: [0.5, 0.52], history: [0.5, 0.52], hold: 0, pulse: 0, fisheye: 0 };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        state.pulse = 1;
      }
    }

    window.addEventListener("pointermove", (event) => {
      state.pointer[0] = event.clientX / window.innerWidth;
      state.pointer[1] = 1 - event.clientY / window.innerHeight;
    });
    window.addEventListener("pointerdown", () => { state.hold = 1; });
    window.addEventListener("pointerup", () => { state.hold = 0; });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") state.pulse = 1;
      if (event.key.toLowerCase() === "f") state.fisheye = state.fisheye > 0.5 ? 0 : 1;
    });

    function frame(now) {
      resize();
      const t = now * 0.001;
      state.history[0] += (state.pointer[0] - state.history[0]) * 0.035;
      state.history[1] += (state.pointer[1] - state.history[1]) * 0.035;
      state.pulse *= 0.93;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, state.pointer[0], state.pointer[1]);
      gl.uniform2f(uniforms.history, state.history[0], state.history[1]);
      gl.uniform1f(uniforms.time, t);
      gl.uniform1f(uniforms.hold, state.hold);
      gl.uniform1f(uniforms.pulse, state.pulse);
      gl.uniform1f(uniforms.fisheye, state.fisheye);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
