const c=document.querySelector('canvas'),g=c.getContext('webgl'),o=document.querySelector('#readout');if(!g)document.body.innerHTML='WebGL が必要です';const V=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`,F=`precision highp float;uniform vec2 r,m;uniform float t,k;float sdC(vec2 p,float a){return length(p)-a;}float sdB(vec2 p,vec2 b){p=abs(p)-b;return length(max(p,0.))+min(max(p.x,p.y),0.);}float s(float d){return smoothstep(.012,-.012,d);}void main(){vec2 u=(gl_FragCoord.xy-.5*r)/r.y, q=m-.5*r/r.y;float angle=t*.23;mat2 R=mat2(cos(angle),-sin(angle),sin(angle),cos(angle));float a=sdC(R*(u+vec2(.18*sin(t*.4),.03)),.23+.04*sin(t));float b=sdB(R*(u-vec2(.17,.02*cos(t*.6))),vec2(.22,.12));float seam=dot(u-q,vec2(cos(t*.31),sin(t*.31)))+.13*sin(u.y*8.+t*.7);float blend=smoothstep(-.16,.16,seam);float shape=mix(a,b,blend);float edge=s(shape);float line=exp(-42.*abs(shape));float cut=exp(-28.*abs(seam))*(.35+.65*k);float glow=exp(-7.*abs(shape));vec3 bg=vec3(.025,.008,.055)+.025*sin(vec3(2.,3.,5.)+u.xyx*8.);vec3 A=vec3(.2,.95,.82),B=vec3(.95,.18,.63);vec3 col=bg;col+=mix(A,B,blend)*(edge*.7+glow*.22);col+=vec3(1.,.72,.94)*cut*.48;col+=vec3(.75,.95,1.)*line*.35;col*=1.-smoothstep(.45,1.05,length(u));gl_FragColor=vec4(col,1.);}`;function S(x,y){let z=g.createShader(x);g.shaderSource(z,y);g.compileShader(z);if(!g.getShaderParameter(z,g.COMPILE_STATUS))throw g.getShaderInfoLog(z);return z}let P=g.createProgram();g.attachShader(P,S(g.VERTEX_SHADER,V));g.attachShader(P,S(g.FRAGMENT_SHADER,F));g.linkProgram(P);g.useProgram(P);let B=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,B);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,0,0,0);let U=Object.fromEntries(['r','m','t','k'].map(x=>[x,g.getUniformLocation(P,x)])),x=.5,y=.5,keep=0;function z(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}ad
