<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflection Relay Score</title><style>html,body{margin:0;height:100%;background:#04070c;overflow:hidden;color:#dcecff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:18px;left:18px;line-height:1.55;text-shadow:0 2px 9px #000;max-width:390px}b{color:#fff}kbd{border:1px solid #668;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>REFLECTION RELAY / PMREM SCORE</b><br>pointer: light / reflection origin　<kbd>1</kbd> source <kbd>2</kbd> relay <kbd>3</kbd> material <kbd>4</kbd> composite<br>click / space: reconnect environment light<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p={x:.5,y:.5},mode=4,pulse=0,last=0;
function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')pulse=1});
function glow(x,y,r,col,a=1){let q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,col.replace('A',a));q.addColorStop(1,col.replace('A',0));g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function loop(t){let dt=Math.min(.05,t-last||0);last=t;pulse=Math.max(0,pulse-dt*.28);let q=t*.001,cx=p.x*W,cy=p.y*H,base=Math.min(W,H),e=.22+.78*pulse;
g.fillStyle='rgba(3,6,12,.17)';g.fillRect(0,0,W,H);let rows=10,cols=18;
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let px=(x+.5)*W/cols,py=(y+.5)*H/rows,d=Math.hypot(px-cx,py-cy)/base,arrival=Math.max(0,1-d*2.4),tw=.5+.5*Math.sin(q*2+x*.8+y);let a=(mode===1?.04:.10)*arrival+(mode===2?.21:0)+e*.15*arrival;g.fillStyle=`hsla(${185+x*5+y*3},85%,${30+arrival*55}%,${a})`;g.fillRect(px-W/cols*.42,py-H/rows*.34,W/cols*.84,H/rows*.68)}
if(mode!==1){for(let i=0;i<5;i++){let r=base*(.08+i*.105)+pulse*base*.21, a=(mode===2?.5:.15)*(1-i/7);g.strokeStyle=`hsla(${190+i*18},92%,72%,${a})`;g.lineWidth=1.2;g.beginPath();g.arc(cx,cy,r,-q*.25+i,Math.PI*1.45-q*.25+i);g.stroke()}}
if(mode!==2){let ox=W*.5,oy=H*.57,rad=base*.19;g.save();g.translate(ox,oy);g.rotate(q*.16);let m=g.createLinearGradient(-rad,-rad,rad,rad);m.addColorStop(0,'rgba(190,250,255,.95)');m.addColorStop(.38,'rgba(45,98,154,.55)');m.addColorStop(1,'rgba(255,166,98,.75)');g.fillStyle=m;g.beginPath();g.arc(0,0,rad,0,7);g.fill();g.globalCompositeOperation='screen';for(let i=0;i<9;i++){g.strokeStyle=`hsla(${190+i*17},95%,80%,${.12+e*.16})`;g.beginPath();g.arc(0,0,rad*(.22+i*.09),0,Math.PI*2);g.stroke()}g.restore()}
if(mode===3||mode===4){glow(cx,cy,base*(.08+e*.16),'rgba(255,220,165,A)');g.strokeStyle=`rgba(255,237,196,${.35+e*.6})`;g.beginPath();g.moveTo(cx,cy);g.lineTo(W*.5,H*.57);g.stroke()}
document.querySelector('#s').textContent=`mode ${mode} · env relay ${Math.round(18+82*e)}% · PMREM bands ${Math.round(4+e*8)} · luminance ${Math.round(10+e*165)}`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
