<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storage Struct Pulse Field</title>
<style>html,body{margin:0;height:100%;background:#0b0814;color:#eee5ff;font:12px ui-monospace,monospace;overflow:hidden}canvas{display:block;width:100%;height:100%}#t{position:fixed;left:18px;top:16px;line-height:1.6;letter-spacing:.08em}b{color:#fb91ff}small{opacity:.62}</style><canvas></canvas><div id="t"><b>STORAGE STRUCT / pulse field</b><br><span id="s">move = write head / click or space = commit</span><br><small>1 records · 2 lanes · 3 cache · 4 composite</small></div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s');let d,W,H,mx=.5,my=.5,mode=4,beats=[];function resize(){d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});function hit(){beats.push({x:mx,y:my,t:performance.now()});beats=beats.slice(-16)}addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space')hit();if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){let w=innerWidth,h=innerHeight;g.fillStyle='#0b0814';g.fillRect(0,0,w,h);g.globalCompositeOperation='screen';for(let row=0;row<9;row++)for(let col=0;col<26;col++){let u=(col+.5)/26,v=(row+.5)/9,near=Math.max(0,1-Math.hypot(u-mx,v-my)*2.3),scan=.5+.5*Math.sin(t*.003-col*.7+row*.8),a=(.08+near*.65)*scan;if(mode===1)a=near*.8;if(mode===2)a=scan*.42;if(mode===3)a=near*scan*.7;g.fillStyle=`hsla(${285+near*45},90%,${45+near*35}%,${a})`;g.fillRect(u*w-5,v*h-5,10+near*15,10+near*15)}for(let b of beats){let q=(t-b.t)/1000;if(q<2.7){g.strokeStyle=`hsla(315,100%,70%,${.38*(1-q/2.7)})`;g.lineWidth=2;g.beginPath();g.arc(b.x*w,b.y*h,20+q*290,0,6.283);g.stroke()}}g.globalCompositeOperation='source-over';s.textContent=`write head ${mx.toFixed(2)}, ${my.toFixed(2)} · commits ${beats.length} · view ${mode}`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
