<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catmull Reflection Weather Score</title><style>html,body{margin:0;background:#07101b;color:#dcecff;font:12px ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:16px;top:15px;line-height:1.65;pointer-events:none}b{color:#9deaff}kbd{border:1px solid #678;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>CATMULL REFLECTION / WEATHER SCORE</b><br>pointer: camera drift　click/Space: weather cut　<kbd>1</kbd> source <kbd>2</kbd> history <kbd>3</kbd> cloud cache <kbd>4</kbd> composite<br><span id="status"></span></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let W,H,mode=4,px=.5,py=.5,pulse=0,history=[],clouds=[];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
for(let i=0;i<44;i++)clouds.push({x:Math.random(),y:.06+Math.random()*.33,r:50+Math.random()*170,v:.1+Math.random()*.5});
addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')mode=+e.key;if(e.code==='Space')pulse=1});
function sky(t,sharp,alpha=1){let g=x.createLinearGradient(0,0,0,innerHeight*.58);g.addColorStop(0,`rgba(9,27,55,${alpha})`);g.addColorStop(.55,`rgba(${Math.round(31+45*sharp)},${Math.round(86+55*sharp)},${Math.round(123+65*sharp)},${alpha})`);g.addColorStop(1,`rgba(255,166,104,${alpha})`);x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight*.58);let sunX=innerWidth*(.14+.72*px),sunY=innerHeight*(.13+.15*py);let r=x.createRadialGradient(sunX,sunY,1,sunX,sunY,180);r.addColorStop(0,`rgba(255,243,198,${alpha})`);r.addColorStop(1,'rgba(255,205,120,0)');x.fillStyle=r;x.fillRect(0,0,innerWidth,innerHeight*.58);x.filter=sharp>.7?'blur(1px)':'blur(11px)';clouds.forEach(q=>{let cx=(q.x*innerWidth+t*q.v*18)% (innerWidth+q.r*2)-q.r;let cg=x.createRadialGradient(cx,q.y*innerHeight,4,cx,q.y*innerHeight,q.r);cg.addColorStop(0,`rgba(236,246,255,${.22*alpha})`);cg.addColorStop(1,'rgba(220,235,255,0)');x.fillStyle=cg;x.fillRect(cx-q.r,q.y*innerHeight-q.r,q.r*2,q.r*2)});x.filter='none'}
function water(t,sharp){let y=innerHeight*.58;let g=x.createLinearGradient(0,y,0,innerHeight);g.addColorStop(0,'#1b6f88');g.addColorStop(1,'#061721');x.fillStyle=g;x.fillRect(0,y,innerWidth,innerHeight-y);x.save();x.beginPath();for(let j=0;j<70;j++){let yy=y+j*8;let drift=(px-.5)*j*1.2;for(let i=0;i<90;i++){let xx=i*innerWidth/89;let wave=Math.sin(xx*.023+t*.0019+j*.42)*3+Math.sin(xx*.009-t*.0011)*5;x.fillStyle=`hsla(${184+j*.45},65%,${38+sharp*26+j*.05}%,${.10+sharp*.16})`;x.fillRect(xx+drift,yy+wave,innerWidth/80,1)}}x.restore();x.globalCompositeOperation='screen';x.fillStyle='rgba(255,195,128,.23)';x.fillRect(0,y,innerWidth,3);x.globalCompositeOperation='source-over'}
function frame(t){pulse*=.94;let moving=Math.hypot(px-.5,py-.5);let sharp=Math.max(.12,1-moving*1.3-pulse*.65);x.clearRect(0,0,innerWidth,innerHeight);if(mode===1){sky(t,1);water(t,1)}else if(mode===2){history.slice(-8).forEach((h,i)=>{x.globalAlpha=.055+i*.025;sky(h,.25);water(h,.25)});x.globalAlpha=1}else if(mode===3){x.fillStyle='#0a1624';x.fillRect(0,0,innerWidth,innerHeight);sky(t,.16,.78);x.strokeStyle='rgba(148,222,255,.28)';clouds.forEach(q=>{x.strokeRect((q.x*innerWidth+t*q.v*18)%(innerWidth+q.r*2)-q.r,q.y*innerHeight-q.r,q.r*2,q.r*2)})}else{history.slice(-5).forEach((h,i)=>{x.globalAlpha=.05+i*.035;sky(h,.25);water(h,.25)});x.globalAlpha=1;sky(t,sharp);water(t,sharp)}history.push(t);if(history.length>12)history.shift();s.textContent=`history ${history.length}/12 · sharpness ${sharp.toFixed(2)} · mode ${mode} · ${pulse>.1?'RESET / weather cut':'settling'}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
