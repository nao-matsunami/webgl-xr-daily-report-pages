<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion History Lantern Weave</title><style>html,body{margin:0;overflow:hidden;background:#07111e;color:#d9edff;font:12px ui-monospace,monospace}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;inset:18px auto auto 18px;pointer-events:none;text-shadow:0 1px 8px #000}b{color:#ffd78a}small{opacity:.7}</style><canvas></canvas><div id="ui"><b>MOTION / HISTORY LANTERN WEAVE</b><br>pointer: current surface &nbsp; click: plant a warm impulse<br><small>cyan = current motion / amber = preserved history / white = confidence seam</small></div><script>
const c=document.querySelector('canvas'),gl=c.getContext('webgl2',{preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='WebGL2 が必要です';throw 0} let W=0,H=0,front=0,mouse=[.5,.5],clicks=[];
const vs=`#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es\nprecision highp float;in vec2 uv;out vec4 o;uniform sampler2D prev;uniform vec2 res,mouse;uniform float t;uniform vec3 seeds[12];
float ring(vec2 p,float r,float w){return smoothstep(w,0.,abs(length(p)-r));}
void main(){vec2 p=(uv-.5)*vec2(res.x/res.y,1.);vec2 m=(mouse-.5)*vec2(res.x/res.y,1.);vec2 q=p-m;float wave=ring(q,.08+.025*sin(t*2.),.006);float flow=ring(p, .27+.03*sin(t*.7+p.y*8.),.003);vec3 cur=vec3(.05,.7,1.)*(wave+flow*.45);float confidence=1.-smoothstep(.06,.25,length(q));vec2 drift=vec2(.0015*sin(t+p.y*9.),.001*cos(t*.8+p.x*7.))*(1.-confidence);vec3 hist=texture(prev,uv-drift).rgb*(.968+.027*confidence);for(int i=0;i<12;i++){if(seeds[i].z>0.){float d=length(p-seeds[i].xy);float a=exp(-d*d*110.)*seeds[i].z;cur+=vec3(1.,.34,.05)*a;}}vec3 seam=vec3(1.)*wave*confidence*.6;o=vec4(max(hist,cur)+seam,1.);}`;
const show=`#version 300 es\nprecision highp float;in vec2 uv;out vec4 o;uniform sampler2D tex;void main(){vec3 x=texture(tex,uv).rgb;o=vec4(1.-exp(-x*1.45),1.);}`;
function sh(type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}function prog(f){let p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);return p}const update=prog(fs),present=prog(show),vao=gl.createVertexArray();gl.bindVertexArray(vao);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let loc=gl.getAttribLocation(update,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
let tex=[],fb=[];function resize(){let d=Math.min(devicePixelRatio,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d;for(let i=0;i<2;i++){tex[i]&&gl.deleteTexture(tex[i]);tex[i]=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex[i]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,W,H,0,gl.RGBA,gl.HALF_FLOAT,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);fb[i]??=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb[i]);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex[i],0)}}addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>mouse=[e.clientX/innerWidth,1-e.clientY/innerHeight]);addEventListener('pointerdown',e=>{let x=(e.clientX/innerWidth-.5)*W/H,y=.5-e.clientY/innerHeight;clicks.unshift([x,y,1]);clicks=clicks.slice(0,12)});
function frame(ms){let t=ms*.001;clicks.forEach(a=>a[2]*=.992);gl.useProgram(update);gl.bindFramebuffer(gl.FRAMEBUFFER,fb[1-front]);gl.viewport(0,0,W,H);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[front]);gl.uniform1i(gl.getUniformLocation(update,'prev'),0);gl.uniform2f(gl.getUniformLocation(update,'res'),W,H);gl.uniform2f(gl.getUniformLocation(update,'mouse'),...mouse);gl.uniform1f(gl.getUniformLocation(update,'t'),t);gl.uniform3fv(gl.getUniformLocation(update,'seeds'),new Float32Array(36).map((_,i)=>clicks[(i/3|0)]?.[i%3]||0));gl.drawArrays(gl.TRIANGLES,0,3);front=1-front;gl.useProgram(present);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.bindTexture(gl.TEXTURE_2D,tex[front]);gl.uniform1i(gl.getUniformLocation(present,'tex'),0);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
