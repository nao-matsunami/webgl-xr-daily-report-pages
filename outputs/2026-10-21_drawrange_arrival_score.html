<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draw Range Arrival Score</title><style>html,body{margin:0;height:100%;background:#05070f;overflow:hidden;color:#e8f5ff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#ui{position:fixed;left:18px;top:18px;line-height:1.65;text-shadow:0 2px 8px #000}b{color:#fff}kbd{border:1px solid #677;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>DRAW RANGE / ARRIVAL SCORE</b><br>pointer: edit frontier　<kbd>1</kbd> reservoir <kbd>2</kbd> range <kbd>3</kbd> share <kbd>4</kbd> composite<br>click / space: dispatch an arrival cut<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s');let W,H,d,mode=4,p={x:.5,y:.5},pulse=0,last=0;const dots=Array.from({length:420},(_,i)=>({a:i*2.399,r:.08+.86*((i*47)%419)/419,z:(i%17)/17}));
function rs(){W=innerWidth;H=innerHeight;d=devicePixelRatio;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>pulse=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')pulse=1});
function loop(t){let dt=Math.min(.05,(t-last)/1e3||0);last=t;pulse=Math.max(0,pulse-dt*.26);const q=t/1e3,b=Math.min(W,H),cx=W*.5,cy=H*.53,front=p.x*.92+.04,cut=front+.16*pulse;g.fillStyle='rgba(3,5,14,.22)';g.fillRect(0,0,W,H);
if(mode!==2){g.strokeStyle='rgba(92,133,170,.18)';for(let r=.14;r<.55;r+=.07){g.beginPath();g.ellipse(cx,cy,b*r,b*r*.48,0,0,7);g.stroke()}}
if(mode!==1){g.save();g.beginPath();g.rect(0,0,W*cut,H);g.clip();for(let i=0;i<dots.length;i++){let o=dots[i],a=o.a+q*.12,x=cx+Math.cos(a)*b*o.r*.64,y=cy+Math.sin(a)*b*o.r*.31+Math.sin(q+o.a)*b*.025;let hot=o.r<front?1:0;g.fillStyle=hot?`hsla(${185+o.z*70},95%,${52+30*pulse}%,${.3+.62*hot})`:'rgba(91,122,146,.13)';g.beginPath();g.arc(x,y,1.1+hot*2.7+pulse*2,0,7);g.fill()}g.restore()}
if(mode!==1&&mode!==2){let x=W*cut;g.strokeStyle='rgba(255,198,102,.9)';g.setLineDash([6,7]);g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();g.setLineDash([]);for(let j=0;j<9;j++){let yy=H*.19+j*H*.07;g.strokeStyle=`rgba(255,156,80,${.1+.24*pulse})`;g.beginPath();g.moveTo(x-b*.16,yy);g.quadraticCurveTo(x,yy-b*.1*Math.sin(q+j),x+b*.16,yy);g.stroke()}}
if(mode===4){let v=g.createRadialGradient(W*cut,cy,0,W*cut,cy,b*.34);v.addColorStop(0,'rgba(255,150,72,.22)');v.addColorStop(1,'rgba(255,150,72,0)');g.fillStyle=v;g.fillRect(0,0,W,H)}s.textContent=`mode ${mode} · draw range ${Math.round(front*420)}/420 · shared geometry lanes 9 · arrival ${Math.round(pulse*100)}%`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
