<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Drawer Afterglow</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0a0711;color:#fff3fb;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:490px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.17em;color:#f2a5d2}.title{margin:7px 0;font-size:clamp(22px,3.5vw,42px);line-height:1.02}.meta{color:#ceb9c9}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #714362;border-radius:999px;color:#ffc8e6}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#dfbdd4}</style>
<canvas></canvas><div class="hud"><div class="eyebrow">GPU-DRIVEN DRAWER / VISIBILITY STUDY — 25 OCT 2026</div><div class="title">The unseen becomes a soft<br>afterglow, not a missing frame.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: attention lens</span><span class="tag">click / space: dispatch beat</span><span class="tag">1–4: isolate pass</span></div></div><div class="keys">1 candidates &nbsp; 2 visible &nbsp; 3 afterglow &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,beat=0,last=0;function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',()=>beat=1);addEventListener('keydown',e=>{if(e.key===' ')beat=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function f(t){requestAnimationFrame(f);const dt=Math.min(.05,(t-last)/1000||0);last=t;beat*=Math.exp(-dt*1.8);let w=innerWidth,h=innerHeight,T=t*.001,cx=w*x,cy=h*y,R=Math.min(w,h)*(.16+.22*(1-y)),show=n=>mode===4||mode===n;g.fillStyle='#0a0711';g.fillRect(0,0,w,h);let drawn=0;
for(let i=0;i<230;i++){let a=i*2.399+T*.13,r=18+Math.sqrt(i)*15,px=w*.5+Math.cos(a)*r*1.28,py=h*.55+Math.sin(a)*r*.72,hit=Math.hypot(px-cx,py-cy)<R,live=hit||(i%9===0);if(show(1)){g.fillStyle='rgba(151,105,162,.28)';g.fillRect(px-1,py-1,2,2)}if(show(2)&&live){drawn++;g.fillStyle=hit?'rgba(255,229,142,.92)':'rgba(255,118,194,.48)';g.beginPath();g.arc(px,py,hit?2.5:1.4,0,7);g.fill()}if(show(3)&&!live){g.strokeStyle=`rgba(126,214,255,${.08+beat*.42})`;g.beginPath();g.arc(px,py,5+beat*14,0,7);g.stroke()}}
if(show(3)){g.strokeStyle='rgba(255,204,232,.7)';g.setLineDash([6,8]);g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();g.setLineDash([])}if(show(4)){let q=g.createRadialGradient(cx,cy,3,cx,cy,R*2.5);q.addColorStop(0,'rgba(255,215,145,.15)');q.addColorStop(.45,'rgba(253,84,172,.05)');q.addColorStop(1,'rgba(10,7,17,0)');g.fillStyle=q;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`attention radius ${Math.round(R)} · candidates 230 · drawn ${drawn} · deferred ${230-drawn} · ${['CANDIDATES','VISIBLE','AFTERGLOW','COMPOSITE'][mode-1]}`};requestAnimationFrame(f);
</script></html>
