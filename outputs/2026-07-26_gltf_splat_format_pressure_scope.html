<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glTF Splat Format Pressure Scope</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07100f;
      color: #dbe9e5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      left: 18px;
      top: 16px;
      max-width: min(560px, calc(100vw - 36px));
      line-height: 1.45;
      font-size: 12px;
      color: rgba(219, 233, 229, 0.88);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }

    .hud strong {
      display: block;
      margin-bottom: 5px;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 0;
    }

    .keys {
      position: fixed;
      right: 16px;
      bottom: 14px;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(219, 233, 229, 0.74);
      text-align: right;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <strong>glTF / SOG / SPZ format pressure scope</strong>
    Pointer = inspection lens. Hold = relight coverage. F = fisheye stress. Space = 8K/export pressure pulse.
  </div>
  <div class="keys">GLB/KHR · SOG stream · SPZ compressed · HTML/MSDF labels</div>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2 resolution;
    uniform vec2 pointer;
    uniform float time;
    uniform float hold;
    uniform float fisheye;
    uniform float pulse;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float gaussian(vec2 p, vec2 c, vec2 s, float a) {
      vec2 d = (p - c) / s;
      return exp(-dot(d, d) * a);
    }

    float segment(vec2 p, vec2 a, vec2 b, float w) {
      vec2 pa = p - a;
      vec2 ba = b - a;
      float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
      return smoothstep(w, 0.0, length(pa - ba * h));
    }

    float glyph(vec2 p, float id) {
      p = p * 2.0 - 1.0;
      float g = 0.0;
      if (id < 0.5) {
        g += segment(p, vec2(-0.55, 0.0), vec2(-0.05, 0.48), 0.06);
        g += segment(p, vec2(-0.05, 0.48), vec2(0.55, -0.36), 0.06);
        g += segment(p, vec2(-0.22, 0.05), vec2(0.35, 0.05), 0.045);
      } else if (id < 1.5) {
        g += segment(p, vec2(-0.50, 0.50), vec2(-0.50, -0.50), 0.055);
        g += segment(p, vec2(-0.50, 0.50), vec2(0.36, 0.38), 0.055);
        g += segment(p, vec2(-0.50, 0.0), vec2(0.30, -0.04), 0.055);
        g += segment(p, vec2(-0.50, -0.50), vec2(0.42, -0.42), 0.055);
      } else {
        g += segment(p, vec2(-0.48, 0.44), vec2(0.45, 0.44), 0.055);
        g += segment(p, vec2(-0.45, -0.42), vec2(0.48, -0.42), 0.055);
        g += segment(p, vec2(0.45, 0.44), vec2(-0.45, -0.42), 0.055);
      }
      return clamp(g, 0.0, 1.0);
    }

    vec3 palette(float t) {
      vec3 a = vec3(0.08, 0.17, 0.16);
      vec3 b = vec3(0.86, 0.67, 0.33);
      vec3 c = vec3(0.18, 0.66, 0.72);
      vec3 d = vec3(0.84, 0.22, 0.35);
      return mix(mix(a, c, smoothstep(0.0, 0.7, t)), mix(b, d, smoothstep(0.55, 1.0, t)), t * 0.75);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec2 p = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
      vec2 m = (pointer * 2.0 - 1.0) * vec2(resolution.x / min(resolution.x, resolution.y), resolution.y / min(resolution.x, resolution.y));

      float lens = smoothstep(0.34, 0.05, length(p - m));
      float fisheyeWarp = fisheye * smoothstep(0.15, 1.25, length(p));
      vec2 q = p * (1.0 + fisheyeWarp * dot(p, p) * 0.38);

      float lane = floor(uv.x * 4.0);
      float laneUv = fract(uv.x * 4.0);
      float laneMask = smoothstep(0.012, 0.0, abs(laneUv - 0.5) - 0.485);
      vec2 local = vec2(laneUv, uv.y);

      float field = 0.0;
      float aaMismatch = 0.0;
      float streamRisk = 0.0;
      for (int i = 0; i < 52; i++) {
        float fi = float(i);
        vec2 seed = vec2(hash(vec2(fi, lane + 1.0)), hash(vec2(fi + 9.0, lane + 4.0)));
        vec2 c = vec2(0.09 + 0.82 * seed.x, 0.10 + 0.80 * seed.y);
        c.x += sin(time * 0.18 + fi * 1.7 + lane) * 0.018;
        float detail = mix(0.018, 0.052, hash(seed + lane));
        float compression = lane == 1.0 ? 1.35 : (lane == 2.0 ? 0.72 : 1.0);
        float g = gaussian(local, c, vec2(detail * compression, detail * 0.68), 1.35);
        field += g * mix(0.08, 0.22, hash(seed * 3.1));
        aaMismatch += g * smoothstep(0.28, 0.82, abs(sin(fi * 2.3 + time + lane)));
        streamRisk += g * smoothstep(0.18, 0.72, hash(seed * 6.0 + floor(time * 0.5)));
      }
      field = clamp(field, 0.0, 1.0);
      aaMismatch = clamp(aaMismatch * (lane == 0.0 ? 0.78 : 0.35), 0.0, 1.0);
      streamRisk = clamp(streamRisk * (lane == 1.0 ? 0.9 : 0.24), 0.0, 1.0);

      float relightCoverage = smoothstep(0.44, 0.02, abs(length(q - m) - 0.42));
      relightCoverage += 0.45 * smoothstep(0.52, 0.12, length(q - (m + vec2(0.16, -0.12))));
      relightCoverage = clamp(relightCoverage * (0.3 + 0.7 * hold), 0.0, 1.0);

      float exportPressure = smoothstep(0.98, 0.22, abs(uv.y - (0.18 + 0.06 * sin(time * 3.0)))) * pulse;
      exportPressure *= smoothstep(0.03, 0.0, abs(fract(uv.y * 42.0 + time * 1.7) - 0.5) - 0.47);
      float label = 0.0;
      label += glyph((local - vec2(0.12, 0.78)) / vec2(0.16, 0.12), lane);
      label += glyph((local - vec2(0.31, 0.78)) / vec2(0.16, 0.12), lane == 3.0 ? 0.0 : 1.0);
      label *= lane == 3.0 ? 1.0 : 0.58;

      float grid = smoothstep(0.008, 0.0, abs(fract(local.x * 10.0) - 0.5) - 0.49);
      grid += smoothstep(0.008, 0.0, abs(fract(local.y * 8.0) - 0.5) - 0.49);
      grid *= 0.22;

      vec3 base = palette(0.18 + 0.16 * lane + field * 0.8);
      vec3 col = vec3(0.018, 0.035, 0.034);
      col += base * (field * 1.45 + grid) * laneMask;
      col += vec3(0.95, 0.31, 0.18) * aaMismatch * (0.3 + lens);
      col += vec3(0.78, 0.56, 0.17) * streamRisk * (0.25 + 0.75 * pulse);
      col += vec3(0.14, 0.75, 0.86) * relightCoverage;
      col += vec3(0.50, 0.72, 1.0) * fisheye * smoothstep(0.78, 0.98, length(p));
      col += vec3(1.0, 0.95, 0.72) * label * (0.45 + 0.55 * lens);
      col += vec3(1.0, 0.85, 0.42) * exportPressure;

      float laneEdge = smoothstep(0.012, 0.0, min(laneUv, 1.0 - laneUv));
      col += laneEdge * vec3(0.05, 0.16, 0.15);
      col *= 0.72 + 0.42 * lens;
      col = pow(col, vec3(0.92));
      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: false });
    const pointer = { x: 0.52, y: 0.54 };
    let hold = 0;
    let fisheye = 0;
    let pulse = 0;

    function shader(type, id) {
      const source = document.getElementById(id).textContent;
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, "vs"));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, "fs"));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      time: gl.getUniformLocation(program, "time"),
      hold: gl.getUniformLocation(program, "hold"),
      fisheye: gl.getUniformLocation(program, "fisheye"),
      pulse: gl.getUniformLocation(program, "pulse")
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.floor(innerWidth * dpr));
      const h = Math.max(1, Math.floor(innerHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        gl.viewport(0, 0, w, h);
        pulse = 1;
      }
    }

    addEventListener("pointermove", (event) => {
      pointer.x = event.clientX / innerWidth;
      pointer.y = 1 - event.clientY / innerHeight;
    });
    addEventListener("pointerdown", () => { hold = 1; });
    addEventListener("pointerup", () => { hold = 0; });
    addEventListener("keydown", (event) => {
      if (event.code === "KeyF") fisheye = fisheye > 0.5 ? 0 : 1;
      if (event.code === "Space") pulse = 1;
    });

    const start = performance.now();
    function frame(now) {
      resize();
      pulse *= 0.94;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
      gl.uniform1f(uniforms.time, (now - start) * 0.001);
      gl.uniform1f(uniforms.hold, hold);
      gl.uniform1f(uniforms.fisheye, fisheye);
      gl.uniform1f(uniforms.pulse, pulse);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
