<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beat Locked Projection Weave</title><style>html,body{margin:0;background:#030509;color:#e7f5ff;font:13px ui-monospace,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;left:18px;bottom:16px;line-height:1.55;text-shadow:0 1px 5px #000;pointer-events:none}b{color:#b9ff97}span{color:#9ab5c8}</style><canvas></canvas><div id="ui"><b>BEAT-LOCKED / PROJECTION WEAVE</b><br><span>pointer: steer seam · click / space: send a beat · 1–4: grid / scan / memory / composite</span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,px=.5,py=.5,mode=4,beat=0,t=0,tr=[];function fit(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}fit();addEventListener('resize',fit);addEventListener('pointermove',e=>{px=e.clientX/W;py=e.clientY/H});function hit(){beat=1;tr.unshift({x:px,y:py});if(tr.length>15)tr.pop()}addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.key===' ')hit();if(+e.key>0&&+e.key<5)mode=+e.key});function line(a,b,col,w=1){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}function loop(n){requestAnimationFrame(loop);t=n*.001;beat*=.925;g.fillStyle='#030509';g.fillRect(0,0,W,H);let cx=W*(.5+(px-.5)*.26),cy=H*(.51+(py-.5)*.22),s=Math.min(W,H)*.24;if(mode===1||mode===4){for(let i=-7;i<8;i++){let q=i/7;line([cx-s,cy+q*s],[cx,cy+q*s*.55],'rgba(130,255,184,.2)');line([cx,cy+q*s*.55],[cx+s,cy+q*s],'rgba(130,255,184,.2)');line([cx+q*s,cy-s],[cx+q*s*.55,cy],'rgba(130,255,184,.16)');line([cx+q*s*.55,cy],[cx+q*s,cy+s],'rgba(130,255,184,.16)')}}if(mode===2||mode===4){let y=cy-s+(Math.sin(t*6)*.5+.5)*s*2;g.fillStyle='rgba(208,255,230,.85)';g.fillRect(cx-s,y,s*2,2+beat*12);g.fillStyle='rgba(110,255,167,.12)';g.fillRect(cx-s,y-25-beat*70,s*2,50+beat*140)}if(mode===3||mode===4){tr.forEach((p,i)=>{let a=(1-i/tr.length)*.6;let X=W*(.5+(p.x-.5)*.26),Y=H*(.51+(p.y-.5)*.22);g.strokeStyle=`rgba(115,160,255,${a})`;g.strokeRect(X-s*(.96-i*.025),Y-s*(.96-i*.025),s*2*(.96-i*.025),s*2*(.96-i*.025));g.fillStyle=`rgba(100,145,255,${a*.12})`;g.fillRect(X-s,Y-s,s*2,s*2)})}if(mode===4){for(let i=0;i<9;i++){let a=i/8*Math.PI*2+t*.4;let r=s*(1.15+beat*.45);g.fillStyle=`rgba(255,210,126,${.22+beat*.4})`;g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2+beat*6,0,7);g.fill()}}g.fillStyle='#d5f8e6';g.fillText(['GRID / shared surface','SCAN / audio clock','MEMORY / cross-face trace','COMPOSITE / projection score'][mode-1],18,28);g.fillStyle='#9bbbd1';g.fillText(`beat ${beat>.08?'active':'rest'} · clips ${tr.length} · 145 bpm idea`,18,48)}requestAnimationFrame(loop);
</script></html>
