<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspector Capture Bloom</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#110a0c;color:#fff4ea;font:13px/1.45 ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:18px;left:18px;max-width:520px;pointer-events:none}.ey{font-size:10px;letter-spacing:.16em;color:#ffb77d}.title{margin:7px 0;font-size:clamp(23px,3.7vw,44px);line-height:1.02}.meta{color:#d8bcb3}.tag{display:inline-block;margin:8px 4px 0 0;padding:4px 7px;border:1px solid #71463d;border-radius:999px;color:#ffd2a6}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#e9c9ba}</style>
<canvas></canvas><div class="hud"><div class="ey">INSPECTOR LITE / CAPTURE STUDY — 26 OCT 2026</div><div class="title">A debug capture blooms<br>into a cue for the room.</div><div class="meta" id="meta"></div><div><span class="tag">pointer: inspection lens</span><span class="tag">click / space: capture flash</span><span class="tag">1–4: inspect pass</span></div></div><div class="keys">1 helpers &nbsp; 2 metrics &nbsp; 3 capture &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let x=.5,y=.5,mode=4,flash=0,last=0;function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight});addEventListener('pointerdown',()=>flash=1);addEventListener('keydown',e=>{if(e.key===' ')flash=1;if(+e.key>0&&+e.key<5)mode=+e.key});
function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1e3||0);last=t;flash*=Math.exp(-dt*1.7);let w=innerWidth,h=innerHeight,T=t/1e3,cx=w*x,cy=h*y,show=n=>mode===4||mode===n;g.fillStyle='#110a0c';g.fillRect(0,0,w,h);let nodes=36,hot=0;for(let i=0;i<nodes;i++){let a=i/nodes*7+T*.12,r=35+i*8,px=w*.5+Math.cos(a)*r*1.15,py=h*.55+Math.sin(a)*r*.58,d=Math.hypot(px-cx,py-cy),hit=d<110;if(hit)hot++;if(show(1)){g.strokeStyle=hit?'rgba(255,222,138,.8)':'rgba(255,140,100,.22)';g.strokeRect(px-5,py-5,10,10)}if(show(2)){g.fillStyle=hit?'rgba(255,187,99,.85)':'rgba(120,77,92,.5)';g.fillRect(px-2,py-2,4,4);if(hit){g.strokeStyle='rgba(255,191,117,.5)';g.beginPath();g.arc(px,py,14+8*Math.sin(T+i),0,7);g.stroke()}}if(show(3)&&hit){let q=g.createRadialGradient(px,py,1,px,py,42+flash*80);q.addColorStop(0,`rgba(255,246,198,${.25+flash*.5})`);q.addColorStop(1,'rgba(255,100,70,0)');g.fillStyle=q;g.fillRect(px-90,py-90,180,180)}}if(show(4)){let q=g.createRadialGradient(cx,cy,2,cx,cy,260);q.addColorStop(0,'rgba(255,180,86,.14)');q.addColorStop(1,'rgba(17,10,12,0)');g.fillStyle=q;g.fillRect(0,0,w,h)}document.querySelector('#meta').textContent=`lens ${Math.round(x*100)} / ${Math.round(y*100)} · helpers ${nodes} · hot metrics ${hot} · capture bloom ${Math.round(flash*100)}% · ${['HELPERS','METRICS','CAPTURE','COMPOSITE'][mode-1]}`};requestAnimationFrame(loop);
</script></html>
