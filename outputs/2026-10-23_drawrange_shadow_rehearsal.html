<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draw Range / Shadow Rehearsal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a13;color:#eaf3ff;font:13px/1.45 ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:18px auto auto 18px;max-width:440px;pointer-events:none}.title{font-size:11px;letter-spacing:.18em;color:#89d7ff}.read{font-size:clamp(19px,3vw,35px);line-height:1.05;margin:8px 0}.meta{color:#9caec5}.keys{position:fixed;right:18px;bottom:16px;text-align:right;color:#b8c7dd}.badge{display:inline-block;padding:4px 7px;border:1px solid #38526e;border-radius:999px;margin:6px 3px 0 0;color:#b9eaff}
</style>
<canvas></canvas><div class="hud"><div class="title">WEBGL / THREE.JS STATE STUDY — 23 OCT 2026</div><div class="read">Draw range becomes<br>a shadow rehearsal.</div><div class="meta" id="meta"></div><div><span class="badge">pointer: arrival</span><span class="badge">click / space: cue</span><span class="badge">1–4: isolate pass</span></div></div><div class="keys">1 source &nbsp; 2 range &nbsp; 3 shadow &nbsp; 4 composite</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,px=.5,py=.5,mode=4,cue=0,last=0;
function fit(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();
addEventListener('pointermove',e=>{px=e.clientX/innerWidth;py=e.clientY/innerHeight});addEventListener('pointerdown',()=>cue=1);addEventListener('keydown',e=>{if(e.key===' ')cue=1;if(+e.key>=1&&+e.key<=4)mode=+e.key});
function line(a,b,col,w=1){x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.stroke()}
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;cue*=Math.exp(-dt*2.2);const w=innerWidth,h=innerHeight,T=t*.001; x.clearRect(0,0,w,h);x.fillStyle='#070a13';x.fillRect(0,0,w,h);
 const cx=w*.53,cy=h*.54,R=Math.min(w,h)*.27,arrival=.16+.8*px,sh=.2+.8*py; const show=i=>mode===4||mode===i;
 // field grid
 if(show(1)){x.strokeStyle='rgba(87,133,175,.13)';x.lineWidth=1;for(let i=-8;i<=8;i++){line([0,cy+i*30],[w,cy+i*30],'rgba(87,133,175,.13)');line([cx+i*44,0],[cx+i*44,h],'rgba(87,133,175,.13)')}}
 // range: shared geometry's visible prefix
 if(show(2)){for(let n=0;n<90;n++){const q=n/89,a=q*Math.PI*2+T*.15;const reach=q<arrival;const rr=R*(.28+.72*q);const xx=cx+Math.cos(a)*rr,yy=cy+Math.sin(a)*rr*.57; x.fillStyle=reach?'hsla('+(185+q*100)+',90%,70%,'+(.25+q*.72)+')':'rgba(100,130,160,.10)';x.beginPath();x.arc(xx,yy,reach?2.8:1.2,0,7);x.fill()}x.strokeStyle='rgba(140,224,255,.65)';x.setLineDash([5,7]);x.beginPath();x.arc(cx,cy,R*(.28+.72*arrival),0,7);x.stroke();x.setLineDash([])}
 // shadow compile lanes
 if(show(3)){for(let i=0;i<6;i++){const yy=h*.76+i*11,ready=i/5<sh; x.fillStyle=ready?'rgba(255,187,94,.66)':'rgba(255,187,94,.12)';x.fillRect(w*.12,yy,w*.28*(.2+i*.14),5);x.fillStyle='#bdc7d6';x.fillText(ready?'shadow pipeline ready':'compileAsync queued',w*.42,yy+6)} const sx=cx+(px-.5)*R*1.4,sy=cy+(py-.5)*R*.7;x.fillStyle='rgba(255,181,93,'+(.15+cue*.5)+')';x.beginPath();x.ellipse(sx,sy,R*.92,R*.24,0,0,7);x.fill();line([sx,sy],[cx,cy],'rgba(255,215,135,.75)',1.4)}
 if(show(4)){const g=x.createRadialGradient(cx,cy,3,cx,cy,R*1.3);g.addColorStop(0,'rgba(128,232,255,.19)');g.addColorStop(1,'rgba(8,10,19,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}
 document.querySelector('#meta').textContent='visible range '+Math.round(arrival*100)+'%  ·  shadow warmup '+Math.round(sh*100)+'%  ·  '+['SOURCE','DRAW RANGE','SHADOW PIPELINES','COMPOSITE'][mode-1];
}requestAnimationFrame(frame);
</script></html>
