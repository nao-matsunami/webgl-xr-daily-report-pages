<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Version-Gated Light Score</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#040811;color:#d8f4ff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#h{position:fixed;top:16px;left:18px;line-height:1.65;letter-spacing:.06em;pointer-events:none}b{color:#b7f6df}small{opacity:.62}</style><canvas></canvas><div id="h"><b>VERSION-GATED LIGHT / score</b><br><span id="r">move = edit frontier · click / space = attribute version</span><br><small>1 source · 2 changed range · 3 afterglow · 4 composite · WebGL / GLSL</small></div><script>
const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:false}),o=document.querySelector('#r');if(!g)document.body.innerHTML='WebGL が必要です';
const V=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const F=`precision highp float;uniform vec2 r,m;uniform float t,v,mode;float n(vec2 p){return fract(sin(dot(p,vec2(31.17,113.91)))*43758.5453);}float line(float x,float w){return smoothstep(w,0.,abs(fract(x)-.5));}void main(){vec2 u=(gl_FragCoord.xy-.5*r)/r.y,q=m-.5*r/r.y;float d=length(u-q);float clock=fract(t*.24);float ver=exp(-v*1.8);float grid=line(u.x*16.+t*.04,.018)+line(u.y*10.-t*.03,.022);float frontier=exp(-abs(u.x-q.x)*42.)*(.35+.65*sin((u.y+t*.4)*19.)*.5+.5);float range=smoothstep(.55,.03,abs(u.y-q.y))*exp(-abs(u.x-q.x)*4.);float sparks=0.;for(int i=0;i<28;i++){float fi=float(i);vec2 p=vec2(fract(fi*.618)-.5,fract(fi*.371)-.5)*vec2(1.75,1.05);p.x+=q.x*.42;float z=length(u-p);sparks+=exp(-z*(80.+30.*n(p)))*(step(.28,n(p+floor(v*7.))));}float echo=exp(-d*(4.+v*3.))*(.25+.75*ver)*(.5+.5*sin(d*48.-t*6.));vec3 source=vec3(.03,.18,.32)*(grid+.3);vec3 changed=vec3(.05,.85,1.)*(frontier*range+sparks*.35);vec3 history=vec3(1.,.23,.06)*(echo+sparks*.16);vec3 col=source+changed+history;if(mode<.17)col=source;else if(mode<.5)col=changed+source*.15;else if(mode<.83)col=history+changed*.08;float vig=1.-smoothstep(.35,1.08,length(u));gl_FragColor=vec4(col*vig,1.);}`;
function sh(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw g.getShaderInfoLog(x);return x}let P=g.createProgram();g.attachShader(P,sh(g.VERTEX_SHADER,V));g.attachShader(P,sh(g.FRAGMENT_SHADER,F));g.linkProgram(P);g.useProgram(P);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U=Object.fromEntries(['r','m','t','v','mode'].map(x=>[x,g.getUniformLocation(P,x)])),x=.5,y=.5,v=3,mo=3;function rz(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}addEventListener('resize',rz);rz();addEventListener('pointermove',e=>{x=e.clientX/innerWidth;y=1-e.clientY/innerHeight});function hit(){v=0}addEventListener('pointerdown',hit);addEventListener('keydown',e=>{if(e.code==='Space')hit();if(+e.key>0&&+e.key<5)mo=+e.key-1});function draw(ms){v+=.012;g.uniform2f(U.r,c.width,c.height);g.uniform2f(U.m,x*c.width,y*c.height);g.uniform1f(U.t,ms*.001);g.uniform1f(U.v,v);g.uniform1f(U.mode,mo/3);g.drawArrays(g.TRIANGLES,0,3);o.textContent=`attribute version ${Math.floor(v*7)} · ${['source','changed range','afterglow','composite'][mo]} · range ${(x*100).toFixed(0)}%`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
