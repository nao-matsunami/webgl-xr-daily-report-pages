<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selective Radiance Atlas</title><style>html,body{margin:0;height:100%;background:#071016;color:#d9f5ff;font:13px ui-monospace,monospace;overflow:hidden}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:16px;left:16px;max-width:370px;pointer-events:none;text-shadow:0 1px 4px #000}b{color:#8ff}kbd{border:1px solid #579;padding:2px 5px;border-radius:3px}</style><canvas id="c"></canvas><div id="ui"><b>SELECTIVE RADIANCE ATLAS</b><br>pointer: probe / click or Space: flash / <kbd>1</kbd> probe <kbd>2</kbd> HDR <kbd>3</kbd> splat <kbd>4</kbd> composite<br><span id="readout"></span></div><script>
const c=document.querySelector('#c'), gl=c.getContext('webgl'); if(!gl)document.body.innerHTML='WebGL is required';
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 r,m;uniform float t,p;uniform int mode;float h(vec2 x){return fract(sin(dot(x,vec2(41.7,289.1)))*43758.5);}float n(vec2 x){vec2 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;vec2 q=uv-m;float d=length(q);float scan=n(uv*18.+t*.08);float probe=smoothstep(.36,.0,d)*(1.+.5*sin(t*2.));float hdr=pow(max(0.,1.-length(uv-vec2(sin(t*.23)*.25,cos(t*.18)*.16))*1.7),4.);float rings=.5+.5*sin(44.*d-t*4.);float splat=smoothstep(.7,.1,d)*(step(.68,h(floor(uv*80.+t*3.)))+rings*.25);vec3 A=vec3(.03,.18,.24)+probe*vec3(.1,.9,1.);vec3 B=vec3(.12,.015,.17)+hdr*vec3(1.5,.24,.9);vec3 C=vec3(.02,.08,.12)+splat*vec3(.15,.8,.62);float selector=mode==1?0.:mode==2?1.:mode==3?2.:3.;vec3 col=selector<.5?A:selector<1.5?B:selector<2.5?C:mix(mix(A,B,.55+scan*.2),C,.38);col+=p*exp(-d*9.)*vec3(1.,.8,.35);col*=.86+.14*sin(uv.y*r.y*.7);gl_FragColor=vec4(pow(col,vec3(.75)),1.);}`;
function sh(type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);return x}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let U=k=>gl.getUniformLocation(pr,k),M=[.5,.5],pulse=0,mode=4;c.onpointermove=e=>{let z=c.getBoundingClientRect();M=[e.clientX/z.width,e.clientY/z.height]};onpointerdown=()=>pulse=1;onkeydown=e=>{if(e.code==='Space')pulse=1;if(+e.key>0&&+e.key<5)mode=+e.key};function draw(ms){let w=c.width=innerWidth*devicePixelRatio,h=c.height=innerHeight*devicePixelRatio;gl.viewport(0,0,w,h);gl.uniform2f(U('r'),w,h);gl.uniform2f(U('m'),M[0]*w/h,M[1]);gl.uniform1f(U('t'),ms*.001);gl.uniform1f(U('p'),pulse);gl.uniform1i(U('mode'),mode);gl.drawArrays(gl.TRIANGLES,0,3);pulse*=.93;document.querySelector('#readout').textContent=`mode ${mode} · probe ${M[0].toFixed(2)} · radiance ${Math.round((1+Math.sin(ms*.001))*50)}%`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
