<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaction Memory Diff Shield</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #020608;
      color: #edf7ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #020608;
    }

    .hud {
      position: fixed;
      left: 16px;
      top: 14px;
      max-width: min(560px, calc(100vw - 32px));
      font-size: 12px;
      line-height: 1.45;
      color: rgba(222, 238, 255, 0.76);
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.92);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .hud strong {
      display: block;
      margin-bottom: 5px;
      color: #f7fbff;
      font-size: 13px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .keys {
      position: fixed;
      right: 16px;
      bottom: 14px;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(222, 238, 255, 0.68);
      text-align: right;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <strong>Interaction memory diff shield</strong>
    Pointer leaves a fading contact field. Center = renderer drift. Hold or Space = compile / stream pressure.
  </div>
  <div class="keys">contact memory · parity aura · shield scan · path pulse</div>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2 resolution;
    uniform vec2 pointer;
    uniform vec2 prevPointer;
    uniform float time;
    uniform float hold;
    uniform float pulse;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 78.23);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += a * noise(p);
        p = mat2(1.58, 1.13, -1.13, 1.58) * p + 0.19;
        a *= 0.5;
      }
      return v;
    }

    float sat(float v) {
      return clamp(v, 0.0, 1.0);
    }

    float line(vec2 p, vec2 a, vec2 b, float w) {
      vec2 pa = p - a;
      vec2 ba = b - a;
      float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
      return smoothstep(w, 0.0, length(pa - ba * h));
    }

    float hexGrid(vec2 p) {
      vec2 q = vec2(p.x * 1.1547, p.y + p.x * 0.57735);
      vec2 g = abs(fract(q * 6.0) - 0.5);
      return smoothstep(0.045, 0.0, min(g.x, g.y));
    }

    float ring(vec2 p, float radius, float width) {
      return smoothstep(width, 0.0, abs(length(p) - radius));
    }

    float arc(vec2 p, float radius, float width, float phase, float duty) {
      float angle = atan(p.y, p.x) / 6.2831853 + 0.5;
      float gate = smoothstep(duty, duty - 0.08, fract(angle * 7.0 + phase));
      return ring(p, radius, width) * gate;
    }

    float starLayer(vec2 uv) {
      vec2 cell = floor(uv * vec2(92.0, 54.0));
      vec2 local = fract(uv * vec2(92.0, 54.0)) - 0.5;
      float h = hash(cell);
      float star = smoothstep(0.055, 0.0, length(local)) * smoothstep(0.982, 1.0, h);
      return star * (0.35 + 0.65 * sin(time * 1.7 + h * 18.0));
    }

    float pulsePath(vec2 p, float offset, float speed) {
      float track = line(p, vec2(-0.95, -0.44 + offset), vec2(0.96, 0.36 - offset * 0.55), 0.011);
      float u = dot(p, normalize(vec2(1.71, 0.8))) * 0.55 + 0.5;
      float head = fract(u * 1.2 - time * speed + offset);
      float mask = smoothstep(0.13, 0.0, head) * smoothstep(0.0, 0.055, head);
      float core = line(p, vec2(-0.95, -0.44 + offset), vec2(0.96, 0.36 - offset * 0.55), 0.003);
      return track * mask + core * mask * 1.7;
    }

    vec3 renderPath(vec2 p, float lane) {
      float n = fbm(p * (2.2 + lane * 0.65) + vec2(time * 0.04, lane * 4.0));
      float topology = 0.0;
      for (int i = 0; i < 18; i++) {
        float fi = float(i);
        vec2 a = vec2(-0.95 + hash(vec2(fi, 2.0)) * 1.9, -0.68 + hash(vec2(fi, 9.0)) * 1.36);
        vec2 b = vec2(-0.95 + hash(vec2(fi, 7.0)) * 1.9, -0.68 + hash(vec2(fi, 4.0)) * 1.36);
        float drift = 0.018 * lane * sin(time * 0.6 + fi);
        topology += line(p + drift, a, b, 0.004 + 0.006 * lane);
      }
      float pulseA = pulsePath(p, -0.16, 0.18 + lane * 0.02);
      float pulseB = pulsePath(p.yx * vec2(1.0, -1.0), 0.18, 0.24 - lane * 0.03);
      float bloom = smoothstep(0.04, 0.42, topology + pulseA + pulseB + n * 0.20);
      vec3 cyan = vec3(0.03, 0.86, 1.0);
      vec3 amber = vec3(1.00, 0.66, 0.22);
      vec3 magenta = vec3(0.92, 0.18, 1.0);
      vec3 col = vec3(0.012, 0.030, 0.038);
      col += mix(cyan, amber, lane) * topology * 1.55;
      col += magenta * bloom * (0.18 + 0.36 * lane);
      col += vec3(0.90, 0.98, 1.0) * (pulseA + pulseB) * (1.0 + 0.7 * lane);
      return col;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec2 p = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
      vec2 aspect = vec2(resolution.x / min(resolution.x, resolution.y), resolution.y / min(resolution.x, resolution.y));
      vec2 m = (pointer * 2.0 - 1.0) * aspect;
      vec2 pm = (prevPointer * 2.0 - 1.0) * aspect;
      float pressure = clamp(hold + pulse, 0.0, 1.0);

      vec3 tslLike = renderPath(p, 1.0);
      vec3 glslLike = renderPath(p + vec2(0.015 * sin(time * 0.7), -0.012), 0.0);
      float diff = length(tslLike - glslLike);

      vec2 sphere = p * vec2(0.84, 1.04);
      float r = length(sphere);
      float shell = smoothstep(0.92, 0.78, r) * smoothstep(0.34, 0.74, r);
      float coreShell = smoothstep(0.74, 0.18, r);
      float fresnel = pow(sat(1.0 - abs(0.73 - r)), 5.5);
      float hex = hexGrid(p * 1.08 + 0.04 * vec2(sin(time * 0.5), cos(time * 0.4))) * shell;
      float nowHit = exp(-dot(p - m, p - m) / 0.018);
      float oldHit = exp(-dot(p - pm, p - pm) / 0.055) * (0.58 + 0.42 * sin(time * 2.7));
      float memory = clamp(nowHit + oldHit, 0.0, 1.0) * shell;
      float scan = smoothstep(0.018, 0.0, abs(r - (0.48 + 0.32 * fract(time * 0.18))));
      float orbital = arc(p, 0.86, 0.010, time * 0.06, 0.62);
      orbital += arc(p * mat2(0.78, -0.62, 0.62, 0.78), 0.66, 0.008, -time * 0.08, 0.66);
      float crosshair = line(p, vec2(-1.18, 0.0), vec2(1.18, 0.0), 0.002) * smoothstep(0.94, 0.58, abs(p.x));
      crosshair += line(p, vec2(0.0, -0.9), vec2(0.0, 0.9), 0.002) * smoothstep(0.82, 0.46, abs(p.y));

      vec3 base = mix(glslLike, tslLike, smoothstep(0.48, 0.52, uv.x));
      vec3 heat = vec3(1.0, 0.34, 0.12) * smoothstep(0.12, 0.62, diff);
      heat += vec3(0.10, 0.88, 1.0) * smoothstep(0.34, 0.05, abs(diff - 0.24));
      vec3 shield = vec3(0.04, 0.92, 1.0) * fresnel * shell * 1.25;
      shield += vec3(0.96, 0.78, 0.28) * hex * (0.08 + memory * 1.7);
      shield += vec3(1.0, 0.15, 0.92) * memory * (0.55 + pressure * 1.25);
      shield += vec3(0.36, 0.22, 1.0) * scan * shell * (0.18 + 0.95 * pressure);
      shield += vec3(0.14, 0.92, 1.0) * orbital * (0.45 + 0.75 * pressure);
      shield += vec3(0.76, 0.90, 1.0) * crosshair * coreShell * 0.26;

      float center = smoothstep(0.18, 0.0, abs(uv.x - 0.5));
      vec3 nebula = mix(vec3(0.015, 0.026, 0.038), vec3(0.030, 0.014, 0.052), uv.y);
      nebula += vec3(0.02, 0.08, 0.12) * fbm(p * 1.4 + time * 0.015);
      vec3 col = nebula + base * 0.58 + heat * center * (0.42 + pressure * 0.82) + shield;
      col += vec3(0.72, 0.95, 1.0) * starLayer(uv) * 0.75;
      col += vec3(0.86, 0.98, 1.0) * smoothstep(0.004, 0.0, abs(uv.x - 0.5)) * 0.62;
      float vignette = smoothstep(1.35, 0.18, length(p * vec2(0.82, 1.06)));
      float scanline = 0.94 + 0.06 * sin(gl_FragCoord.y * 1.7 + time * 5.0);
      col *= vignette * scanline;
      col = col / (1.0 + col * 0.52);
      col = pow(col, vec3(0.84));
      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: false });
    const pointer = { x: 0.55, y: 0.48 };
    const prevPointer = { x: 0.42, y: 0.58 };
    let hold = 0;
    let pulse = 0;

    function compileShader(type, id) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, document.getElementById(id).textContent);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, "vs"));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, "fs"));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      prevPointer: gl.getUniformLocation(program, "prevPointer"),
      time: gl.getUniformLocation(program, "time"),
      hold: gl.getUniformLocation(program, "hold"),
      pulse: gl.getUniformLocation(program, "pulse")
    };

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      prevPointer.x += (pointer.x - prevPointer.x) * 0.12;
      prevPointer.y += (pointer.y - prevPointer.y) * 0.12;
      pointer.x = (event.clientX - rect.left) / rect.width;
      pointer.y = 1 - (event.clientY - rect.top) / rect.height;
    }

    window.addEventListener("pointermove", setPointer);
    window.addEventListener("pointerdown", (event) => {
      hold = 1;
      setPointer(event);
    });
    window.addEventListener("pointerup", () => {
      hold = 0;
    });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") pulse = 1;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
      }
    }

    function frame(now) {
      resize();
      pulse *= 0.92;
      prevPointer.x += (pointer.x - prevPointer.x) * 0.018;
      prevPointer.y += (pointer.y - prevPointer.y) * 0.018;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
      gl.uniform2f(uniforms.prevPointer, prevPointer.x, prevPointer.y);
      gl.uniform1f(uniforms.time, now * 0.001);
      gl.uniform1f(uniforms.hold, hold);
      gl.uniform1f(uniforms.pulse, pulse);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
