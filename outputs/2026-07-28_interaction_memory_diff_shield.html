<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaction Memory Diff Shield</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07100d;
      color: #eef7f1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      left: 16px;
      top: 14px;
      max-width: min(660px, calc(100vw - 32px));
      font-size: 12px;
      line-height: 1.45;
      color: rgba(238, 247, 241, 0.84);
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .hud strong {
      display: block;
      margin-bottom: 5px;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 0;
    }

    .keys {
      position: fixed;
      right: 16px;
      bottom: 14px;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(238, 247, 241, 0.74);
      text-align: right;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <strong>Interaction memory diff shield</strong>
    Pointer writes a fading shield memory. Center = WebGPU/TSL vs WebGL/GLSL visual drift. Hold or Space = compile / stream pressure.
  </div>
  <div class="keys">Fresnel shield · history mask · GLSL parity heat · path pulse</div>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;

    uniform vec2 resolution;
    uniform vec2 pointer;
    uniform vec2 prevPointer;
    uniform float time;
    uniform float hold;
    uniform float pulse;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 78.23);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += a * noise(p);
        p = mat2(1.58, 1.13, -1.13, 1.58) * p + 0.19;
        a *= 0.5;
      }
      return v;
    }

    float line(vec2 p, vec2 a, vec2 b, float w) {
      vec2 pa = p - a;
      vec2 ba = b - a;
      float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
      return smoothstep(w, 0.0, length(pa - ba * h));
    }

    float hexGrid(vec2 p) {
      vec2 q = vec2(p.x * 1.1547, p.y + p.x * 0.57735);
      vec2 g = abs(fract(q * 6.0) - 0.5);
      return smoothstep(0.045, 0.0, min(g.x, g.y));
    }

    float pulsePath(vec2 p, float offset, float speed) {
      float track = line(p, vec2(-0.85, -0.44 + offset), vec2(0.86, 0.36 - offset * 0.55), 0.014);
      float u = dot(p, normalize(vec2(1.71, 0.8))) * 0.55 + 0.5;
      float head = fract(u * 1.2 - time * speed + offset);
      float mask = smoothstep(0.11, 0.0, head) * smoothstep(0.0, 0.06, head);
      return track * mask;
    }

    vec3 renderPath(vec2 p, float lane) {
      float n = fbm(p * (2.2 + lane * 0.65) + vec2(time * 0.04, lane * 4.0));
      float topology = 0.0;
      for (int i = 0; i < 18; i++) {
        float fi = float(i);
        vec2 a = vec2(-0.95 + hash(vec2(fi, 2.0)) * 1.9, -0.68 + hash(vec2(fi, 9.0)) * 1.36);
        vec2 b = vec2(-0.95 + hash(vec2(fi, 7.0)) * 1.9, -0.68 + hash(vec2(fi, 4.0)) * 1.36);
        float drift = 0.018 * lane * sin(time * 0.6 + fi);
        topology += line(p + drift, a, b, 0.004 + 0.006 * lane);
      }
      float pulseA = pulsePath(p, -0.16, 0.18 + lane * 0.02);
      float pulseB = pulsePath(p.yx * vec2(1.0, -1.0), 0.18, 0.24 - lane * 0.03);
      float bloom = smoothstep(0.05, 0.45, topology + pulseA + pulseB + n * 0.22);
      vec3 cool = vec3(0.12, 0.72, 0.82);
      vec3 gold = vec3(1.00, 0.67, 0.25);
      vec3 violet = vec3(0.46, 0.34, 0.86);
      vec3 col = vec3(0.045, 0.095, 0.075);
      col += mix(cool, gold, lane) * topology * 1.25;
      col += violet * bloom * (0.2 + 0.42 * lane);
      col += vec3(0.85, 0.96, 1.0) * (pulseA + pulseB) * (0.85 + 0.55 * lane);
      return col;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec2 p = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
      vec2 aspect = vec2(resolution.x / min(resolution.x, resolution.y), resolution.y / min(resolution.x, resolution.y));
      vec2 m = (pointer * 2.0 - 1.0) * aspect;
      vec2 pm = (prevPointer * 2.0 - 1.0) * aspect;
      float pressure = clamp(hold + pulse, 0.0, 1.0);

      vec3 tslLike = renderPath(p, 1.0);
      vec3 glslLike = renderPath(p + vec2(0.015 * sin(time * 0.7), -0.012), 0.0);
      float diff = length(tslLike - glslLike);

      vec2 sphere = p * vec2(0.88, 1.08);
      float r = length(sphere);
      float shell = smoothstep(0.88, 0.81, r) * smoothstep(0.50, 0.86, r);
      float fresnel = pow(clamp(1.0 - abs(0.72 - r), 0.0, 1.0), 4.0);
      float hex = hexGrid(p + 0.03 * vec2(sin(time * 0.5), cos(time * 0.4))) * shell;
      float nowHit = exp(-dot(p - m, p - m) / 0.018);
      float oldHit = exp(-dot(p - pm, p - pm) / 0.055) * (0.58 + 0.42 * sin(time * 2.7));
      float memory = clamp(nowHit + oldHit, 0.0, 1.0) * shell;
      float scan = smoothstep(0.018, 0.0, abs(r - (0.56 + 0.22 * fract(time * 0.18))));

      vec3 base = mix(glslLike, tslLike, smoothstep(0.48, 0.52, uv.x));
      vec3 heat = vec3(1.0, 0.28, 0.12) * smoothstep(0.10, 0.58, diff);
      heat += vec3(0.18, 0.84, 1.0) * smoothstep(0.30, 0.05, abs(diff - 0.24));
      vec3 shield = vec3(0.11, 0.82, 0.76) * fresnel * shell;
      shield += vec3(0.95, 0.72, 0.28) * hex * (0.18 + memory * 1.4);
      shield += vec3(1.0, 0.38, 0.18) * memory * (0.7 + pressure);
      shield += vec3(0.46, 0.34, 0.86) * scan * shell * (0.25 + 0.75 * pressure);

      float center = smoothstep(0.18, 0.0, abs(uv.x - 0.5));
      vec3 col = base * 0.72 + heat * center * (0.55 + pressure * 0.65) + shield;
      col += vec3(0.95, 1.0, 0.9) * smoothstep(0.005, 0.0, abs(uv.x - 0.5));
      col *= 0.62 + 0.42 * smoothstep(1.2, 0.15, length(p));
      col = pow(col, vec3(0.92));
      gl_FragColor = vec4(col, 1.0);
    }
  </script>

  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: false });
    const pointer = { x: 0.55, y: 0.48 };
    const prevPointer = { x: 0.42, y: 0.58 };
    let hold = 0;
    let pulse = 0;

    function compileShader(type, id) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, document.getElementById(id).textContent);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, "vs"));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, "fs"));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "resolution"),
      pointer: gl.getUniformLocation(program, "pointer"),
      prevPointer: gl.getUniformLocation(program, "prevPointer"),
      time: gl.getUniformLocation(program, "time"),
      hold: gl.getUniformLocation(program, "hold"),
      pulse: gl.getUniformLocation(program, "pulse")
    };

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      prevPointer.x += (pointer.x - prevPointer.x) * 0.12;
      prevPointer.y += (pointer.y - prevPointer.y) * 0.12;
      pointer.x = (event.clientX - rect.left) / rect.width;
      pointer.y = 1 - (event.clientY - rect.top) / rect.height;
    }

    window.addEventListener("pointermove", setPointer);
    window.addEventListener("pointerdown", (event) => {
      hold = 1;
      setPointer(event);
    });
    window.addEventListener("pointerup", () => {
      hold = 0;
    });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") pulse = 1;
    });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        gl.viewport(0, 0, width, height);
      }
    }

    function frame(now) {
      resize();
      pulse *= 0.92;
      prevPointer.x += (pointer.x - prevPointer.x) * 0.018;
      prevPointer.y += (pointer.y - prevPointer.y) * 0.018;
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
      gl.uniform2f(uniforms.prevPointer, prevPointer.x, prevPointer.y);
      gl.uniform1f(uniforms.time, now * 0.001);
      gl.uniform1f(uniforms.hold, hold);
      gl.uniform1f(uniforms.pulse, pulse);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
