<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiance Confidence Orchestra</title>
<style>html,body{margin:0;overflow:hidden;background:#03050d;color:#eaf7ff;font:12px ui-monospace,monospace}canvas{display:block;width:100vw;height:100vh}#note{position:fixed;left:18px;top:16px;line-height:1.65;text-shadow:0 2px 12px #000}h1{margin:0 0 4px;font:600 16px system-ui;letter-spacing:.08em}b{color:#9eeeff}#meter{position:fixed;right:18px;bottom:14px;text-align:right;color:#b6cce8}</style>
<canvas></canvas><div id="note"><h1>RADIANCE / CONFIDENCE ORCHESTRA</h1><b>move</b> = steer the sky direction &nbsp; <b>click</b> = ring a trusted beacon<br>Bright is current radiance; amber is the fading, less-certain memory.</div><div id="meter">CONFIDENCE 1.00</div>
<script>
const c=document.querySelector('canvas'),g=c.getContext('webgl',{antialias:false});if(!g)document.body.textContent='WebGL is required.';
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 r,m;uniform float t;uniform vec3 b[12];uniform int n;float hash(vec2 x){return fract(sin(dot(x,vec2(41.3,73.7)))*42681.3);}float noise(vec2 x){vec2 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}void main(){vec2 p=(2.*gl_FragCoord.xy-r)/min(r.x,r.y);float zen=clamp(p.y*.5+.5,0.,1.);vec3 col=mix(vec3(.004,.008,.028),vec3(.055,.3,.62),zen);float sun=exp(-dot(p-m,p-m)*3.2);col+=vec3(.35,.8,1.)*sun;float bands=.5+.5*sin(p.y*23.-t*1.5+noise(p*5.)*2.);col+=vec3(.015,.12,.25)*bands*(.3+sun);for(int i=0;i<12;i++){if(i>=n)break;float age=max(0.,t-b[i].z),conf=exp(-age*.16);vec2 d=p-b[i].xy;float core=exp(-dot(d,d)*260.)*conf;float halo=exp(-pow(length(d)-age*.09,2.)/.002)*conf;col+=vec3(.15,.95,1.)*core+vec3(1.,.22,.04)*halo*(1.-conf*.35);}float horizon=exp(-abs(p.y+.42)*48.);col+=vec3(.18,.45,.7)*horizon;col+= (hash(floor(p*vec2(260.,150.)))-.5)*.025;gl_FragColor=vec4(1.-exp(-col*1.35),1.);}`;
function sh(k,s){let q=g.createShader(k);g.shaderSource(q,s);g.compileShader(q);if(!g.getShaderParameter(q,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(q));return q}let P=g.createProgram();g.attachShader(P,sh(g.VERTEX_SHADER,vs));g.attachShader(P,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(P);g.useProgram(P);let V=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,V);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let a=g.getAttribLocation(P,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U=k=>g.getUniformLocation(P,k),m=[0,.15],beacons=[],begin=performance.now(),last=begin;
function resize(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}addEventListener('resize',resize);resize();function pointer(e){m=[(e.clientX-innerWidth/2)/(Math.min(innerWidth,innerHeight)/2),(innerHeight/2-e.clientY)/(Math.min(innerWidth,innerHeight)/2)]}addEventListener('pointermove',pointer);addEventListener('click',e=>{pointer(e);beacons.push([...m,(performance.now()-begin)/1000]);if(beacons.length>12)beacons.shift()});function frame(now){requestAnimationFrame(frame);let t=(now-begin)/1000,age=(now-last)/1000;last=now;let confidence=Math.max(.18,1-age*4);document.querySelector('#meter').textContent='FRAME CONFIDENCE '+confidence.toFixed(2)+' / '+beacons.length+' BEACONS';g.uniform2f(U('r'),c.width,c.height);g.uniform2f(U('m'),...m);g.uniform1f(U('t'),t);g.uniform1i(U('n'),beacons.length);g.uniform3fv(U('b'),new Float32Array([...beacons,...Array(12-beacons.length).fill([0,0,-999])].flat()));g.drawArrays(g.TRIANGLES,0,3)}requestAnimationFrame(frame);
</script></html>
