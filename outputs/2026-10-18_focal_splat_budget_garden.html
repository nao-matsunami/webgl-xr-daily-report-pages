<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focal Splat Budget Garden</title><style>html,body{margin:0;height:100%;background:#050912;overflow:hidden;color:#e6efff;font:12px ui-monospace,monospace}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:18px;left:18px;line-height:1.55;text-shadow:0 2px 8px #000;max-width:420px}b{color:#fff}kbd{border:1px solid #668;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>FOCAL SPLAT / BUDGET GARDEN</b><br>pointer: gaze target　<kbd>1</kbd> distance <kbd>2</kbd> focal footprint <kbd>3</kbd> budget <kbd>4</kbd> composite<br>click / space: stream a new cluster<br><span id="s"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,p={x:.5,y:.5},mode=4,burst=0,last=0;
function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();addEventListener('pointermove',e=>p={x:e.clientX/W,y:e.clientY/H});addEventListener('pointerdown',()=>burst=1);addEventListener('keydown',e=>{if(+e.key)mode=+e.key;if(e.code==='Space')burst=1});
function hash(n){return (Math.sin(n*12.9898)*43758.5453)%1}function loop(t){let dt=Math.min(.05,t-last||0);last=t;burst=Math.max(0,burst-dt*.38);let q=t*.001,cx=p.x*W,cy=p.y*H,s=Math.min(W,H);g.fillStyle='rgba(3,7,14,.18)';g.fillRect(0,0,W,H);let count=mode===3?190:410,active=0;
for(let i=0;i<count;i++){let a=hash(i+2)*6.283,r=Math.pow(Math.abs(hash(i+9)),.52)*s*.62,px=W*.5+Math.cos(a+q*.03)*r*1.32,py=H*.53+Math.sin(a+q*.03)*r,dist=Math.hypot(px-cx,py-cy)/s,focus=Math.max(0,1-dist*2.4),lod=focus*.82+burst*.4,rad=(1.5+lod*8)*(mode===1?.38:1),h=175+70*(hash(i+7));if(lod>.16)active++;if(mode===1&&i%3)continue;g.fillStyle=`hsla(${h},90%,${44+lod*34}%,${.06+lod*.56})`;g.beginPath();g.ellipse(px,py,rad*(1+.7*Math.sin(a)),rad,0,0,7);g.fill()}
if(mode!==1){for(let i=0;i<7;i++){let r=s*(.055+i*.075)+burst*s*.18;g.strokeStyle=`hsla(${175+i*12},90%,75%,${mode===2?.34:.12})`;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke()}}
if(mode!==2){g.strokeStyle=`rgba(255,205,135,${.2+burst*.75})`;g.lineWidth=2;g.beginPath();g.arc(cx,cy,s*(.11+burst*.31),0,7);g.stroke()}g.fillStyle='#fff2dc';g.beginPath();g.arc(cx,cy,2+burst*10,0,7);g.fill();document.querySelector('#s').textContent=`mode ${mode} · splat budget ${Math.round(active/count*100)}% · focal axes ${Math.round(1+p.x*3)}×${Math.round(1+p.y*3)} · stream ${burst>.08?'arriving':'settled'}`;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
