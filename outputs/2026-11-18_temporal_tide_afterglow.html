<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporal Tide Afterglow</title><style>html,body{margin:0;background:#040b14;color:#dceeff;font:13px ui-monospace,monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;left:18px;bottom:16px;line-height:1.55;text-shadow:0 1px 5px #000;pointer-events:none}b{color:#ffd38e}span{color:#9db9d9}</style><canvas></canvas><div id="ui"><b>TEMPORAL TIDE / AFTERGLOW</b><br><span>pointer: steer tide · click / space: flash exposure · 1–4: source / history / resolve / composite</span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,x=.5,y=.5,mode=4,flash=0,t=0,h=[];function z(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;g.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',z);z();addEventListener('pointermove',e=>{x=e.clientX/W;y=e.clientY/H});addEventListener('pointerdown',()=>flash=1);addEventListener('keydown',e=>{if(e.key===' '){flash=1}if(+e.key>0&&+e.key<5)mode=+e.key});const glow=(X,Y,r,C)=>{let q=g.createRadialGradient(X,Y,0,X,Y,r);q.addColorStop(0,C);q.addColorStop(1,'transparent');g.fillStyle=q;g.beginPath();g.arc(X,Y,r,0,7);g.fill()};function wave(now){requestAnimationFrame(wave);t=now*.001;flash*=.94;let p={x:W*(.5+(x-.5)*.74),y:H*(.48+(y-.5)*.48)};h.unshift(p);if(h.length>32)h.pop();g.fillStyle='#040b14';g.fillRect(0,0,W,H);for(let n=0;n<18;n++){let yy=H*.16+n*H*.052;g.strokeStyle=`rgba(58,132,190,${.08+n*.004})`;g.beginPath();for(let X=0;X<=W;X+=12){let a=Math.sin(X*.014+t*1.7+n*.38+p.x*.002)*12+Math.sin(X*.033-t+n)*5;X?g.lineTo(X,yy+a):g.moveTo(X,yy+a)}g.stroke()}if(mode===1||mode===4){glow(p.x,p.y,110,'rgba(85,210,255,.25)');glow(p.x,p.y,18,'rgba(235,252,255,.98)')}if(mode===2||mode===4){h.forEach((a,i)=>{let q=(1-i/h.length);glow(a.x,a.y,8+i*.85,`rgba(100,123,255,${q*.14})`);g.fillStyle=`rgba(150,183,255,${q*.62})`;g.fillRect(a.x-1,a.y-1,2,2)})}if(mode===3||mode===4){let a=h[Math.min(12,h.length-1)]||p,b=h[Math.min(4,h.length-1)]||p,r=.54;let X=a.x*(1-r)+b.x*r,Y=a.y*(1-r)+b.y*r;glow(X,Y,150,'rgba(255,154,76,.16)');glow(X,Y,42,'rgba(255,211,137,.38)');g.strokeStyle='rgba(255,225,175,.65)';g.beginPath();g.arc(X,Y,25+flash*90,0,7);g.stroke();g.fillStyle='rgba(255,230,185,.85)';g.fillText('temporal resolve',X+30,Y-24)}if(flash>.02){glow(p.x,p.y,260,`rgba(255,170,80,${flash*.24})`)}g.fillStyle='rgba(221,239,255,.78)';g.fillText(['SOURCE WATER','HISTORY WAKE','EXPOSURE RESOLVE','COMPOSITE'][mode-1],18,28);g.fillStyle='rgba(255,207,130,.75)';g.fillText(`history ${h.length} · exposure ${flash>.08?'pulse':'settled'}`,18,48)}requestAnimationFrame(wave);
</script></html>
