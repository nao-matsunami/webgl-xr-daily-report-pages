<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FFT Spectral Wake Scope</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07080b;
      color: #e7edf2;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(231, 237, 242, 0.82);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }
    .hud strong {
      color: #ffffff;
      font-weight: 700;
    }
    #error {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 16px;
      color: #ffd6d6;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div><strong>FFT Spectral Wake Scope</strong><br>1 beauty / 2 spectrum / 3 ping-pong stages / 4 depth resolve lanes</div>
    <div>Drag: phase center<br>Click or Space: impulse</div>
  </div>
  <pre id="error"></pre>
  <script>
  (() => {
    const canvas = document.getElementById('c');
    const errorEl = document.getElementById('error');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) {
      errorEl.textContent = 'WebGL is not available.';
      return;
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision mediump float;
      uniform vec2 resolution;
      uniform float time;
      uniform vec2 pointer;
      uniform float impulse;
      uniform float mode;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float line(float v, float width) {
        return 1.0 - smoothstep(0.0, width, abs(v));
      }

      float ring(vec2 p, float radius, float width) {
        return 1.0 - smoothstep(width, width * 2.0, abs(length(p) - radius));
      }

      float squareFrame(vec2 p, float size, float width) {
        vec2 d = abs(p) - vec2(size);
        float outside = length(max(d, 0.0));
        float inside = min(max(d.x, d.y), 0.0);
        return 1.0 - smoothstep(width, width * 2.0, abs(outside + inside));
      }

      float spectralCell(vec2 p) {
        vec2 id = floor(p * 8.0);
        vec2 f = fract(p * 8.0) - 0.5;
        float distanceFromCenter = length(id - vec2(3.5));
        float bin = exp(-distanceFromCenter * 0.34);
        float flicker = 0.55 + 0.45 * sin(time * 2.2 + id.x * 1.7 + id.y * 2.1);
        float cell = smoothstep(0.42, 0.18, max(abs(f.x), abs(f.y)));
        return cell * bin * flicker;
      }

      float waveField(vec2 p, vec2 center) {
        float a = 0.0;
        for (int i = 0; i < 7; i++) {
          float fi = float(i);
          vec2 dir = normalize(vec2(cos(fi * 2.399), sin(fi * 1.713)));
          float k = 2.4 + fi * 0.72;
          float phase = dot(p - center * 0.55, dir) * k + time * (0.9 + fi * 0.08);
          a += sin(phase) / (1.5 + fi);
        }
        float pulse = ring(p - center * 0.9, 0.12 + impulse * 0.75, 0.018);
        return a * 0.46 + pulse * 1.2;
      }

      vec3 palette(float x) {
        vec3 a = vec3(0.04, 0.06, 0.09);
        vec3 b = vec3(0.14, 0.62, 0.75);
        vec3 c = vec3(0.95, 0.48, 0.22);
        vec3 d = vec3(0.92, 0.95, 0.78);
        return mix(mix(a, b, smoothstep(-0.7, 0.25, x)), mix(c, d, smoothstep(0.15, 1.0, x)), smoothstep(0.08, 0.82, x));
      }

      vec3 beauty(vec2 p, vec2 uv) {
        float w = waveField(p, pointer);
        float wake = smoothstep(0.2, 1.0, abs(w));
        float spec = spectralCell(uv * 0.62 + 0.19);
        float grid = max(line(fract((p.x + 1.0) * 7.0) - 0.5, 0.018), line(fract((p.y + 1.0) * 7.0) - 0.5, 0.018));
        vec3 col = palette(w);
        col += vec3(0.25, 0.65, 0.85) * spec;
        col += vec3(0.96, 0.62, 0.32) * ring(p - pointer * 0.9, 0.24 + 0.12 * sin(time), 0.02);
        col += grid * wake * vec3(0.05, 0.16, 0.2);
        return col;
      }

      vec3 spectrum(vec2 p, vec2 uv) {
        vec2 q = uv * 0.82 + 0.09;
        vec2 id = floor(q * 16.0);
        vec2 f = fract(q * 16.0) - 0.5;
        float dist = length(id - vec2(7.5));
        float amp = exp(-dist * 0.24) * (0.55 + 0.45 * sin(time * 2.0 + id.x * 0.8));
        float bin = smoothstep(0.47, 0.22, max(abs(f.x), abs(f.y))) * amp;
        float phaseLine = line(f.y - sin(id.x * 0.55 + time) * 0.18, 0.035);
        float axis = line(p.x, 0.008) + line(p.y, 0.008);
        return vec3(0.02, 0.04, 0.06) + bin * vec3(0.15, 0.8, 0.9) + phaseLine * amp * vec3(0.95, 0.5, 0.2) + axis * vec3(0.2, 0.26, 0.28);
      }

      vec3 stages(vec2 p, vec2 uv) {
        float colId = floor(uv.x * 6.0);
        float lane = fract(uv.x * 6.0) - 0.5;
        float row = fract(uv.y * 8.0) - 0.5;
        float stage = smoothstep(0.42, 0.08, abs(lane)) * smoothstep(0.42, 0.08, abs(row));
        float swap = step(0.5, fract((colId + floor(time * 2.0)) * 0.5));
        float energy = 0.45 + 0.55 * sin(time * (1.0 + colId * 0.09) + colId * 1.4);
        vec3 a = vec3(0.1, 0.7, 0.82);
        vec3 b = vec3(0.95, 0.45, 0.25);
        vec3 col = mix(a, b, swap) * stage * energy;
        col += squareFrame(vec2(lane, row), 0.44, 0.018) * vec3(0.75);
        col += ring(p - pointer * 0.8, 0.16 + impulse * 0.5, 0.02) * vec3(1.0, 0.85, 0.52);
        return col + vec3(0.015, 0.02, 0.03);
      }

      vec3 depthLanes(vec2 p, vec2 uv) {
        float lane = floor(uv.x * 4.0);
        float x = fract(uv.x * 4.0) - 0.5;
        float sampleA = 0.5 + 0.5 * sin((p.y + lane * 0.22) * 7.0 + time);
        float sampleB = 0.5 + 0.5 * sin((p.y - lane * 0.11) * 11.0 - time * 1.4);
        float mn = min(sampleA, sampleB);
        float mx = max(sampleA, sampleB);
        float s0 = sampleA;
        float resolved = mix(mix(s0, mn, step(1.0, lane)), mx, step(2.0, lane));
        resolved = mix(resolved, abs(sampleA - sampleB), step(3.0, lane));
        float plot = line(x + (resolved - 0.5) * 0.72, 0.025);
        float dividers = line(fract(uv.x * 4.0), 0.01);
        vec3 col = vec3(0.02, 0.025, 0.035) + plot * mix(vec3(0.2, 0.85, 0.9), vec3(1.0, 0.48, 0.2), lane / 3.0);
        col += dividers * vec3(0.25, 0.28, 0.3);
        col += spectralCell(uv * vec2(0.6, 1.0) + vec2(0.2, 0.0)) * 0.16;
        return col;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / resolution;
        vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
        vec3 c1 = beauty(p, uv);
        vec3 c2 = spectrum(p, uv);
        vec3 c3 = stages(p, uv);
        vec3 c4 = depthLanes(p, uv);
        vec3 col = c1;
        col = mix(col, c2, step(1.5, mode));
        col = mix(col, c3, step(2.5, mode));
        col = mix(col, c4, step(3.5, mode));
        float vignette = smoothstep(1.45, 0.2, length(p));
        gl_FragColor = vec4(pow(max(col * vignette, vec3(0.0)), vec3(0.92)), 1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    let program;
    try {
      program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
    } catch (err) {
      errorEl.textContent = err.message;
      return;
    }

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.useProgram(program);
    const pos = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, 'resolution'),
      time: gl.getUniformLocation(program, 'time'),
      pointer: gl.getUniformLocation(program, 'pointer'),
      impulse: gl.getUniformLocation(program, 'impulse'),
      mode: gl.getUniformLocation(program, 'mode')
    };

    let mode = 1;
    let pointer = { x: 0.12, y: -0.08 };
    let impulseStart = -10;
    const start = performance.now();

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const w = Math.floor(innerWidth * dpr);
      const h = Math.floor(innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function setPointer(ev) {
      const x = ev.clientX / innerWidth * 2 - 1;
      const y = 1 - ev.clientY / innerHeight * 2;
      const aspectSafe = Math.min(innerWidth, innerHeight) / innerWidth;
      pointer = { x: x / Math.max(aspectSafe, 0.001), y };
    }

    addEventListener('pointermove', (ev) => {
      if (ev.buttons) setPointer(ev);
    });
    addEventListener('pointerdown', (ev) => {
      setPointer(ev);
      impulseStart = (performance.now() - start) / 1000;
    });
    addEventListener('keydown', (ev) => {
      if (ev.key >= '1' && ev.key <= '4') mode = Number(ev.key);
      if (ev.code === 'Space') impulseStart = (performance.now() - start) / 1000;
    });

    function frame(now) {
      resize();
      const t = (now - start) / 1000;
      const impulse = Math.max(0, 1 - (t - impulseStart) * 0.9);
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform1f(uniforms.time, t);
      gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
      gl.uniform1f(uniforms.impulse, impulse);
      gl.uniform1f(uniforms.mode, mode);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
<!-- mobile-preset-controls:v1 -->
<style>
  .mobile-preset-controls {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 2147483647;
    display: flex;
    justify-content: center;
    gap: 7px;
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .mobile-preset-controls button {
    pointer-events: auto;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    min-width: 38px;
    height: 38px;
    padding: 0 12px;
    background: rgba(8, 10, 14, 0.68);
    color: rgba(255, 255, 255, 0.92);
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    touch-action: manipulation;
  }
  .mobile-preset-controls button:active,
  .mobile-preset-controls button.is-active {
    background: rgba(255, 221, 128, 0.86);
    color: #101014;
    border-color: rgba(255, 255, 255, 0.72);
  }
  @media (hover: hover) and (pointer: fine) {
    .mobile-preset-controls { opacity: 0.42; transition: opacity 160ms ease; }
    .mobile-preset-controls:hover { opacity: 1; }
  }
  @media (max-width: 520px) {
    .mobile-preset-controls { gap: 6px; }
    .mobile-preset-controls button { min-width: 34px; height: 36px; padding: 0 10px; font-size: 12px; }
  }
</style>
<div class="mobile-preset-controls" aria-label="Preset controls">
  <button type="button" data-mobile-key="1" aria-label="Preset 1">1</button>
  <button type="button" data-mobile-key="2" aria-label="Preset 2">2</button>
  <button type="button" data-mobile-key="3" aria-label="Preset 3">3</button>
  <button type="button" data-mobile-key="4" aria-label="Preset 4">4</button>
  <button type="button" data-mobile-key="5" aria-label="Preset 5">5</button>
  <button type="button" data-mobile-key="Space" aria-label="Pulse">Pulse</button>
</div>
<script>
(() => {
  const dock = document.currentScript.previousElementSibling;
  if (!dock || dock.dataset.ready === 'true') return;
  dock.dataset.ready = 'true';
  const sendKey = (keyName) => {
    const isSpace = keyName === 'Space';
    const key = isSpace ? ' ' : keyName;
    const code = isSpace ? 'Space' : 'Digit' + keyName;
    const eventInit = { key, code, bubbles: true, cancelable: true };
    window.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    document.dispatchEvent(new KeyboardEvent('keydown', eventInit));
    if (isSpace) {
      window.setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent('keyup', eventInit));
        document.dispatchEvent(new KeyboardEvent('keyup', eventInit));
      }, 140);
    }
  };
  dock.querySelectorAll('button').forEach((button) => {
    const keyName = button.dataset.mobileKey;
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
      dock.querySelectorAll('button').forEach((item) => item.classList.remove('is-active'));
      button.classList.add('is-active');
      sendKey(keyName);
    });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
  });
})();
</script>
</body>
</html>
