<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stable Splat Reflection Orbit</title>
<style>html,body{margin:0;height:100%;background:#080b17;color:#e9f4ff;font:12px/1.4 ui-monospace,monospace;overflow:hidden}canvas{width:100%;height:100%;display:block}#ui{position:fixed;left:16px;top:14px;text-shadow:0 1px 8px #000}b{color:#ffe283}kbd{border:1px solid #80744b;border-radius:3px;padding:1px 4px}</style>
<canvas></canvas><div id="ui"><b>STEADY SPLAT / REFLECTION ORBIT</b><br>pointer: attention orbit　click / Space: motion reset<br><kbd>1</kbd> samples　<kbd>2</kbd> stable order　<kbd>3</kbd> temporal settle　<kbd>4</kbd> composite</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let p={x:.5,y:.5},mode=4,motion=1,t0=performance.now();addEventListener('pointermove',e=>{p={x:e.clientX/innerWidth,y:e.clientY/innerHeight};motion=1});addEventListener('pointerdown',()=>motion=1);addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')mode=+e.key;if(e.code==='Space')motion=1});function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();
function f(n){return (Math.sin(n*127.1)*43758.5453)%1}function draw(now){let w=innerWidth,h=innerHeight,t=(now-t0)/1000;motion*=.985;let settle=1-motion;x.fillStyle='#080b17';x.fillRect(0,0,w,h);let cx=w*(.2+.6*p.x),cy=h*(.28+.44*p.y);if(mode===1||mode===4){for(let i=0;i<260;i++){let a=i*2.399+r(i)*motion*3,rr=25+(i%25)*7;let qx=cx+Math.cos(a)*rr,qy=cy+Math.sin(a)*rr*.52;x.fillStyle=`hsla(${185+i%80},90%,70%,${.12+.3*r(i+4)})`;x.beginPath();x.ellipse(qx,qy,2+(i%5),1+(i%3),a,0,7);x.fill()}}
if(mode===2||mode===4){x.strokeStyle='rgba(255,226,131,.42)';x.beginPath();for(let i=0;i<120;i++){let a=i/120*7+t*.2,q=76+Math.sin(i*.7)*17;x.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q*.48)}x.stroke();x.fillStyle='#ffe283';x.fillText('deterministic depth order',cx-70,cy-92)}
if(mode===3||mode===4){x.globalCompositeOperation='screen';for(let i=0;i<48;i++){let a=i*.64+t*.7,r=120+i%9*9;let al=.02+settle*.08;x.fillStyle=`rgba(131,224,255,${al})`;x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.4,20+settle*35,0,7);x.fill()}x.globalCompositeOperation='source-over';x.fillStyle='#b7eeff';x.fillText('history '+Math.round(settle*16)+'/16  • reset by motion',cx-82,cy+118)}
x.fillStyle='#dce8ff';x.fillText('stable sort makes the reflected constellation hold still before the next move',16,h-18);requestAnimationFrame(draw)}function r(n){return Math.abs(f(n))}requestAnimationFrame(draw);
</script></html>
