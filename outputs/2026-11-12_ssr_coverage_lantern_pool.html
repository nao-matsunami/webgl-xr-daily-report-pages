<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSR Coverage Lantern Pool</title><style>html,body{margin:0;background:#060b13;color:#e9efff;font:12px ui-monospace,monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:fixed;left:16px;top:15px;line-height:1.65;pointer-events:none;text-shadow:0 1px 4px #000}b{color:#9deaff}kbd{border:1px solid #587f9d;padding:1px 4px;border-radius:3px}</style><canvas></canvas><div id="ui"><b>SSR COVERAGE / LANTERN POOL</b><br>pointer: reflection angle　click/Space: reflection cut　<kbd>1</kbd> coverage <kbd>2</kbd> history <kbd>3</kbd> fallback <kbd>4</kbd> composite<br><span id="status"></span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#status');let mode=4,mx=.5,my=.5,kick=0,last=0;const lamps=Array.from({length:72},(_,i)=>({x:Math.random(),z:Math.random(),p:Math.random()*6.28,h:0}));function rs(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}rs();addEventListener('resize',rs);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});function cut(){kick=1;lamps.forEach(q=>q.h=0)}addEventListener('pointerdown',cut);addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')mode=+e.key;if(e.code==='Space')cut()});
function dot(X,Y,r,col){let q=g.createRadialGradient(X,Y,0,X,Y,r);q.addColorStop(0,col);q.addColorStop(.22,col.replace('1)', '.35)'));q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(X-r,Y-r,r*2,r*2)}function frame(t){let dt=Math.min(.05,(t-last||16)/1000);last=t;kick*=.93;g.fillStyle='#060b13';g.fillRect(0,0,innerWidth,innerHeight);let water=innerHeight*.47;let bg=g.createLinearGradient(0,0,0,water);bg.addColorStop(0,'#111d38');bg.addColorStop(1,'#426784');g.fillStyle=bg;g.fillRect(0,0,innerWidth,water);g.fillStyle='#081d2a';g.fillRect(0,water,innerWidth,innerHeight-water);let coverage=0;lamps.forEach((q,i)=>{let X=q.x*innerWidth,Y=water*(.16+.6*q.z)+Math.sin(t*.001+q.p)*8;let angle=Math.abs(mx-q.x)*1.22+Math.abs(my-(.4+q.z*.25))*.5;let cov=Math.max(0,1-angle-kick*.38);coverage+=cov;q.h+=(cov-q.h)*dt*3;let R=5+q.z*12;if(mode===1){g.strokeStyle=`rgba(88,208,255,${.12+.6*cov})`;g.beginPath();g.arc(X,Y,R+7,0,7);g.stroke()}else if(mode===2){dot(X+(mx-.5)*35,Y+(my-.5)*18,R+14,`rgba(120,198,255,${q.h*.7})`)}else if(mode===3){dot(X,Y,R+20,`rgba(255,167,102,${(1-cov)*.38})`)}else{dot(X,Y,R,`rgba(255,210,139,${.35+.6*cov})`);dot(X+(mx-.5)*42,water+(water-Y)*.96,R*(1.5+q.z),cov>.09?`rgba(102,210,255,${cov*.58})`:`rgba(255,131,94,.22)`);if(cov<.1){g.strokeStyle='rgba(255,102,120,.42)';g.beginPath();g.arc(X,water+(water-Y)*.96,R+8,0,7);g.stroke()}}});g.strokeStyle='rgba(185,232,255,.18)';for(let i=0;i<15;i++){let y=water+i*24;g.beginPath();g.moveTo(0,y);g.quadraticCurveTo(innerWidth*.5,y+Math.sin(t*.001+i)*10,innerWidth,y);g.stroke()}s.textContent=`coverage ${(coverage/lamps.length).toFixed(2)} · covered radiance retained; misses use sky fallback · ${kick>.1?'history reset':'temporal settle'} · mode ${mode}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
